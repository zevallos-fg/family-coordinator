# Family Co AI — remote MCP server.
#
# Deliberately a SEPARATE Worker from ../wrangler.toml (aged-dust-551a). That one
# holds ANTHROPIC_KEY; secrets are per-Worker in Cloudflare, so keeping these
# apart means the AI-parsing routes cannot reach this Worker's stored refresh
# tokens and this Worker cannot reach the Anthropic key.
name = "familyco-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Pinned because the deploy token is scoped to Workers Scripts:Edit and Workers
# KV Storage:Edit and nothing else. Without an account here, wrangler first calls
# /memberships to work out which account to use, which needs User Details:Read —
# and fails with "Authentication error [code: 10000]" that reads like a Workers
# permission problem and is not one. An account id is an identifier, not a
# credential; the token that can act on it is not in this repo.
account_id = "7093d01612de7f4615fa5bc9c49a8fb6"

# Persist console.log to Workers Logs, queryable in the dashboard.
# `wrangler tail` has now failed twice on this machine — it dies on Windows with
# "error while propagating signal to process: not supported by windows" and
# captures nothing — so the observability path needs to not depend on it.
[observability]
enabled = true

[vars]
# Non-secret. The one project this Worker may talk to; enforced in code, and the
# only Supabase origin any request is allowed to reach.
SUPABASE_URL = "https://pmficrajnyeuworrqytn.supabase.co"

# Secrets — set with `wrangler secret put <NAME>`, never committed:
#   SUPABASE_ANON_KEY    public anon key; required as the `apikey` header. Not a
#                        privilege: on its own it is role=anon and RLS-bound.
#
# Connector tokens are NOT a secret here. They live in the TOKENS KV namespace,
# keyed by SHA-256, written by scripts/link-user.mjs — the single writer of both
# halves of a linked user. They used to be a secret map maintained by hand from a
# value that script printed, which drifted from the KV half exactly as that
# arrangement invites.
#
# Explicitly NOT set here, and the code has no path that would use one:
#   SUPABASE_SERVICE_ROLE_KEY, any Supabase PAT, and — since the switch to
#   refresh tokens — SUPABASE_JWT_SECRET. That secret could sign a
#   role:"service_role" token and bypass RLS entirely, so holding it was as
#   powerful as holding the service-role key. This Worker can no longer mint a
#   token at all; it can only present one it was given.

# Per-user refresh tokens (refresh:<uuid>) and short-lived cached access tokens
# (access:<uuid>). Create with:
#   wrangler kv namespace create TOKENS
# then paste the returned id below.
#
# This is the Worker's most sensitive store: a refresh token is a standing
# credential for one user. It is scoped to that user, carries no elevated role,
# and Fernando revokes it by signing her out.
[[kv_namespaces]]
binding = "TOKENS"
id = "33bd92117073451bae7901b3dd726957"
