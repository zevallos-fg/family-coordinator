<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Coordinator v20</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ZXing barcode library — jsdelivr fallback handled in JS -->
  <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@zxing/library@latest/umd/index.min.js'"></script>
  <style>
    body { background: #EEF2FF; }
    .tab-content { padding-bottom: 5rem; }
    @media(min-width:768px){ .tab-content { padding-bottom: 1rem; } }
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:50; }
    @media(min-width:768px){ .bottom-nav { display:none; } }
    .top-tabs { display:none; }
    @media(min-width:768px){ .top-tabs { display:flex; } }
    .skeleton { animation: pulse 1.5s ease-in-out infinite; background:#E5E7EB; border-radius:0.5rem; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    /* Ensure cameras/images don't overflow on mobile */
    video, img { max-width:100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ── Constants ──────────────────────────────────────────────────────────────
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzgoNn0WDXRCAyRXlXEDcjzVEM6r7AQ4k3htOKo8s1aKZ86xYP7rN0DVJVvgr3W7WD/exec";
    const WORKER_URL        = "https://aged-dust-551a.zevallos-fg.workers.dev";
    const SYNC_INTERVAL     = 5000;
    const V20_POLL_INTERVAL = 30000;

    const DROPOFF_WINDOW = { start:"9:00 AM",  end:"9:30 AM"  };
    const PICKUP_WINDOW  = { start:"12:30 PM", end:"1:00 PM"  };
    const NAP_WINDOW     = { start:"1:30 PM",  end:"2:00 PM"  };

    const DEFAULT_CATEGORIES = [
      { id:'health',    name:'Health & Appointments', icon:'🏥', urgent:true  },
      { id:'school',    name:'School & Activities',   icon:'🎒', urgent:true  },
      { id:'home',      name:'Home Maintenance',      icon:'🔧', urgent:false },
      { id:'financial', name:'Financial',             icon:'💰', urgent:false },
      { id:'social',    name:'Social / Family',       icon:'👨‍👩‍👧', urgent:false },
      { id:'travel',    name:'Travel & Events',       icon:'✈️',  urgent:false },
      { id:'parenting', name:'Parenting / Private',   icon:'🔒', urgent:false },
      { id:'projects',  name:'Projects',              icon:'📋', urgent:false },
      { id:'ideas',     name:'Ideas / Someday',       icon:'💡', urgent:false },
      { id:'hurricane', name:'Hurricane Prep',        icon:'🌀', urgent:false },
    ];
    const DEFAULT_STORES = ['Publix','Whole Foods','Costco','Target'];

    const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const SLOTS = ['Breakfast','Lunch','Dinner','Snack'];

    const DIETARY_TAGS = [
      'pregnancy-safe','iron-rich','folate-rich','high-protein','postpartum-comfort',
      'toddler-friendly','vegetarian','gluten-free','dairy-free','quick-30min',
      'batch-friendly','nut-free','spicy',
    ];

    const TABS = [
      { id:'overview',  label:'Overview',   icon:'🏠' },
      { id:'mealplan',  label:'Meal Plan',  icon:'🍽️' },
      { id:'schedule',  label:'Schedule',   icon:'📅' },
      { id:'dump',      label:'Dump',       icon:'🎤' },
      { id:'organized', label:'Organized',  icon:'🧠' },
      { id:'grocery',   label:'Grocery',    icon:'🛒' },
      { id:'pantry',    label:'Pantry',     icon:'🥫' },
    ];

    // ── Utilities ──────────────────────────────────────────────────────────────
    function uuid() {
      if (crypto?.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random()*16|0;
        return (c==='x'?r:(r&0x3|0x8)).toString(16);
      });
    }

    function nowISO() { return new Date().toISOString(); }

    // Returns Monday of the week containing `date`
    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      d.setHours(0, 0, 0, 0);
      return d;
    }

    // YYYY-Www from a Monday Date
    function toISOWeek(monday) {
      const year = monday.getFullYear();
      const start = new Date(year, 0, 4);          // Jan 4 is always in week 1
      const w1mon = new Date(start);
      w1mon.setDate(start.getDate() - (start.getDay() || 7) + 1);
      const weekNum = Math.round((monday - w1mon) / 604800000) + 1;
      return `${year}-W${String(weekNum).padStart(2,'0')}`;
    }

    // Monday Date from YYYY-Www
    function fromISOWeek(isoWeek) {
      const [y, w] = isoWeek.replace('W','').split('-').map(Number);
      const jan4 = new Date(y, 0, 4);
      const w1mon = new Date(jan4);
      w1mon.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1);
      const d = new Date(w1mon);
      d.setDate(w1mon.getDate() + (w - 1) * 7);
      return d;
    }

    function offsetWeek(isoWeek, delta) {
      const mon = fromISOWeek(isoWeek);
      mon.setDate(mon.getDate() + delta * 7);
      return toISOWeek(mon);
    }

    function formatWeekLabel(isoWeek) {
      const mon = fromISOWeek(isoWeek);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const fmt = d => d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
      return `${fmt(mon)} – ${fmt(sun)}`;
    }

    // Return array of 7 Date objects (Mon–Sun) for an ISO week
    function weekDates(isoWeek) {
      const mon = fromISOWeek(isoWeek);
      return Array.from({length:7}, (_,i) => { const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
    }

    // Days since an ISO date string
    function daysSince(isoDate) {
      if (!isoDate) return Infinity;
      return (Date.now() - new Date(isoDate).getTime()) / 86400000;
    }

    // BRD §5.7 rotation engine — pure function
    function rotationStatus(recipe) {
      if (!recipe) return 'new';
      const cooked = parseInt(recipe.timesCooked || 0);
      if (cooked < 3) return 'new';
      const ds = daysSince(recipe.lastCookedAt);
      if (ds > 90) return 'dormant';
      if (ds > 21) return 'due';
      return 'active';
    }

    // Fuzzy match score (0–1) — Levenshtein ratio
    function fuzzyScore(a, b) {
      a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
      if (a === b) return 1;
      const len = Math.max(a.length, b.length);
      if (!len) return 1;
      let matches = 0;
      for (let i = 0; i < Math.min(a.length, b.length); i++) {
        if (a[i] === b[i]) matches++;
      }
      return matches / len;
    }

    function capitalize(s) {
      if (!s) return '';
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    // ── Category / grocery helpers (preserved from v8.4) ──────────────────────
    function guessCategory(text) {
      const t = text.toLowerCase();
      if (/doctor|dentist|appointment|sick|medicine|pharmacy|pediatr|vaccine|fever|health/.test(t)) return 'health';
      if (/school|teacher|homework|leo|pickup|dropoff|daycare|class|activity|sport/.test(t))        return 'school';
      if (/fix|repair|plumber|ac|roof|paint|clean|leak|handyman|maintenance/.test(t))               return 'home';
      if (/pay|bill|insurance|tax|budget|bank|money|credit|expense|invoice/.test(t))                return 'financial';
      if (/birthday|party|dinner|friend|family|visit|invite|event|celebration/.test(t))             return 'social';
      if (/trip|flight|hotel|vacation|travel|pack|passport|book/.test(t))                           return 'travel';
      if (/private|personal|parenting|discipline|behavior|routine/.test(t))                         return 'parenting';
      if (/project|build|create|design|develop|launch|plan/.test(t))                                return 'projects';
      if (/hurricane|storm|prep|supplies|generator|shutter/.test(t))                                return 'hurricane';
      return 'ideas';
    }

    // ── API layer ──────────────────────────────────────────────────────────────

    // Legacy passthrough to Anthropic (v8.4 schedule analysis + grocery parsing)
    async function callClaude(payload) {
      const res = await fetch(WORKER_URL, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`Worker HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      if (!data.content?.[0]?.text) throw new Error('Unexpected response shape');
      return data.content[0].text;
    }

    // v20 named endpoints
    async function callWorker(path, body) {
      const res = await fetch(`${WORKER_URL}${path}`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`Worker ${path} HTTP ${res.status}`);
      return res.json();
    }

    // Grocery intent — uses Sonnet (per §2b eval, 16/20 fail on Haiku)
    async function parseGroceryIntent(text) {
      try {
        const data = await callClaude({
          model:'claude-sonnet-4-20250514', max_tokens:300,
          messages:[{ role:'user', content:
            `Analyze this voice/text capture from a parent: "${text}"\n\nIs this a grocery/shopping request? If yes, extract individual item names.\n\nReturn ONLY valid JSON:\n{"isGrocery": true, "items": ["oregano", "chili powder"]}\nor\n{"isGrocery": false, "items": []}`
          }]
        });
        const raw = data.replace(/```json|```/g,'').trim();
        const match = raw.match(/\{[\s\S]*\}/);
        return match ? JSON.parse(match[0]) : { isGrocery:false, items:[] };
      } catch { return { isGrocery:false, items:[] }; }
    }

    async function parseItemsFromText(text) {
      try {
        const data = await callClaude({
          model:'claude-sonnet-4-20250514', max_tokens:300,
          messages:[{ role:'user', content:
            `Extract individual grocery item names from this text: "${text}"\n\nReturn ONLY valid JSON:\n{"items": ["item 1", "item 2"]}`
          }]
        });
        const raw = data.replace(/```json|```/g,'').trim();
        const match = raw.match(/\{[\s\S]*\}/);
        const parsed = match ? JSON.parse(match[0]) : null;
        return parsed?.items?.length ? parsed.items : [text];
      } catch { return [text]; }
    }

    // Apps Script GET — returns rows as array of objects
    async function loadSheet(name) {
      const res = await fetch(`${GOOGLE_SCRIPT_URL}?sheet=${encodeURIComponent(name)}`);
      if (!res.ok) throw new Error(`loadSheet ${name} HTTP ${res.status}`);
      return res.json();
    }

    // Apps Script POST — no-cors (can't read response, optimistic writes)
    function sheetWrite(body) {
      return fetch(GOOGLE_SCRIPT_URL, {
        method:'POST', mode:'no-cors',
        body: JSON.stringify(body)
      });
    }

    function appendRow(sheet, row)           { return sheetWrite({ action:'append', sheet, row }); }
    function updateRow(sheet, rowId, row)    { return sheetWrite({ action:'update', sheet, rowId, row }); }
    function deleteRow(sheet, rowId)         { return sheetWrite({ action:'delete', sheet, rowId }); }

    // Open Food Facts barcode lookup (public API, no key)
    async function lookupBarcode(barcode) {
      const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
      if (!res.ok) return null;
      const data = await res.json();
      if (data.status !== 1 || !data.product) return null;
      const p = data.product;
      const n = p.nutriments || {};
      return {
        canonicalName: p.product_name || p.product_name_en || '',
        brand: p.brands || null,
        openFoodFactsBarcode: barcode,
        nutritionPer100g: JSON.stringify({
          kcal:      n['energy-kcal_100g'] || 0,
          protein_g: n['proteins_100g']    || 0,
          carb_g:    n['carbohydrates_100g']|| 0,
          fat_g:     n['fat_100g']          || 0,
          fiber_g:   n['fiber_100g']        || 0,
          sodium_mg: (n['sodium_100g']||0)*1000,
          iron_mg:   n['iron_100g']         || 0,
          folate_ug: n['folate_100g']       || 0,
          calcium_mg:(n['calcium_100g']||0)*1000,
        }),
      };
    }

    // ── WeekNavigator component ────────────────────────────────────────────────
    function WeekNavigator({ week, onChange, label }) {
      return (
        <div className="flex items-center justify-between bg-white rounded-2xl shadow px-4 py-3 mb-4">
          <button onClick={() => onChange(offsetWeek(week, -1))}
            className="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 text-gray-500 text-xl font-bold">‹</button>
          <div className="text-center">
            {label && <p className="text-xs text-gray-400 uppercase tracking-wide mb-0.5">{label}</p>}
            <p className="font-semibold text-gray-800 text-sm">{formatWeekLabel(week)}</p>
            <p className="text-xs text-indigo-500">{week}</p>
          </div>
          <button onClick={() => onChange(offsetWeek(week, +1))}
            className="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 text-gray-500 text-xl font-bold">›</button>
        </div>
      );
    }

    // ── Skeleton loading placeholder ───────────────────────────────────────────
    function LoadingSkeleton({ rows = 3 }) {
      return (
        <div className="space-y-3">
          {Array.from({length:rows}).map((_,i) => (
            <div key={i} className="bg-white rounded-2xl shadow p-4">
              <div className="skeleton h-4 w-2/3 mb-2" />
              <div className="skeleton h-3 w-1/2" />
            </div>
          ))}
        </div>
      );
    }

    // ── Tab stub components (filled in later commits) ──────────────────────────
    function OverviewTab({ week, onWeekChange, mealPlanSlots, recipes, weekData, captures, categories, groceries, parent1Name, parent2Name }) {
      const [expandedDay, setExpandedDay] = useState(null);

      const dates   = weekDates(week);
      const urgentItems = captures.filter(c => { const cat = categories.find(x=>x.id===c.category); return cat?.urgent && !c.completed; });
      const unfiledItems= captures.filter(c => !c.completed);
      const groceryPending = groceries.filter(g=>!g.completed).length;

      // Store counts from grocery list
      const storeMap = {};
      groceries.filter(g=>!g.completed).forEach(g => {
        const s = g.store || 'Unassigned';
        storeMap[s] = (storeMap[s]||0) + 1;
      });
      const storeSummary = Object.entries(storeMap).map(([s,n]) => `${n} @ ${s}`).join(' · ');

      // Get meal slots for a day
      const slotsForDay = (dayIdx) => {
        const d = dates[dayIdx];
        const dayName = DAYS[dayIdx];
        return mealPlanSlots.filter(s => s.weekOf === week && s.dayOfWeek === dayName);
      };

      // Leo duty icons from v8.4 weekData
      const leoForDay = (dayIdx) => {
        if (!weekData?.days?.[dayIdx]) return null;
        const d = weekData.days[dayIdx];
        if (d.hidden) return null;
        return {
          dropoff: d.dropoff?.assigned,
          pickup:  d.pickup?.assigned,
          nap:     d.nap?.assigned,
          conflict: d.dropoff?.conflict || d.pickup?.conflict || d.nap?.conflict,
        };
      };

      const dinnerForDay = (dayIdx) => {
        const dayName = DAYS[dayIdx];
        const slot = mealPlanSlots.find(s => s.weekOf === week && s.dayOfWeek === dayName && s.slot === 'Dinner');
        if (!slot) return null;
        if (slot.noteFreeText) return slot.noteFreeText;
        const recipe = recipes.find(r => r.recipeId === slot.recipeId);
        return recipe?.name || null;
      };

      return (
        <div className="space-y-4">
          <WeekNavigator week={week} onChange={onWeekChange} label="Week at a Glance" />

          {/* Grocery summary bar */}
          {groceryPending > 0 && (
            <div className="bg-green-50 border border-green-200 rounded-2xl px-4 py-3 flex items-center justify-between">
              <span className="text-sm font-medium text-green-800">🛒 {groceryPending} item{groceryPending!==1?'s':''} to get</span>
              <span className="text-xs text-green-600">{storeSummary || 'No store assigned'}</span>
            </div>
          )}

          {/* Urgent alert */}
          {urgentItems.length > 0 && (
            <div className="bg-red-50 border-l-4 border-red-500 rounded-2xl px-4 py-3">
              <p className="text-xs font-bold text-red-700 uppercase tracking-wide mb-1">⚡ {urgentItems.length} Urgent item{urgentItems.length!==1?'s':''}</p>
              {urgentItems.slice(0,3).map(c => (
                <p key={c.id} className="text-sm text-red-700 truncate">• {c.content}</p>
              ))}
              {urgentItems.length > 3 && <p className="text-xs text-red-400 mt-1">+{urgentItems.length-3} more in Organized</p>}
            </div>
          )}

          {/* 7 day cards */}
          <div className="space-y-2">
            {dates.map((date, dayIdx) => {
              const dayName    = DAYS[dayIdx];
              const leo        = leoForDay(dayIdx);
              const dinner     = dinnerForDay(dayIdx);
              const daySlots   = slotsForDay(dayIdx);
              const mealCount  = daySlots.filter(s => s.recipeId || s.noteFreeText).length;
              const isToday    = date.toDateString() === new Date().toDateString();
              const isExpanded = expandedDay === dayIdx;

              return (
                <div key={dayIdx} className={`bg-white rounded-2xl shadow-sm overflow-hidden border-l-4 ${isToday?'border-indigo-500':'border-transparent'}`}>
                  {/* Collapsed row */}
                  <button className="w-full px-4 py-3 flex items-center gap-3 text-left hover:bg-gray-50" onClick={()=>setExpandedDay(isExpanded?null:dayIdx)}>
                    {/* Day label */}
                    <div className={`w-12 text-center flex-shrink-0 rounded-xl py-1 ${isToday?'bg-indigo-100':'bg-gray-50'}`}>
                      <p className={`text-xs font-bold ${isToday?'text-indigo-700':'text-gray-500'}`}>{dayName}</p>
                      <p className={`text-lg font-bold leading-tight ${isToday?'text-indigo-800':'text-gray-700'}`}>{date.getDate()}</p>
                    </div>

                    {/* Leo duty icons */}
                    <div className="flex gap-1 flex-shrink-0">
                      {leo ? (
                        <>
                          <span className={`text-xs px-1.5 py-0.5 rounded ${leo.dropoff==='DISCUSS'?'bg-red-100 text-red-600':'bg-blue-50 text-blue-600'}`} title="Drop-off">🚗</span>
                          <span className={`text-xs px-1.5 py-0.5 rounded ${leo.pickup==='DISCUSS'?'bg-red-100 text-red-600':'bg-green-50 text-green-600'}`} title="Pick-up">🏠</span>
                          {leo.conflict && <span className="text-xs text-red-500" title="Conflict">⚠️</span>}
                        </>
                      ) : (
                        <span className="text-xs text-gray-300">—</span>
                      )}
                    </div>

                    {/* Dinner slot */}
                    <div className="flex-1 min-w-0">
                      {dinner ? (
                        <p className="text-sm text-gray-800 truncate">🍽️ {dinner}</p>
                      ) : (
                        <p className="text-sm text-gray-300 italic">No dinner planned</p>
                      )}
                    </div>

                    {/* Counts + chevron */}
                    <div className="flex items-center gap-2 flex-shrink-0">
                      {mealCount > 0 && <span className="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">{mealCount} meals</span>}
                      <span className="text-gray-400 text-sm">{isExpanded?'▼':'▶'}</span>
                    </div>
                  </button>

                  {/* Expanded detail */}
                  {isExpanded && (
                    <div className="border-t px-4 pb-4 pt-3 bg-gray-50 space-y-3">
                      {/* Leo duties */}
                      {leo && (
                        <div>
                          <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Leo duties</p>
                          <div className="flex gap-2 flex-wrap">
                            {[{k:'dropoff',icon:'🚗',label:'Drop-off'},{k:'pickup',icon:'🏠',label:'Pick-up'},{k:'nap',icon:'😴',label:'Nap'}].map(({k,icon,label}) => (
                              <span key={k} className={`text-xs px-2 py-1 rounded-lg ${weekData.days[dayIdx][k]?.assigned==='DISCUSS'?'bg-red-100 text-red-700':'bg-white border text-gray-700'}`}>
                                {icon} {label}: <strong>{weekData.days[dayIdx][k]?.assigned}</strong>
                              </span>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* All meal slots */}
                      <div>
                        <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Meals</p>
                        <div className="grid grid-cols-2 gap-1.5">
                          {SLOTS.map(slot => {
                            const s = mealPlanSlots.find(x => x.weekOf===week && x.dayOfWeek===dayName && x.slot===slot);
                            const recipe = s?.recipeId ? recipes.find(r=>r.recipeId===s.recipeId) : null;
                            const label  = s?.noteFreeText || recipe?.name;
                            return (
                              <div key={slot} className={`text-xs rounded-lg px-2 py-1.5 ${label?'bg-indigo-50 text-indigo-800':'bg-white border text-gray-300 italic'}`}>
                                <span className="font-medium text-gray-400">{slot[0]}: </span>
                                {label || '—'}
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      {/* Urgent items for this day (any — overview doesn't filter by day) */}
                      {dayIdx === 0 && urgentItems.length > 0 && (
                        <div>
                          <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Urgent</p>
                          {urgentItems.map(c => (
                            <p key={c.id} className="text-xs text-red-700 bg-red-50 rounded px-2 py-1 mb-1 truncate">• {c.content}</p>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Unfiled captures summary */}
          {unfiledItems.length > 0 && (
            <div className="bg-white rounded-2xl shadow p-4">
              <p className="text-sm font-semibold text-gray-700 mb-2">🧠 {unfiledItems.length} pending capture{unfiledItems.length!==1?'s':''}</p>
              <div className="flex flex-wrap gap-1.5">
                {unfiledItems.slice(0,5).map(c => {
                  const cat = categories.find(x=>x.id===c.category);
                  return <span key={c.id} className="text-xs bg-gray-100 text-gray-600 rounded-full px-2 py-0.5">{cat?.icon} {c.content.slice(0,30)}{c.content.length>30?'…':''}</span>;
                })}
                {unfiledItems.length > 5 && <span className="text-xs text-gray-400 px-2 py-0.5">+{unfiledItems.length-5} more</span>}
              </div>
            </div>
          )}

          {/* Empty state */}
          {!weekData && mealPlanSlots.length === 0 && captures.length === 0 && groceries.length === 0 && (
            <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
              <div className="text-5xl mb-3">🏠</div>
              <p className="font-medium text-gray-600">Nothing here yet</p>
              <p className="text-sm mt-1">Add meals in Meal Plan, captures in Dump, or upload your schedule</p>
            </div>
          )}

    function MealPlanTab({ week, onWeekChange, recipes, mealPlanSlots, setMealPlanSlots, ingredients, recipeIngredients, pantry, groceries, setGroceries, onAddRecipe, onViewRecipe }) {
      const [slotPicker,  setSlotPicker]  = useState(null); // {dayIdx, slot}
      const [pickerQuery, setPickerQuery] = useState('');
      const [cookByParent,setCookByParent]= useState('Fernando');

      // §17 rotation engine — top-3 suggested (due oldest → active oldest → new newest)
      const suggested = useMemo(() => {
        const withStatus = recipes.map(r => ({ r, status: rotationStatus(r) }));
        const due     = withStatus.filter(x=>x.status==='due')    .sort((a,b)=>daysSince(b.r.lastCookedAt)-daysSince(a.r.lastCookedAt));
        const active  = withStatus.filter(x=>x.status==='active') .sort((a,b)=>daysSince(b.r.lastCookedAt)-daysSince(a.r.lastCookedAt));
        const newRec  = withStatus.filter(x=>x.status==='new')    .sort((a,b)=>new Date(b.r.createdAt)-new Date(a.r.createdAt));
        return [...due,...active,...newRec].slice(0,3).map(x=>x.r);
      }, [recipes]);

      const slotFor = (dayIdx, slot) => mealPlanSlots.find(s => s.weekOf===week && s.dayOfWeek===DAYS[dayIdx] && s.slot===slot);

      const getSlotLabel = (dayIdx, slot) => {
        const s = slotFor(dayIdx, slot);
        if (!s) return null;
        if (s.noteFreeText) return { label: s.noteFreeText, isNote: true, slotId: s.slotId, status: s.cookedStatus };
        const r = recipes.find(r=>r.recipeId===s.recipeId);
        return r ? { label: r.name, isNote: false, slotId: s.slotId, recipeId: r.recipeId, status: s.cookedStatus } : null;
      };

      const assignSlot = (recipeId, noteText) => {
        if (!slotPicker) return;
        const { dayIdx, slot } = slotPicker;
        const dayName = DAYS[dayIdx];
        const existing = slotFor(dayIdx, slot);
        const newSlot = {
          slotId: existing?.slotId || uuid(),
          weekOf: week, dayOfWeek: dayName, slot,
          recipeId: recipeId || '', servingsPlanned: 1,
          noteFreeText: noteText || '', cookBy: cookByParent,
          cookedStatus: 'planned',
        };
        const updated = existing
          ? mealPlanSlots.map(s=>s.slotId===existing.slotId?newSlot:s)
          : [...mealPlanSlots, newSlot];
        setMealPlanSlots(updated);
        if (existing) updateRow('MealPlanSlots', newSlot.slotId, newSlot);
        else appendRow('MealPlanSlots', newSlot);

        // Project recipe ingredients to grocery list
        if (recipeId && !noteText) projectToGrocery(recipeId, dayName);

        setSlotPicker(null); setPickerQuery('');
      };

      const projectToGrocery = (recipeId, dayLabel) => {
        const ris = recipeIngredients.filter(ri => ri.recipeId === recipeId);
        if (!ris.length) return;
        const newItems = ris.map(ri => {
          const ing = ingredients.find(i=>i.ingredientId===ri.ingredientId);
          return {
            id: Date.now() + Math.random(),
            name: ing?.canonicalName || ri.ingredientId,
            store: ing?.preferredStore || '',
            completed: false,
            addedBy: 'Meal Plan',
            timestamp: nowISO(),
            ingredientId: ri.ingredientId || '',
            quantity: ri.quantity || '',
            unit: ri.unit || '',
            pantryBacked: false,
          };
        });
        setGroceries(g => [...g, ...newItems]);
      };

      const markCooked = (slotId) => {
        const s = mealPlanSlots.find(x=>x.slotId===slotId);
        if (!s) return;
        const updated = mealPlanSlots.map(x=>x.slotId===slotId?{...x,cookedStatus:'cooked'}:x);
        setMealPlanSlots(updated);
        updateRow('MealPlanSlots', slotId, { cookedStatus:'cooked' });
        // Increment timesCooked + lastCookedAt on recipe
        if (s.recipeId) {
          const r = recipes.find(x=>x.recipeId===s.recipeId);
          if (r) {
            const patch = { timesCooked: (parseInt(r.timesCooked||0)+1), lastCookedAt: nowISO() };
            updateRow('Recipes', s.recipeId, patch);
          }
        }
      };

      const markSkipped = (slotId) => {
        const updated = mealPlanSlots.map(s=>s.slotId===slotId?{...s,cookedStatus:'skipped'}:s);
        setMealPlanSlots(updated);
        updateRow('MealPlanSlots', slotId, { cookedStatus:'skipped' });
      };

      const clearSlot = (slotId) => {
        setMealPlanSlots(p=>p.filter(s=>s.slotId!==slotId));
        deleteRow('MealPlanSlots', slotId);
      };

      const filteredRecipes = pickerQuery
        ? recipes.filter(r => r.name?.toLowerCase().includes(pickerQuery.toLowerCase()))
        : recipes;

      const statusBadge = (status) => {
        if (status === 'cooked')  return 'bg-green-100 text-green-700';
        if (status === 'skipped') return 'bg-gray-100 text-gray-400';
        return 'bg-indigo-50 text-indigo-700';
      };

      return (
        <div className="space-y-4">
          <WeekNavigator week={week} onChange={onWeekChange} label="Meal Plan" />

          {/* Rotation suggestion strip */}
          {suggested.length > 0 && (
            <div className="bg-white rounded-2xl shadow p-4">
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">💡 Suggested from rotation</p>
              <div className="flex gap-2 overflow-x-auto pb-1">
                {suggested.map(r => {
                  const st = rotationStatus(r);
                  return (
                    <button key={r.recipeId} onClick={()=>onViewRecipe(r.recipeId)}
                      className="flex-shrink-0 text-left bg-indigo-50 hover:bg-indigo-100 rounded-xl px-3 py-2 min-w-[120px] transition-colors">
                      <p className="text-xs font-semibold text-indigo-800 truncate">{r.name}</p>
                      <p className="text-xs text-indigo-500 mt-0.5">{st==='due'?'⏰ Due':st==='active'?'✅ Active':'🆕 New'}</p>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* 4×7 grid */}
          <div className="bg-white rounded-2xl shadow overflow-hidden">
            {/* Header row */}
            <div className="grid grid-cols-8 border-b">
              <div className="p-2 text-xs text-gray-400" />
              {DAYS.map((d,i) => {
                const date = weekDates(week)[i];
                const isToday = date.toDateString()===new Date().toDateString();
                return (
                  <div key={d} className={`p-2 text-center border-l ${isToday?'bg-indigo-50':''}`}>
                    <p className={`text-xs font-bold ${isToday?'text-indigo-600':'text-gray-500'}`}>{d}</p>
                    <p className={`text-xs ${isToday?'text-indigo-400':'text-gray-300'}`}>{date.getDate()}</p>
                  </div>
                );
              })}
            </div>
            {/* Slot rows */}
            {SLOTS.map(slot => (
              <div key={slot} className="grid grid-cols-8 border-b last:border-b-0">
                <div className="p-2 flex items-center bg-gray-50 border-r">
                  <span className="text-xs font-medium text-gray-500 leading-tight">{slot[0]}</span>
                </div>
                {DAYS.map((day, dayIdx) => {
                  const entry = getSlotLabel(dayIdx, slot);
                  return (
                    <div key={day} className="border-l min-h-[52px] relative group">
                      {entry ? (
                        <div className={`h-full p-1 flex flex-col justify-between ${statusBadge(entry.status)} cursor-pointer`}
                          onClick={()=>entry.recipeId&&onViewRecipe(entry.recipeId)}>
                          <p className="text-xs leading-tight font-medium truncate">{entry.label}</p>
                          <div className="flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                            {entry.status==='planned'&&(
                              <button onClick={e=>{e.stopPropagation();markCooked(entry.slotId);}} className="text-green-600 hover:bg-green-100 rounded px-1 text-xs" title="Mark cooked">✓</button>
                            )}
                            <button onClick={e=>{e.stopPropagation();clearSlot(entry.slotId);}} className="text-red-400 hover:bg-red-50 rounded px-1 text-xs" title="Clear">×</button>
                          </div>
                          {entry.status==='cooked' && <span className="text-xs">✅</span>}
                          {entry.status==='skipped'&& <span className="text-xs">⏭️</span>}
                        </div>
                      ) : (
                        <button onClick={()=>{setSlotPicker({dayIdx,slot});setPickerQuery('');}}
                          className="w-full h-full flex items-center justify-center text-gray-200 hover:text-indigo-400 hover:bg-indigo-50 transition-colors text-lg">
                          +
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {/* Add recipe FAB */}
          <button onClick={onAddRecipe}
            className="fixed bottom-20 right-5 md:bottom-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-indigo-700 z-30">
            +
          </button>

          {/* Slot picker bottom sheet */}
          {slotPicker && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end" onClick={()=>setSlotPicker(null)}>
              <div className="bg-white rounded-t-3xl w-full max-h-[75vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
                <div className="p-4 border-b flex items-center justify-between">
                  <h3 className="font-semibold text-gray-800">{DAYS[slotPicker.dayIdx]} — {slotPicker.slot}</h3>
                  <button onClick={()=>setSlotPicker(null)} className="text-gray-400 hover:text-gray-600 text-xl">×</button>
                </div>
                <div className="p-4 space-y-3">
                  {/* Cook-by */}
                  <div className="flex gap-2">
                    {['Fernando','Yenny','Both'].map(p => (
                      <button key={p} onClick={()=>setCookByParent(p)}
                        className={`flex-1 py-1.5 rounded-xl text-sm border transition-all ${cookByParent===p?'bg-indigo-600 text-white border-indigo-600':'border-gray-200 text-gray-600'}`}>{p}</button>
                    ))}
                  </div>
                  {/* Free-text note */}
                  <div className="flex gap-2">
                    <input placeholder="Free note (e.g. ordered pizza)…" id="slotNote"
                      className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                    <button onClick={()=>assignSlot(null, document.getElementById('slotNote').value.trim()||null)}
                      className="px-4 py-2 bg-gray-700 text-white rounded-xl text-sm font-medium">Add note</button>
                  </div>
                  {/* Rotation suggestions */}
                  {suggested.length > 0 && (
                    <div>
                      <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Suggested</p>
                      {suggested.map(r => (
                        <button key={r.recipeId} onClick={()=>assignSlot(r.recipeId, null)}
                          className="w-full text-left flex items-center justify-between px-3 py-2 rounded-xl hover:bg-indigo-50 mb-1">
                          <span className="text-sm font-medium text-gray-800">{r.name}</span>
                          <span className={`text-xs px-2 py-0.5 rounded-full ${rotationStatus(r)==='due'?'bg-orange-100 text-orange-700':rotationStatus(r)==='active'?'bg-green-100 text-green-700':'bg-blue-100 text-blue-700'}`}>
                            {rotationStatus(r)}
                          </span>
                        </button>
                      ))}
                    </div>
                  )}
                  {/* Search all recipes */}
                  <input value={pickerQuery} onChange={e=>setPickerQuery(e.target.value)}
                    placeholder="Search all recipes…" className="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                  {filteredRecipes.map(r => (
                    <button key={r.recipeId} onClick={()=>assignSlot(r.recipeId, null)}
                      className="w-full text-left flex items-center justify-between px-3 py-2 rounded-xl hover:bg-gray-50">
                      <span className="text-sm text-gray-800">{r.name}</span>
                      <span className="text-xs text-gray-400">{r.cuisine||''}</span>
                    </button>
                  ))}
                  {filteredRecipes.length === 0 && <p className="text-sm text-gray-400 text-center py-4">No recipes yet — add one with the + button</p>}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PantryTab({ pantry, setPantry, ingredients, setIngredients, onBarcodeOpen, onReceiptOpen }) {
      const [query,       setQuery]       = useState('');
      const [sortBy,      setSortBy]      = useState('added'); // added | expiry
      const [editingRow,  setEditingRow]  = useState(null);
      const [manualModal, setManualModal] = useState(false);
      const [manualForm,  setManualForm]  = useState({ ingredientName:'', quantity:'', unit:'piece', expiryDate:'' });

      const ingName = (ingredientId) => {
        const ing = ingredients.find(i=>i.ingredientId===ingredientId);
        return ing?.canonicalName || ingredientId;
      };

      const rows = pantry
        .filter(p => ingName(p.ingredientId).toLowerCase().includes(query.toLowerCase()))
        .sort((a,b) => {
          if (sortBy === 'expiry') {
            if (!a.expiryDate && !b.expiryDate) return 0;
            if (!a.expiryDate) return 1;
            if (!b.expiryDate) return -1;
            return new Date(a.expiryDate) - new Date(b.expiryDate);
          }
          return new Date(b.addedAt||0) - new Date(a.addedAt||0);
        });

      const expiryClass = (expiryDate) => {
        if (!expiryDate) return '';
        const days = (new Date(expiryDate) - Date.now()) / 86400000;
        if (days <= 3)  return 'text-red-600 font-semibold';
        if (days <= 7)  return 'text-orange-500';
        return 'text-gray-500';
      };

      const ADDED_VIA_LABEL = {
        manual:           '✏️ Manual',
        barcode_scan:     '📱 Scan',
        receipt_photo:    '📷 Receipt',
        receipt_digital:  '📧 Email',
        grocery_completion:'🛒 Grocery',
      };

      const updateQty = (pantryId, quantity) => {
        setPantry(ps=>ps.map(p=>p.pantryId===pantryId?{...p,quantity}:p));
        updateRow('Pantry', pantryId, { quantity });
      };

      const deleteEntry = (pantryId) => {
        setPantry(ps=>ps.filter(p=>p.pantryId!==pantryId));
        deleteRow('Pantry', pantryId);
      };

      const addManual = () => {
        if (!manualForm.ingredientName.trim()) return;
        // Fuzzy-find or create ingredient
        const existing = ingredients.find(i => fuzzyScore(i.canonicalName||'',manualForm.ingredientName.trim()) >= 0.8);
        let ingredientId;
        if (existing) {
          ingredientId = existing.ingredientId;
        } else {
          ingredientId = uuid();
          const newIng = { ingredientId, canonicalName:manualForm.ingredientName.trim(), lastUpdated:nowISO(), nutritionPer100g:'{}', needsReview:false };
          setIngredients(is=>[...is,newIng]);
          appendRow('Ingredients', newIng);
        }
        const pantryRow = {
          pantryId: uuid(), ingredientId,
          quantity: parseFloat(manualForm.quantity)||1,
          unit: manualForm.unit,
          addedAt: nowISO(), addedVia:'manual',
          expiryDate: manualForm.expiryDate||null,
        };
        setPantry(ps=>[pantryRow,...ps]);
        appendRow('Pantry', pantryRow);
        setManualModal(false);
        setManualForm({ ingredientName:'', quantity:'', unit:'piece', expiryDate:'' });
      };

      const needsReviewItems = ingredients.filter(i=>i.needsReview==='true'||i.needsReview===true);

      return (
        <div className="space-y-4">
          {/* Needs-review banner */}
          {needsReviewItems.length > 0 && (
            <div className="bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 flex items-center gap-2">
              <span className="text-amber-500 text-lg">⚠️</span>
              <div>
                <p className="text-sm font-medium text-amber-800">{needsReviewItems.length} ingredient{needsReviewItems.length!==1?'s':''} need review</p>
                <p className="text-xs text-amber-600">Tap items below with ⚠️ to edit name/nutrition</p>
              </div>
            </div>
          )}

          {/* Search + sort bar */}
          <div className="flex gap-2">
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search pantry…"
              className="flex-1 px-4 py-3 bg-white rounded-2xl shadow text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 border-0"/>
            <button onClick={()=>setSortBy(s=>s==='added'?'expiry':'added')}
              className="bg-white rounded-2xl shadow px-4 py-3 text-xs text-gray-600 font-medium flex-shrink-0">
              {sortBy==='added'?'By date':'By expiry'}
            </button>
          </div>

          {/* Pantry list */}
          {rows.length > 0 ? (
            <div className="bg-white rounded-2xl shadow divide-y">
              {rows.map(p => {
                const name = ingName(p.ingredientId);
                const ing  = ingredients.find(i=>i.ingredientId===p.ingredientId);
                const isReview = ing?.needsReview==='true'||ing?.needsReview===true;
                return (
                  <div key={p.pantryId} className="px-4 py-3 flex items-center gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-1.5">
                        <p className="text-sm font-medium text-gray-800 truncate">{name}</p>
                        {isReview && <span title="Needs review" className="text-amber-500 text-xs">⚠️</span>}
                      </div>
                      <div className="flex items-center gap-2 mt-0.5">
                        <span className="text-xs text-gray-400">{ADDED_VIA_LABEL[p.addedVia]||p.addedVia}</span>
                        {p.expiryDate && <span className={`text-xs ${expiryClass(p.expiryDate)}`}>exp {p.expiryDate}</span>}
                      </div>
                    </div>
                    {/* Qty editor */}
                    {editingRow === p.pantryId ? (
                      <div className="flex items-center gap-1">
                        <input type="number" defaultValue={p.quantity} id={`qty-${p.pantryId}`}
                          className="w-16 px-2 py-1 border rounded-lg text-sm text-center focus:outline-none" step="0.5"/>
                        <span className="text-xs text-gray-400">{p.unit}</span>
                        <button onClick={()=>{updateQty(p.pantryId,parseFloat(document.getElementById(`qty-${p.pantryId}`).value)||0);setEditingRow(null);}}
                          className="text-green-600 text-xs px-2 py-1 rounded bg-green-50">✓</button>
                      </div>
                    ) : (
                      <button onClick={()=>setEditingRow(p.pantryId)}
                        className="text-sm font-semibold text-gray-700 hover:text-indigo-600 flex-shrink-0">
                        {p.quantity} <span className="text-xs font-normal text-gray-400">{p.unit}</span>
                      </button>
                    )}
                    <button onClick={()=>deleteEntry(p.pantryId)} className="text-gray-300 hover:text-red-400 text-lg flex-shrink-0">×</button>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
              <div className="text-5xl mb-3">🥫</div>
              <p className="font-medium text-gray-600">{query?'No matches':'Pantry is empty'}</p>
              {!query && <p className="text-sm mt-1">Add items with the + button below</p>}
            </div>
          )}

          {/* FAB + 4 add methods */}
          <div className="fixed bottom-20 right-5 md:bottom-6 flex flex-col gap-2 z-30">
            <button onClick={()=>onReceiptOpen('email')} className="w-12 h-12 bg-white border border-gray-200 shadow rounded-full flex items-center justify-center text-xl hover:bg-gray-50" title="Paste email receipt">📧</button>
            <button onClick={()=>onReceiptOpen('photo')} className="w-12 h-12 bg-white border border-gray-200 shadow rounded-full flex items-center justify-center text-xl hover:bg-gray-50" title="Photo receipt">📷</button>
            <button onClick={onBarcodeOpen} className="w-12 h-12 bg-white border border-gray-200 shadow rounded-full flex items-center justify-center text-xl hover:bg-gray-50" title="Barcode scan">📱</button>
            <button onClick={()=>setManualModal(true)} className="w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-indigo-700" title="Add manually">+</button>
          </div>

          {/* Manual add modal */}
          {manualModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end" onClick={()=>setManualModal(false)}>
              <div className="bg-white rounded-t-3xl w-full p-5 space-y-3" onClick={e=>e.stopPropagation()}>
                <h3 className="font-bold text-gray-800">Add to Pantry</h3>
                <input value={manualForm.ingredientName} onChange={e=>setManualForm(f=>({...f,ingredientName:e.target.value}))}
                  placeholder="Ingredient name *" className="w-full px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                <div className="flex gap-2">
                  <input type="number" value={manualForm.quantity} onChange={e=>setManualForm(f=>({...f,quantity:e.target.value}))}
                    placeholder="Qty" className="w-24 px-3 py-2 border rounded-xl text-sm focus:outline-none"/>
                  <select value={manualForm.unit} onChange={e=>setManualForm(f=>({...f,unit:e.target.value}))}
                    className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none">
                    {['g','kg','ml','l','tsp','tbsp','cup','oz','lb','piece','pinch'].map(u=><option key={u}>{u}</option>)}
                  </select>
                  <input type="date" value={manualForm.expiryDate} onChange={e=>setManualForm(f=>({...f,expiryDate:e.target.value}))}
                    className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none" title="Expiry date (optional)"/>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setManualModal(false)} className="flex-1 py-3 border border-gray-200 rounded-xl text-sm text-gray-600">Cancel</button>
                  <button onClick={addManual} disabled={!manualForm.ingredientName.trim()} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold disabled:opacity-40">Add</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function RecipeDetailModal({ recipeId, recipes, recipeIngredients, ingredients, pantry, mealPlanSlots, onClose, onUpdateRecipe, onUpdateMealPlanSlots, onUpdatePantry }) {
      const [displayServings, setDisplayServings] = useState(null);
      const [noteInput,       setNoteInput]       = useState('');
      const [noteBy,          setNoteBy]          = useState('Fernando');

      const recipe = recipes.find(r => r.recipeId === recipeId);
      useEffect(() => { if (recipe) setDisplayServings(parseInt(recipe.baseServings)||4); }, [recipeId]);

      if (!recipeId || !recipe) return null;

      const base     = parseInt(recipe.baseServings) || 4;
      const scale    = (displayServings||base) / base;
      const ris      = recipeIngredients.filter(ri => ri.recipeId === recipeId);
      const tags     = recipe.dietaryTags ? String(recipe.dietaryTags).split('|').filter(Boolean) : [];
      const status   = rotationStatus(recipe);
      const notes    = recipe.notes ? String(recipe.notes).split('\n').filter(Boolean) : [];

      // Pantry status for a given ingredient
      const pantryStatus = (ingredientId, neededQty) => {
        const rows  = pantry.filter(p => p.ingredientId === ingredientId);
        const total = rows.reduce((s,p) => s + parseFloat(p.quantity||0), 0);
        if (total === 0)          return { icon:'✗', cls:'text-red-400' };
        if (total >= neededQty)   return { icon:'✓', cls:'text-green-500' };
        return                           { icon:'△', cls:'text-amber-400' };
      };

      const scaleQty = (qty, unit) => {
        if (!qty) return '';
        const q = parseFloat(qty) * scale;
        if (['to_taste','pinch'].includes(unit)) return qty; // BRD §5.3 — pass through
        return q % 1 === 0 ? q : q.toFixed(1);
      };

      const appendNote = () => {
        if (!noteInput.trim()) return;
        const entry = `${new Date().toISOString().slice(0,10)} (${noteBy}): ${noteInput.trim()}`;
        const existing = recipe.notes ? recipe.notes + '\n' + entry : entry;
        onUpdateRecipe(recipeId, { notes: existing });
        setNoteInput('');
      };

      const statusChip = {
        new:     { label:'🆕 New',     cls:'bg-blue-100 text-blue-700'   },
        active:  { label:'✅ Active',  cls:'bg-green-100 text-green-700'  },
        due:     { label:'⏰ Due',     cls:'bg-orange-100 text-orange-700'},
        dormant: { label:'💤 Dormant', cls:'bg-gray-100 text-gray-500'   },
      }[status] || { label:'', cls:'' };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end md:items-center justify-center p-0 md:p-4" onClick={onClose}>
          <div className="bg-white rounded-t-3xl md:rounded-3xl w-full md:max-w-2xl max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
            {/* Header */}
            <div className="p-5 border-b flex items-start justify-between sticky top-0 bg-white z-10">
              <div className="flex-1 min-w-0 pr-3">
                <h2 className="text-lg font-bold text-gray-800 leading-tight">{recipe.name}</h2>
                <div className="flex flex-wrap gap-1.5 mt-1.5">
                  {recipe.cuisine && <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{recipe.cuisine}</span>}
                  {recipe.totalTimeMin && <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">⏱ {recipe.totalTimeMin}min</span>}
                  <span className={`text-xs px-2 py-0.5 rounded-full ${statusChip.cls}`}>{statusChip.label}</span>
                  {tags.map(t => <span key={t} className="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">{t}</span>)}
                </div>
              </div>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex-shrink-0">✕</button>
            </div>

            <div className="p-5 space-y-5">
              {/* Servings stepper */}
              <div className="flex items-center justify-between bg-gray-50 rounded-2xl px-4 py-3">
                <span className="text-sm font-medium text-gray-700">Servings</span>
                <div className="flex items-center gap-3">
                  <button onClick={()=>setDisplayServings(s=>Math.max(1,s-1))} className="w-8 h-8 flex items-center justify-center rounded-full bg-white border text-gray-600 hover:bg-gray-100 font-bold">−</button>
                  <span className="text-lg font-bold text-indigo-700 w-8 text-center">{displayServings}</span>
                  <button onClick={()=>setDisplayServings(s=>s+1)} className="w-8 h-8 flex items-center justify-center rounded-full bg-white border text-gray-600 hover:bg-gray-100 font-bold">+</button>
                </div>
                {scale !== 1 && <span className="text-xs text-indigo-500 ml-2">({scale>1?'+':''}{ ((scale-1)*100).toFixed(0)}%)</span>}
              </div>

              {/* Ingredients */}
              {ris.length > 0 && (
                <div>
                  <h3 className="text-sm font-bold text-gray-700 mb-2">Ingredients</h3>
                  <div className="space-y-1.5">
                    {ris.map(ri => {
                      const ing = ingredients.find(i=>i.ingredientId===ri.ingredientId);
                      const ps  = pantryStatus(ri.ingredientId, parseFloat(ri.quantity||0)*scale);
                      const scaledQ = scaleQty(ri.quantity, ri.unit);
                      return (
                        <div key={ri.recipeIngredientId} className={`flex items-center gap-3 px-3 py-2 rounded-xl ${ri.isOptional==='true'||ri.isOptional===true?'opacity-60 border border-dashed border-gray-200':'bg-gray-50'}`}>
                          <span className={`font-bold text-sm flex-shrink-0 ${ps.cls}`}>{ps.icon}</span>
                          <span className="text-sm text-gray-800 flex-1">
                            {ing?.canonicalName || ri.ingredientId}
                            {ri.preparation && <span className="text-gray-400 text-xs ml-1">({ri.preparation})</span>}
                            {(ri.isOptional==='true'||ri.isOptional===true) && <span className="text-xs text-gray-400 ml-1">optional</span>}
                          </span>
                          <span className="text-sm text-gray-600 flex-shrink-0 font-medium">
                            {scaledQ} {['to_taste','pinch'].includes(ri.unit)?ri.unit:ri.unit}
                            {['to_taste','pinch'].includes(ri.unit)===false && scale!==1 && parseFloat(ri.quantity||0)>0 && !(['to_taste','pinch'].includes(ri.unit)) && (
                              <span className="text-xs text-gray-400 ml-1">
                                {!ing?.density_g_per_ml && !['g','kg','ml','l'].includes(ri.unit) && <span title="Weight unavailable">~</span>}
                              </span>
                            )}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                  <p className="text-xs text-gray-400 mt-2">✓ have enough · △ partial · ✗ none (from pantry)</p>
                </div>
              )}

              {/* Method */}
              {recipe.methodSteps && (
                <div>
                  <h3 className="text-sm font-bold text-gray-700 mb-2">Method</h3>
                  <div className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap bg-gray-50 rounded-xl p-4">{recipe.methodSteps}</div>
                </div>
              )}

              {/* Notes log */}
              <div>
                <h3 className="text-sm font-bold text-gray-700 mb-2">Notes {notes.length>0&&<span className="text-gray-400 font-normal">({notes.length})</span>}</h3>
                {notes.map((n,i) => <p key={i} className="text-xs text-gray-600 bg-yellow-50 rounded-lg px-3 py-2 mb-1.5 font-mono">{n}</p>)}
                <div className="flex gap-2 mt-2">
                  <select value={noteBy} onChange={e=>setNoteBy(e.target.value)} className="text-xs px-2 py-2 border rounded-xl focus:outline-none flex-shrink-0">
                    {['Fernando','Yenny','Both'].map(p=><option key={p}>{p}</option>)}
                  </select>
                  <input value={noteInput} onChange={e=>setNoteInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&appendNote()}
                    placeholder="Add a note… (e.g. doubled garlic)" className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                  <button onClick={appendNote} disabled={!noteInput.trim()} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm disabled:opacity-40">Add</button>
                </div>
              </div>

              {/* Meta */}
              <div className="text-xs text-gray-400 border-t pt-3 flex gap-4 flex-wrap">
                <span>Added by {recipe.createdBy||'—'}</span>
                {recipe.timesCooked>0 && <span>Cooked {recipe.timesCooked}×</span>}
                {recipe.lastCookedAt && <span>Last: {recipe.lastCookedAt.slice(0,10)}</span>}
                {recipe.sourceUrl && <a href={recipe.sourceUrl} target="_blank" rel="noopener noreferrer" className="text-indigo-400 hover:underline">Source ↗</a>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AddRecipeModal({ onClose, onSave, ingredients, setIngredients }) {
      const [mode,       setMode]       = useState('url'); // url | image | manual
      const [urlInput,   setUrlInput]   = useState('');
      const [loading,    setLoading]    = useState(false);
      const [error,      setError]      = useState('');
      const [preview,    setPreview]    = useState(null);  // parsed recipe object
      const [addedBy,    setAddedBy]    = useState('Fernando');

      // Manual entry form state
      const [manualName,    setManualName]    = useState('');
      const [manualServings,setManualServings]= useState(4);
      const [manualTime,    setManualTime]    = useState('');
      const [manualCuisine, setManualCuisine] = useState('');
      const [manualMethod,  setManualMethod]  = useState('');
      const [manualTags,    setManualTags]    = useState([]);
      const [manualIngRows, setManualIngRows] = useState([{ name:'',qty:'',unit:'piece',prep:'',optional:false }]);

      const fileInputRef = useRef(null);

      // §12a — URL paste: try JSON-LD first (free), then Haiku
      const handleUrlAdd = async () => {
        const url = urlInput.trim();
        if (!url) return;
        setLoading(true); setError('');
        try {
          // Step 1: try client-side fetch
          let html = null;
          try {
            const res = await fetch(url, { mode:'cors' });
            html = await res.text();
          } catch {
            // CORS block → /fetch-html proxy
            try {
              const proxy = await callWorker('/fetch-html', { url });
              html = proxy.html;
            } catch (e) {
              throw new Error('Could not fetch page. Try image upload instead.');
            }
          }

          // Step 2: parse Schema.org/Recipe JSON-LD (free path — no Claude call)
          let extracted = null;
          try {
            const ldMatches = [...html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)];
            for (const m of ldMatches) {
              try {
                const json = JSON.parse(m[1].trim());
                const schemas = Array.isArray(json) ? json : (json['@graph'] || [json]);
                const recipe  = schemas.find(s => s['@type'] === 'Recipe' || (Array.isArray(s['@type'])&&s['@type'].includes('Recipe')));
                if (recipe) {
                  extracted = {
                    name:         recipe.name || '',
                    baseServings: parseInt(recipe.recipeYield)||4,
                    totalTimeMin: parseDuration(recipe.totalTime||recipe.cookTime),
                    cuisine:      Array.isArray(recipe.recipeCuisine)?recipe.recipeCuisine[0]:recipe.recipeCuisine||null,
                    dietaryTags:  (recipe.suitableForDiet||[]).map(d=>d.replace('https://schema.org/','').replace('Diet','')).join('|'),
                    methodSteps:  Array.isArray(recipe.recipeInstructions)?recipe.recipeInstructions.map(i=>typeof i==='string'?i:i.text||'').join('\n'):String(recipe.recipeInstructions||''),
                    ingredients:  (recipe.recipeIngredient||[]).map(s=>parseIngredientString(s)),
                    rawSource:    JSON.stringify({ url, parsed: recipe }),
                    parseStatus:  'ok',
                  };
                  break;
                }
              } catch {}
            }
          } catch {}

          // Step 3: if no JSON-LD, use Haiku via Worker
          if (!extracted) {
            const result = await callWorker('/extract-recipe-url', { html });
            if (result.parseStatus === 'needs_review') {
              setPreview({ ...result, rawSource: JSON.stringify({ url, raw: result.raw }), parseStatus:'needs_review' });
            } else {
              extracted = { ...result, rawSource: JSON.stringify({ url }), parseStatus:'ok' };
            }
          }

          if (extracted) setPreview({ ...extracted, sourceUrl: url });

        } catch(e) {
          setError(e.message || 'Extraction failed.');
        } finally { setLoading(false); }
      };

      // §12b — Image upload
      const handleImageUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setLoading(true); setError('');
        try {
          const base64 = await fileToBase64(file);
          // Upload to Drive for dragnet storage
          // (Apps Script call — fire and forget, get file ID back if possible)
          const result = await callWorker('/extract-recipe-image', { imageBase64: base64.split(',')[1], mimeType: file.type });
          if (result.parseStatus === 'needs_review') {
            setPreview({ name:'Unreviewed Recipe', parseStatus:'needs_review', rawSource: JSON.stringify({ image: file.name, raw: result.raw }) });
          } else {
            setPreview({ ...result, parseStatus: result.parseStatus||'ok' });
          }
        } catch(e) {
          setError(e.message || 'Image extraction failed.');
        } finally { setLoading(false); }
      };

      const fileToBase64 = (file) => new Promise((res,rej) => {
        const r = new FileReader();
        r.onloadend = () => res(r.result);
        r.onerror   = rej;
        r.readAsDataURL(file);
      });

      function parseDuration(iso) {
        if (!iso) return null;
        const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
        return m ? (parseInt(m[1]||0)*60 + parseInt(m[2]||0)) || null : null;
      }

      function parseIngredientString(s) {
        // Simple heuristic: first token(s) = quantity, next = unit, rest = name
        const UNITS = ['g','kg','ml','l','tsp','tbsp','cup','oz','lb','piece','pinch'];
        const parts = s.trim().split(/\s+/);
        const qty  = parseFloat(parts[0]) || 1;
        const unit = UNITS.includes(parts[1]?.toLowerCase()) ? parts[1] : 'piece';
        const name = UNITS.includes(parts[1]?.toLowerCase()) ? parts.slice(2).join(' ') : parts.slice(1).join(' ');
        return { name, quantity: qty, unit, preparation: null, isOptional: false };
      }

      // Save from preview
      const savePreview = () => {
        if (!preview) return;
        commitRecipe(preview);
      };

      // Save manual entry
      const saveManual = () => {
        if (!manualName.trim()) return;
        commitRecipe({
          name:         manualName.trim(),
          baseServings: manualServings,
          totalTimeMin: parseInt(manualTime)||null,
          cuisine:      manualCuisine||null,
          dietaryTags:  manualTags.join('|'),
          methodSteps:  manualMethod,
          ingredients:  manualIngRows.filter(r=>r.name.trim()),
          parseStatus:  'ok',
          rawSource:    null,
          sourceUrl:    null,
        });
      };

      const commitRecipe = (data) => {
        const recipeId = uuid();
        const now = nowISO();
        const recipe = {
          recipeId, name:data.name, sourceUrl:data.sourceUrl||null, sourceImage:null,
          baseServings:data.baseServings||4, methodSteps:data.methodSteps||'',
          totalTimeMin:data.totalTimeMin||null, dietaryTags:data.dietaryTags||'',
          cuisine:data.cuisine||null, createdBy:addedBy, createdAt:now,
          timesCooked:0, lastCookedAt:null, notes:'',
          parseStatus:data.parseStatus||'ok', rawSource:data.rawSource||null,
        };

        // Resolve ingredients — fuzzy match existing, create new if <80% match
        const newIngredients = [];
        const ris = (data.ingredients||[]).map((ing, idx) => {
          const ingName = ing.name?.trim() || '';
          let match = ingredients.find(i => fuzzyScore(i.canonicalName||'', ingName) >= 0.8);
          if (!match) {
            // Check newly added ones too
            match = newIngredients.find(i => fuzzyScore(i.canonicalName||'', ingName) >= 0.8);
          }
          let ingredientId;
          if (match) {
            ingredientId = match.ingredientId;
          } else {
            ingredientId = uuid();
            newIngredients.push({
              ingredientId, canonicalName:ingName, lastUpdated:now,
              nutritionPer100g:'{}', needsReview:false,
            });
          }
          return {
            recipeIngredientId: uuid(), recipeId, ingredientId,
            quantity: ing.quantity||1, unit: ing.unit||'piece',
            preparation: ing.preparation||null, isOptional: ing.isOptional||false,
          };
        });

        appendRow('Recipes', recipe);
        newIngredients.forEach(i => appendRow('Ingredients', i));
        ris.forEach(ri => appendRow('RecipeIngredients', ri));

        onSave(recipe, newIngredients, ris);
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end md:items-center justify-center p-0 md:p-4" onClick={onClose}>
          <div className="bg-white rounded-t-3xl md:rounded-3xl w-full md:max-w-2xl max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
            <div className="p-5 border-b flex items-center justify-between sticky top-0 bg-white z-10">
              <h2 className="text-lg font-bold text-gray-800">Add Recipe</h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200">✕</button>
            </div>
            <div className="p-5 space-y-4">
              {/* Added-by */}
              <div className="flex gap-2">
                {['Fernando','Yenny'].map(p=>(
                  <button key={p} onClick={()=>setAddedBy(p)} className={`flex-1 py-2 rounded-xl text-sm border transition-all ${addedBy===p?'bg-indigo-600 text-white border-indigo-600':'border-gray-200 text-gray-600'}`}>{p}</button>
                ))}
              </div>

              {/* Mode tabs */}
              <div className="flex gap-1 bg-gray-100 rounded-xl p-1">
                {[{id:'url',label:'🔗 URL'},{id:'image',label:'📷 Photo'},{id:'manual',label:'✏️ Manual'}].map(m=>(
                  <button key={m.id} onClick={()=>{setMode(m.id);setPreview(null);setError('');}}
                    className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all ${mode===m.id?'bg-white shadow text-indigo-700':'text-gray-500'}`}>{m.label}</button>
                ))}
              </div>

              {error && <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-700">{error}</div>}

              {/* ── URL mode ── */}
              {mode === 'url' && !preview && (
                <div className="space-y-3">
                  <p className="text-xs text-gray-500">Paste a recipe URL from any cooking site. Structured data (JSON-LD) is extracted for free — Haiku is used only as fallback.</p>
                  <div className="flex gap-2">
                    <input value={urlInput} onChange={e=>setUrlInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleUrlAdd()}
                      placeholder="https://cooking.nytimes.com/recipes/…" type="url"
                      className="flex-1 px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                    <button onClick={handleUrlAdd} disabled={!urlInput.trim()||loading}
                      className="px-5 py-3 bg-indigo-600 text-white rounded-xl disabled:opacity-40 font-medium">{loading?'…':'Fetch'}</button>
                  </div>
                  {loading && <p className="text-sm text-indigo-600 text-center animate-pulse">🔍 Extracting recipe…</p>}
                </div>
              )}

              {/* ── Image mode ── */}
              {mode === 'image' && !preview && (
                <div className="space-y-3">
                  <p className="text-xs text-gray-500">Take a photo of a cookbook page, recipe card, or screenshot. Haiku vision extracts it.</p>
                  <input ref={fileInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleImageUpload}/>
                  <button onClick={()=>fileInputRef.current?.click()} disabled={loading}
                    className="w-full py-10 border-2 border-dashed border-indigo-300 rounded-2xl flex flex-col items-center gap-2 hover:bg-indigo-50 disabled:opacity-40">
                    <span className="text-4xl">📷</span>
                    <span className="text-sm font-medium text-indigo-600">{loading?'Extracting…':'Tap to take photo or upload image'}</span>
                  </button>
                </div>
              )}

              {/* ── Preview ── */}
              {preview && mode !== 'manual' && (
                <div className="space-y-3">
                  {preview.parseStatus === 'needs_review' ? (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                      <p className="text-sm font-medium text-amber-800">⚠️ Extraction needs review</p>
                      <p className="text-xs text-amber-600 mt-1">Recipe will be saved with parseStatus=needs_review. You can edit it later.</p>
                    </div>
                  ) : (
                    <div className="bg-green-50 border border-green-200 rounded-xl p-3">
                      <p className="text-sm font-medium text-green-800">✅ Recipe extracted</p>
                    </div>
                  )}
                  <div className="bg-gray-50 rounded-xl p-4 space-y-2">
                    <p className="font-semibold text-gray-800">{preview.name || 'Unnamed recipe'}</p>
                    {preview.cuisine && <p className="text-xs text-gray-500">{preview.cuisine}</p>}
                    {preview.totalTimeMin && <p className="text-xs text-gray-500">⏱ {preview.totalTimeMin} min</p>}
                    <p className="text-xs text-gray-500">{(preview.ingredients||[]).length} ingredients</p>
                    <p className="text-xs text-gray-400 line-clamp-3">{preview.methodSteps}</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={()=>{setPreview(null);setUrlInput('');}} className="flex-1 py-3 border border-gray-200 rounded-xl text-sm text-gray-600">Try again</button>
                    <button onClick={savePreview} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold">Save Recipe</button>
                  </div>
                </div>
              )}

              {/* ── Manual mode ── */}
              {mode === 'manual' && (
                <div className="space-y-3">
                  <input value={manualName} onChange={e=>setManualName(e.target.value)} placeholder="Recipe name *"
                    className="w-full px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-xs text-gray-500 mb-1 block">Servings</label>
                      <input type="number" value={manualServings} onChange={e=>setManualServings(parseInt(e.target.value)||4)} min={1} className="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none"/>
                    </div>
                    <div>
                      <label className="text-xs text-gray-500 mb-1 block">Time (min)</label>
                      <input type="number" value={manualTime} onChange={e=>setManualTime(e.target.value)} placeholder="30" className="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none"/>
                    </div>
                    <div>
                      <label className="text-xs text-gray-500 mb-1 block">Cuisine</label>
                      <input value={manualCuisine} onChange={e=>setManualCuisine(e.target.value)} placeholder="Italian" className="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none"/>
                    </div>
                  </div>
                  {/* Dietary tags */}
                  <div>
                    <p className="text-xs text-gray-500 mb-1">Dietary tags</p>
                    <div className="flex flex-wrap gap-1.5">
                      {DIETARY_TAGS.map(t=>(
                        <button key={t} onClick={()=>setManualTags(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t])}
                          className={`text-xs px-2 py-1 rounded-full border transition-all ${manualTags.includes(t)?'bg-indigo-600 text-white border-indigo-600':'border-gray-200 text-gray-600'}`}>{t}</button>
                      ))}
                    </div>
                  </div>
                  {/* Ingredients */}
                  <div>
                    <p className="text-xs text-gray-500 mb-1">Ingredients</p>
                    {manualIngRows.map((row,i)=>(
                      <div key={i} className="flex gap-1.5 mb-1.5">
                        <input value={row.name} onChange={e=>setManualIngRows(r=>r.map((x,j)=>j===i?{...x,name:e.target.value}:x))}
                          placeholder="Ingredient" className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none"/>
                        <input type="number" value={row.qty} onChange={e=>setManualIngRows(r=>r.map((x,j)=>j===i?{...x,qty:e.target.value}:x))}
                          placeholder="Qty" className="w-16 px-2 py-2 border rounded-xl text-sm focus:outline-none text-center"/>
                        <select value={row.unit} onChange={e=>setManualIngRows(r=>r.map((x,j)=>j===i?{...x,unit:e.target.value}:x))}
                          className="px-2 py-2 border rounded-xl text-sm focus:outline-none">
                          {['g','kg','ml','l','tsp','tbsp','cup','oz','lb','piece','pinch','to_taste'].map(u=><option key={u}>{u}</option>)}
                        </select>
                        <button onClick={()=>setManualIngRows(r=>r.filter((_,j)=>j!==i))} className="text-gray-300 hover:text-red-400 text-xl px-1">×</button>
                      </div>
                    ))}
                    <button onClick={()=>setManualIngRows(r=>[...r,{name:'',qty:'',unit:'piece',prep:'',optional:false}])}
                      className="text-sm text-indigo-600 font-medium mt-1">+ Add ingredient</button>
                  </div>
                  {/* Method */}
                  <div>
                    <p className="text-xs text-gray-500 mb-1">Method</p>
                    <textarea value={manualMethod} onChange={e=>setManualMethod(e.target.value)} rows={5}
                      placeholder="1. Preheat oven to 375°F. 2. Mix ingredients…"
