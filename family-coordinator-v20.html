    function BarcodeScannerModal({ onClose, onResult, ingredients }) {
      const [phase,    setPhase]    = useState('scanning'); // scanning | loading | preview | error
      const [barcode,  setBarcode]  = useState('');
      const [result,   setResult]   = useState(null);
      const [error,    setError]    = useState('');
      const [addTo,    setAddTo]    = useState('pantry'); // pantry | ingredients
      const [qty,      setQty]      = useState(1);
      const [unit,     setUnit]     = useState('piece');
      const videoRef = useRef(null);
      const readerRef= useRef(null);

      // Start ZXing scanner
      useEffect(() => {
        let reader;
        const startScanner = async () => {
          try {
            const ZXing = window.ZXing;
            if (!ZXing) { setError('Barcode library failed to load.'); setPhase('error'); return; }
            reader = new ZXing.BrowserMultiFormatReader();
            readerRef.current = reader;
            const devices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
            const deviceId = devices.find(d=>/back|rear|environment/i.test(d.label))?.deviceId || devices[0]?.deviceId;
            if (!deviceId) { setError('No camera found.'); setPhase('error'); return; }
            reader.decodeFromVideoDevice(deviceId, videoRef.current, async (result, err) => {
              if (result) {
                reader.reset();
                const code = result.getText();
                setBarcode(code);
                setPhase('loading');
                await lookupAndSet(code);
              }
            });
          } catch(e) {
            setError(`Camera error: ${e.message}`); setPhase('error');
          }
        };
        startScanner();
        return () => { readerRef.current?.reset(); };
      }, []);

      const lookupAndSet = async (code) => {
        try {
          // §14c lookup chain: Open Food Facts → (USDA skip) → Haiku vision fallback
          let found = await lookupBarcode(code);
          if (found) {
            setResult({ ...found, source:'off' });
            setPhase('preview');
            return;
          }
          // USDA skip (key placeholder per §0b rule 12)
          // Haiku vision: would need image of wrapper — not available from barcode alone
          // §0b rule 10 fallback
          setResult({
            canonicalName: `Unknown (${code})`,
            openFoodFactsBarcode: code,
            needsReview: true,
            nutritionPer100g: '{}',
            source: 'fallback',
          });
          setPhase('preview');
        } catch(e) {
          setResult({ canonicalName:`Unknown (${code})`, openFoodFactsBarcode:code, needsReview:true, nutritionPer100g:'{}', source:'error' });
          setPhase('preview');
        }
      };

      const confirm = () => {
        if (!result) return;
        // Upsert ingredient
        const existing = ingredients.find(i => i.openFoodFactsBarcode === result.openFoodFactsBarcode);
        const ingredientId = existing?.ingredientId || uuid();
        const ing = {
          ingredientId,
          canonicalName: result.canonicalName,
          openFoodFactsBarcode: result.openFoodFactsBarcode || barcode,
          nutritionPer100g: result.nutritionPer100g || '{}',
          needsReview: result.needsReview || false,
          lastUpdated: nowISO(),
        };
        // Pantry row
        const pantryRow = addTo === 'pantry' ? {
          pantryId: uuid(), ingredientId,
          quantity: qty, unit,
          addedAt: nowISO(), addedVia: 'barcode_scan', expiryDate: null,
        } : null;
        if (!existing) appendRow('Ingredients', ing);
        if (pantryRow)  appendRow('Pantry', pantryRow);
        onResult(ing, pantryRow);
      };

      return (
        <div className="fixed inset-0 bg-black z-50 flex flex-col">
          {/* Header */}
          <div className="p-4 flex items-center gap-3 bg-black/80 flex-shrink-0">
            <button onClick={onClose} className="text-white text-2xl w-8 h-8 flex items-center justify-center">✕</button>
            <p className="text-white font-medium text-sm">
              {phase==='scanning'?'Point camera at barcode':phase==='loading'?'Looking up…':phase==='preview'?'Found product':'Error'}
            </p>
          </div>

          {phase === 'scanning' && (
            <div className="flex-1 relative">
              <video ref={videoRef} className="w-full h-full object-cover"/>
              {/* Viewfinder overlay */}
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div className="w-64 h-40 border-2 border-white/80 rounded-xl">
                  <div className="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-green-400 rounded-tl"/>
                  <div className="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-green-400 rounded-tr"/>
                  <div className="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-green-400 rounded-bl"/>
                  <div className="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-green-400 rounded-br"/>
                </div>
              </div>
              <p className="absolute bottom-8 left-0 right-0 text-center text-white/70 text-sm">Hold steady over barcode</p>
            </div>
          )}

          {phase === 'loading' && (
            <div className="flex-1 flex items-center justify-center bg-gray-900">
              <div className="text-center text-white">
                <div className="text-5xl mb-4 animate-bounce">🔍</div>
                <p className="font-medium">Looking up barcode…</p>
                <p className="text-sm text-gray-400 mt-1">{barcode}</p>
                <p className="text-xs text-gray-500 mt-2">Open Food Facts → USDA → Haiku vision</p>
              </div>
            </div>
          )}

          {phase === 'preview' && result && (
            <div className="flex-1 bg-white overflow-y-auto">
              <div className="p-5 space-y-4">
                {result.source === 'fallback' || result.needsReview ? (
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                    <p className="text-sm font-medium text-amber-800">⚠️ Not found in database</p>
                    <p className="text-xs text-amber-600 mt-1">Saved as Unknown ({barcode}). Review later in Pantry.</p>
                  </div>
                ) : (
                  <div className="bg-green-50 border border-green-200 rounded-xl p-3">
                    <p className="text-sm font-medium text-green-800">✅ Found in Open Food Facts</p>
                  </div>
                )}
                <div className="bg-gray-50 rounded-xl p-4">
                  <p className="font-semibold text-gray-800">{result.canonicalName}</p>
                  {result.brand && <p className="text-xs text-gray-500 mt-0.5">{result.brand}</p>}
                  <p className="text-xs text-gray-400 mt-1 font-mono">{barcode}</p>
                  {result.nutritionPer100g && result.nutritionPer100g !== '{}' && (() => {
                    try {
                      const n = typeof result.nutritionPer100g==='string'?JSON.parse(result.nutritionPer100g):result.nutritionPer100g;
                      return n.kcal ? <p className="text-xs text-gray-500 mt-1">{n.kcal} kcal · {n.protein_g}g protein · {n.carb_g}g carbs · {n.fat_g}g fat (per 100g)</p> : null;
                    } catch { return null; }
                  })()}
                </div>
                {/* Add to pantry or just ingredients */}
                <div>
                  <p className="text-xs text-gray-500 font-medium mb-2">Add to</p>
                  <div className="flex gap-2 mb-3">
                    {[{id:'pantry',label:'🥫 Pantry'},{id:'ingredients',label:'📋 Ingredients only'}].map(o=>(
                      <button key={o.id} onClick={()=>setAddTo(o.id)} className={`flex-1 py-2 rounded-xl text-sm border transition-all ${addTo===o.id?'bg-indigo-600 text-white border-indigo-600':'border-gray-200 text-gray-600'}`}>{o.label}</button>
                    ))}
                  </div>
                  {addTo==='pantry' && (
                    <div className="flex gap-2">
                      <input type="number" value={qty} onChange={e=>setQty(parseFloat(e.target.value)||1)} min={0.1} step={0.5}
                        className="w-20 px-3 py-2 border rounded-xl text-sm focus:outline-none text-center"/>
                      <select value={unit} onChange={e=>setUnit(e.target.value)} className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none">
                        {['g','kg','ml','l','piece','oz','lb'].map(u=><option key={u}>{u}</option>)}
                      </select>
                    </div>
                  )}
                </div>
                <div className="flex gap-2">
                  <button onClick={onClose} className="flex-1 py-3 border border-gray-200 rounded-xl text-sm text-gray-600">Cancel</button>
                  <button onClick={confirm} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold">Confirm</button>
                </div>
              </div>
            </div>
          )}

          {phase === 'error' && (
            <div className="flex-1 flex items-center justify-center bg-gray-900">
              <div className="text-center text-white p-8">
                <div className="text-5xl mb-4">⚠️</div>
                <p className="font-medium">{error}</p>
                <button onClick={onClose} className="mt-6 px-8 py-3 bg-white text-gray-800 rounded-xl font-medium">Close</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ReceiptCaptureModal({ mode, onClose, onResult }) {
      const [phase,         setPhase]         = useState(mode==='photo'?'capture':'paste'); // capture|paste|loading|preview|confirm
      const [emailText,     setEmailText]      = useState('');
      const [lineItems,     setLineItems]      = useState([]);
      const [receiptId,     setReceiptId]      = useState(uuid());
      const [loadingMsg,    setLoadingMsg]     = useState('');
      const [error,         setError]          = useState('');
      const [addedBy,       setAddedBy]        = useState('Fernando');
      const fileRef = useRef(null);

      const processPhoto = async (file) => {
        setPhase('loading'); setLoadingMsg('Uploading receipt photo…'); setError('');
        try {
          const b64 = await fileToBase64(file);
          setLoadingMsg('Extracting line items with Haiku vision…');
          const res = await callWorker('/parse-receipt-photo', { imageBase64: b64.split(',')[1], mimeType: file.type });
          handleParseResult(res, 'receipt_photo');
        } catch(e) {
          setError(e.message || 'Photo parsing failed.'); setPhase('capture');
        }
      };

      const processEmail = async () => {
        if (!emailText.trim()) return;
        setPhase('loading'); setLoadingMsg('Parsing receipt email…'); setError('');
        try {
          const res = await callWorker('/parse-receipt-email', { text: emailText });
          handleParseResult(res, 'receipt_digital');
        } catch(e) {
          setError(e.message || 'Email parsing failed.'); setPhase('paste');
        }
      };

      const handleParseResult = (res, addedVia) => {
        if (res.parseStatus === 'needs_review') {
          setError('Could not parse receipt cleanly. Saved for review.'); setPhase('paste'); return;
        }
        const items = (res.lineItems || []).map((item, i) => ({
          ...item, id:i, selected:true, addedVia, confidence: 1.0,
        }));
        setLineItems(items);
        setPhase('preview');
      };

      const fileToBase64 = (file) => new Promise((res,rej) => {
        const r = new FileReader(); r.onloadend=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
      });

      const confirmItems = () => {
        const selected = lineItems.filter(i=>i.selected);
        // Write ReceiptImports row
        const receiptRow = {
          receiptId, source: mode==='photo'?'publix_photo':'whole_foods_email',
          rawContent: emailText || '', parsedJSON: JSON.stringify(selected),
          lineItemCount: lineItems.length, matchedCount: selected.length,
          matchStatus: selected.length===lineItems.length?'ok':'partial',
          importedAt: nowISO(), importedBy: addedBy,
        };
        appendRow('ReceiptImports', receiptRow);

        // Create Pantry rows for selected items (§15a — <80% fuzzy = unmatched, don't write Pantry)
        const pantryRows = [];
        selected.forEach(item => {
          // For now create ingredient + pantry row for every confirmed item
          const ingId = uuid();
          const ingRow = {
            ingredientId: ingId, canonicalName: item.name, lastUpdated: nowISO(),
            nutritionPer100g: '{}', needsReview: false,
          };
          appendRow('Ingredients', ingRow);
          const pantryRow = {
            pantryId: uuid(), ingredientId: ingId,
            quantity: item.quantity || 1, unit: item.unit || 'piece',
            addedAt: nowISO(), addedVia: item.addedVia || 'receipt_photo', expiryDate: null,
          };
          appendRow('Pantry', pantryRow);
          pantryRows.push(pantryRow);
        });

        onResult(pantryRows);
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end md:items-center justify-center p-0 md:p-4" onClick={onClose}>
          <div className="bg-white rounded-t-3xl md:rounded-3xl w-full md:max-w-2xl max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
            <div className="p-5 border-b flex items-center justify-between sticky top-0 bg-white z-10">
              <h2 className="text-lg font-bold text-gray-800">
                {mode==='photo'?'📷 Photo Receipt':'📧 Email Receipt'}
              </h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200">✕</button>
            </div>
            <div className="p-5 space-y-4">
              {/* Added by */}
              <div className="flex gap-2">
                {['Fernando','Yenny'].map(p=>(
                  <button key={p} onClick={()=>setAddedBy(p)} className={`flex-1 py-2 rounded-xl text-sm border transition-all ${addedBy===p?'bg-indigo-600 text-white border-indigo-600':'border-gray-200 text-gray-600'}`}>{p}</button>
                ))}
              </div>

              {error && <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-700">{error}</div>}

              {/* Photo capture */}
              {phase === 'capture' && (
                <div className="space-y-3">
                  <p className="text-xs text-gray-500">Take a clear photo of your receipt. Haiku vision extracts every line item.</p>
                  <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>e.target.files?.[0]&&processPhoto(e.target.files[0])}/>
                  <button onClick={()=>fileRef.current?.click()}
                    className="w-full py-12 border-2 border-dashed border-indigo-300 rounded-2xl flex flex-col items-center gap-2 hover:bg-indigo-50">
                    <span className="text-5xl">🧾</span>
                    <span className="text-sm font-medium text-indigo-600">Tap to photograph receipt</span>
                    <span className="text-xs text-gray-400">Publix, Target, or any store</span>
                  </button>
                </div>
              )}

              {/* Email paste */}
              {phase === 'paste' && (
                <div className="space-y-3">
                  <p className="text-xs text-gray-500">Open your Whole Foods or Costco receipt email, select all text, and paste it here.</p>
                  <textarea value={emailText} onChange={e=>setEmailText(e.target.value)} rows={8}
                    placeholder="Paste receipt email text here…"
                    className="w-full px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none font-mono text-xs"/>
                  <button onClick={processEmail} disabled={!emailText.trim()}
                    className="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold disabled:opacity-40">Parse Receipt</button>
                </div>
              )}

              {/* Loading */}
              {phase === 'loading' && (
                <div className="py-12 text-center">
                  <div className="text-5xl mb-4 animate-bounce">🧾</div>
                  <p className="font-medium text-gray-700">{loadingMsg}</p>
                  <p className="text-xs text-gray-400 mt-2">Using Haiku 4.5 vision…</p>
                </div>
              )}

              {/* Preview + confirm */}
              {phase === 'preview' && (
                <div className="space-y-3">
                  <div className="bg-green-50 border border-green-200 rounded-xl p-3">
                    <p className="text-sm font-medium text-green-800">{lineItems.length} line item{lineItems.length!==1?'s':''} found</p>
                    <p className="text-xs text-green-600 mt-0.5">Deselect items you don't want to add to pantry</p>
                  </div>
                  <div className="space-y-1.5">
                    {lineItems.map(item => (
                      <div key={item.id} onClick={()=>setLineItems(is=>is.map(i=>i.id===item.id?{...i,selected:!i.selected}:i))}
                        className={`flex items-center gap-3 px-4 py-3 rounded-xl border cursor-pointer transition-all ${item.selected?'bg-indigo-50 border-indigo-200':'bg-gray-50 border-gray-100 opacity-50'}`}>
                        <div className={`w-5 h-5 rounded flex items-center justify-center flex-shrink-0 ${item.selected?'bg-indigo-600 text-white':'border-2 border-gray-300'}`}>
                          {item.selected && <span className="text-xs font-bold">✓</span>}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium text-gray-800 truncate">{item.name}</p>
                          <p className="text-xs text-gray-400">{item.quantity} {item.unit} {item.price?`· $${item.price}`:''}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-gray-400 text-center">{lineItems.filter(i=>i.selected).length} of {lineItems.length} selected</p>
                  <div className="flex gap-2">
                    <button onClick={()=>setPhase(mode==='photo'?'capture':'paste')} className="flex-1 py-3 border border-gray-200 rounded-xl text-sm text-gray-600">Re-scan</button>
                    <button onClick={confirmItems} disabled={!lineItems.some(i=>i.selected)} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold disabled:opacity-40">
                      Add {lineItems.filter(i=>i.selected).length} to Pantry
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── Schedule Tab (preserved from v8.4) ────────────────────────────────────
    function ScheduleTab({ weekData, setWeekData, parent1Name, parent2Name, syncWithGoogle, currentWeek, setCurrentWeek }) {
      const [parent1Image, setParent1Image] = useState(null);
      const [parent2Image, setParent2Image] = useState(null);
      const [analyzing,    setAnalyzing]    = useState(null);
      const [analyzeError, setAnalyzeError] = useState('');
      const [expandedDay,  setExpandedDay]  = useState(null);

      const handleImageUpload = (n, e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => { n===1 ? setParent1Image(reader.result) : setParent2Image(reader.result); };
        reader.readAsDataURL(file);
      };

      const analyzeSchedules = async () => {
        if (!parent1Image || !parent2Image) { setAnalyzeError('Upload both calendar screenshots first.'); return; }
        setAnalyzeError(''); setAnalyzing('reading');
        try {
          const getMediaType = d => { const m=d.split(';')[0].split(':')[1]; return ['image/jpeg','image/png','image/gif','image/webp'].includes(m)?m:'image/jpeg'; };
          const [s1,s2] = await Promise.all([
            callClaude({ model:'claude-sonnet-4-20250514', max_tokens:1000, messages:[{ role:'user', content:[
              { type:'image', source:{ type:'base64', media_type:getMediaType(parent1Image), data:parent1Image.split(',')[1] }},
              { type:'text', text:`This is ${parent1Name}'s work calendar for the week. Extract ALL meetings for every weekday.\nRules:\n- Ignore RED items\n- Use 12-hour time format with 30-min precision\n- Do NOT round to nearest hour\nFormat:\nMonday (3/2): [time] Title\nTuesday (3/3): No meetings`}
            ]}]}),
            callClaude({ model:'claude-sonnet-4-20250514', max_tokens:1000, messages:[{ role:'user', content:[
              { type:'image', source:{ type:'base64', media_type:getMediaType(parent2Image), data:parent2Image.split(',')[1] }},
              { type:'text', text:`This is ${parent2Name}'s work calendar for the week. Extract ALL meetings for every weekday.\nRules:\n- Ignore RED items\n- Use 12-hour time format with 30-min precision\n- Do NOT round to nearest hour\nFormat:\nMonday (3/2): [time] Title\nTuesday (3/3): No meetings`}
            ]}]})
          ]);
          setAnalyzing('assigning');
          const raw = await callClaude({ model:'claude-sonnet-4-20250514', max_tokens:2000, messages:[{ role:'user', content:
            `Assign Leo's daycare duties.\n\n${parent1Name}: ${s1}\n\n${parent2Name}: ${s2}\n\nWindows:\n- Drop-off: ${DROPOFF_WINDOW.start}–${DROPOFF_WINDOW.end}\n- Pick-up: ${PICKUP_WINDOW.start}–${PICKUP_WINDOW.end}\n- Nap: ${NAP_WINDOW.start}–${NAP_WINDOW.end}\n\nRules: overlap=cannot. Both free=alternate (${parent1Name} first). Neither=DISCUSS. Nap=prefer who didn't pickup.\n\nReturn ONLY valid JSON:\n{"week":"Jan 26–30","days":[{"day":"Monday","date":"1/26","hidden":false,"notes":"","fernando_meetings":[{"time":"9:00 AM","title":"Meeting"}],"yenny_meetings":[],"dropoff":{"assigned":"${parent1Name}","conflict":false,"reason":"reason"},"pickup":{"assigned":"${parent2Name}","conflict":false,"reason":"reason"},"nap":{"assigned":"${parent1Name}","conflict":false,"reason":"reason"}}]}`
          }]});
          const match = raw.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);
          if (!match) throw new Error('No JSON found in response');
          const parsed = JSON.parse(match[0]);
          const norm = { ...parsed, days: parsed.days.map(d => ({
            hidden:false, notes:'', fernando_meetings:[], yenny_meetings:[], ...d,
            dropoff:{conflict:false,reason:'',...d.dropoff},
            pickup:{conflict:false,reason:'',...d.pickup},
            nap:{conflict:false,reason:'',...d.nap},
          }))};
          if (norm.week) setCurrentWeek(norm.week);
          setWeekData(norm);
          syncWithGoogle(norm, undefined, undefined, undefined, undefined);
        } catch(err) {
          setAnalyzeError(`Analysis failed. ${err.message || ''}`);
        } finally { setAnalyzing(null); }
      };

      const saveSchedule = nd => { setWeekData(nd); syncWithGoogle(nd,undefined,undefined,undefined,undefined); };
      const toggleAssignment = (di, type) => {
        const nd = {...weekData, days: weekData.days.map((d,i) => {
          if (i!==di) return d;
          const cur = d[type].assigned;
          return {...d,[type]:{...d[type],assigned:cur===parent1Name?parent2Name:cur===parent2Name?'DISCUSS':parent1Name}};
        })};
        saveSchedule(nd);
      };
      const toggleDayVisibility = di => saveSchedule({...weekData,days:weekData.days.map((d,i)=>i===di?{...d,hidden:!d.hidden}:d)});
      const updateNotes = (di,notes) => saveSchedule({...weekData,days:weekData.days.map((d,i)=>i===di?{...d,notes}:d)});
      const exportToClipboard = () => {
        let t = `📅 LEO'S SCHEDULE\n\n`;
        (weekData?.days||[]).filter(d=>!d.hidden).forEach(d => {
          t += `${d.day} ${d.date}:\n  🚗 Drop-off: ${d.dropoff.assigned}\n  🏠 Pick-up: ${d.pickup.assigned}\n  😴 Nap: ${d.nap.assigned}\n`;
          if (d.notes) t += `  📝 ${d.notes}\n`;
          t += '\n';
        });
        navigator.clipboard.writeText(t).then(()=>alert('📋 Copied!'));
      };

      const visibleDays = weekData?.days?.filter(d=>!d.hidden)||[];

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl shadow p-6">
            <h2 className="text-lg font-bold text-indigo-900 mb-1">📸 Upload This Week's Calendars</h2>
            <p className="text-sm text-gray-500 mb-4">Screenshot each parent's calendar, upload both, then tap Analyze.</p>
            <div className="grid grid-cols-2 gap-4 mb-4">
              {[1,2].map(n => {
                const img = n===1?parent1Image:parent2Image;
                const name = n===1?parent1Name:parent2Name;
                return (
                  <div key={n} className="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center hover:border-indigo-400 transition-colors">
                    <p className="font-semibold text-gray-700 mb-3">{name}'s Calendar</p>

    // ── Dump Tab (preserved from v8.4) ─────────────────────────────────────────
    function DumpTab({ captures, setCaptures, groceries, setGroceries, categories, parent1Name, parent2Name, captureParent, setCaptureParent, syncWithGoogle }) {
      const [textInput,  setTextInput]  = useState('');
      const [isRecording,setIsRecording]= useState(false);
      const [dumpError,  setDumpError]  = useState('');
      const [parsing,    setParsing]    = useState(false);
      const recognitionRef = useRef(null);

      const buildGroceryItems = (itemNames, addedBy) => itemNames.map((name,i) => ({
        id: Date.now()+i, name:capitalize(name), store:'', completed:false, addedBy, timestamp:nowISO(),
      }));

      const saveCapture = async (content, type) => {
        setParsing(true);
        try {
          const result = await parseGroceryIntent(content);
          if (result.isGrocery && result.items.length > 0) {
            const newItems = buildGroceryItems(result.items, captureParent);
            const updatedGroceries = [...newItems, ...groceries];
            setGroceries(updatedGroceries);
            syncWithGoogle(undefined, undefined, updatedGroceries, undefined, undefined);
          } else {
            const newCapture = {
              id:Date.now(), content, category:guessCategory(content), type,
              parent:captureParent, timestamp:nowISO(), completed:false,
            };
            const updated = [newCapture, ...captures];
            setCaptures(updated);
            syncWithGoogle(undefined, updated, undefined, undefined, undefined);
          }
        } finally { setParsing(false); setDumpError(''); }
      };

      const handleTextSubmit = () => { if (!textInput.trim()) return; saveCapture(textInput.trim(),'text'); setTextInput(''); };

      const startVoice = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setDumpError('Voice not supported. Use Chrome.'); return; }
        const rec = new SR();
        rec.lang='en-US'; rec.interimResults=false;
        rec.onstart  = () => { setIsRecording(true); setDumpError(''); };
        rec.onend    = () => setIsRecording(false);
        rec.onerror  = e => { setIsRecording(false); setDumpError(e.error==='not-allowed'?'Mic blocked. Check permissions.':`Error: ${e.error}`); };
        rec.onresult = e => saveCapture(e.results[0][0].transcript,'voice');
        recognitionRef.current = rec;
        rec.start();
      };
      const stopVoice = () => { recognitionRef.current?.stop(); setIsRecording(false); };

      const pending = captures.filter(c=>!c.completed).length;

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl shadow p-4">
            <p className="text-xs text-gray-500 uppercase tracking-wide font-medium mb-2">Capturing as</p>
            <div className="flex gap-3">
              {[parent1Name,parent2Name].map(name => (
                <button key={name} onClick={()=>setCaptureParent(name)}
                  className={`flex-1 py-2.5 rounded-xl font-medium text-sm border-2 transition-all ${captureParent===name?'bg-indigo-600 text-white border-indigo-600':'text-gray-600 border-gray-200 hover:border-indigo-300'}`}>
                  {name}
                </button>
              ))}
            </div>
          </div>
          {parsing && (
            <div className="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 flex items-center gap-3">
              <div className="text-2xl animate-spin">🧠</div>
              <div><p className="font-medium text-indigo-800 text-sm">Routing your capture…</p><p className="text-xs text-indigo-500">Grocery items auto-split</p></div>
            </div>
          )}
          <div className="bg-white rounded-2xl shadow p-5">
            <h2 className="font-bold text-gray-800 mb-3">🎤 Voice Memo</h2>
            <button onClick={isRecording?stopVoice:startVoice} disabled={parsing}
              className={`w-full py-5 rounded-xl font-semibold text-lg transition-all ${isRecording?'bg-red-500 text-white animate-pulse':parsing?'bg-gray-200 text-gray-400 cursor-not-allowed':'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
              {isRecording?'⏹ Stop Recording':parsing?'Processing…':'🎤 Tap to Speak'}
            </button>
            {isRecording && <p className="text-center text-sm text-red-500 mt-2 animate-pulse">Listening… tap Stop when done</p>}
            {dumpError  && <p className="text-center text-sm text-red-500 mt-2">{dumpError}</p>}
          </div>
          <div className="bg-white rounded-2xl shadow p-5">
            <h2 className="font-bold text-gray-800 mb-3">✍️ Quick Text</h2>
            <div className="flex gap-2">
              <input type="text" value={textInput} onChange={e=>setTextInput(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleTextSubmit()} disabled={parsing}
                placeholder="Type anything… grocery items auto-routed"
                className="flex-1 px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 disabled:bg-gray-50"/>
              <button onClick={handleTextSubmit} disabled={!textInput.trim()||parsing}
                className="px-5 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 disabled:opacity-40 text-xl font-bold">+</button>
            </div>
          </div>
          {captures.length > 0 && (
            <div className="bg-white rounded-2xl shadow p-5">
              <h2 className="font-bold text-gray-800 mb-3">Recent <span className="text-gray-400 font-normal text-sm">({pending} pending)</span></h2>
              {captures.slice(0,6).map(cap => {
                const cat = categories.find(c=>c.id===cap.category);
                return (
                  <div key={cap.id} className={`flex items-start gap-3 p-3 mb-2 rounded-xl border ${cap.completed?'opacity-40 bg-gray-50':'bg-white'}`}>
                    <div className="flex-1 min-w-0">
                      <p className={`text-sm text-gray-800 ${cap.completed?'line-through':''}`}>{cap.content}</p>
                      <div className="flex flex-wrap gap-1.5 mt-1.5">
                        <span className="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full">{cat?.icon} {cat?.name}</span>
                        <span className={`text-xs px-2 py-0.5 rounded-full ${cap.parent===parent1Name?'bg-blue-50 text-blue-700':'bg-pink-50 text-pink-700'}`}>{cap.parent}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
              {captures.length > 6 && <p className="text-xs text-center text-gray-400 mt-2">+{captures.length-6} more in 🧠 Organized</p>}
            </div>
          )}
        </div>
      );
    }

    // ── Organized Tab (preserved from v8.4) ───────────────────────────────────
    function OrganizedTab({ captures, setCaptures, groceries, setGroceries, categories, setCategories, parent1Name, parent2Name, syncWithGoogle }) {
      const [editingId,   setEditingId]   = useState(null);
      const [editingText, setEditingText] = useState('');
      const [newCatName,  setNewCatName]  = useState('');
      const [showNewCat,  setShowNewCat]  = useState(false);
      const [movingId,    setMovingId]    = useState(null);
      const [expandedCats,setExpandedCats]= useState({});

      const pending    = captures.filter(c=>!c.completed).length;
      const urgentItems= captures.filter(c=>{ const cat=categories.find(x=>x.id===c.category); return cat?.urgent&&!c.completed; });
      const byCategory = id => captures.filter(c=>c.category===id&&!c.completed);

      const toggleDone = id => {
        const u = captures.map(c=>c.id===id?{...c,completed:!c.completed}:c);
        setCaptures(u); syncWithGoogle(undefined,u,undefined,undefined,undefined);
      };
      const deleteCapture = id => {
        const u = captures.filter(c=>c.id!==id);
        setCaptures(u); syncWithGoogle(undefined,u,undefined,undefined,undefined);
      };
      const saveEdit = id => {
        const u = captures.map(c=>c.id===id?{...c,content:editingText}:c);
        setCaptures(u); syncWithGoogle(undefined,u,undefined,undefined,undefined);
        setEditingId(null); setEditingText('');
      };
      const changeCategory = (id, catId) => {
        const u = captures.map(c=>c.id===id?{...c,category:catId}:c);
        setCaptures(u); syncWithGoogle(undefined,u,undefined,undefined,undefined);
      };
      const moveToGrocery = async cap => {
        setMovingId(cap.id);
        try {
          const itemNames = await parseItemsFromText(cap.content);
          const newItems = itemNames.map((name,i)=>({id:Date.now()+i,name:capitalize(name),store:'',completed:false,addedBy:cap.parent,timestamp:nowISO()}));
          const updG = [...newItems,...groceries];
          const updC = captures.filter(c=>c.id!==cap.id);
          setGroceries(updG); setCaptures(updC);
          syncWithGoogle(undefined,updC,updG,undefined,undefined);
        } finally { setMovingId(null); }
      };
      const addCustomCategory = () => {
        if (!newCatName.trim()) return;
        const newCat = { id:`custom_${Date.now()}`, name:newCatName.trim(), icon:'📌', urgent:false };
        const u = [...categories, newCat];
        setCategories(u); syncWithGoogle(undefined,undefined,undefined,u,undefined);
        setNewCatName(''); setShowNewCat(false);
      };

      return (
        <div className="space-y-3">
          {urgentItems.length > 0 && (
            <div className="bg-red-50 border-l-4 border-red-500 rounded-2xl p-4">
              <h3 className="font-bold text-red-800 mb-2">⚡ Urgent</h3>
              {urgentItems.map(cap => {
                const cat = categories.find(c=>c.id===cap.category);
                return (
                  <div key={cap.id} className="flex items-center gap-2 text-sm text-red-700 mb-1">
                    <span>{cat?.icon}</span><span className="flex-1">{cap.content}</span>
                    <span className={`text-xs px-2 py-0.5 rounded-full ${cap.parent===parent1Name?'bg-blue-100 text-blue-700':'bg-pink-100 text-pink-700'}`}>{cap.parent}</span>
                  </div>
                );
              })}
            </div>
          )}
          <div className="grid grid-cols-3 gap-3">
            {[
              {label:'Pending',value:pending,cls:'text-indigo-700'},
              {label:'Done',value:captures.filter(c=>c.completed).length,cls:'text-green-600'},
              {label:'Active cats',value:new Set(captures.filter(c=>!c.completed).map(c=>c.category)).size,cls:'text-amber-600'},
            ].map(s => (
              <div key={s.label} className="bg-white rounded-2xl p-3 text-center shadow">
                <div className={`text-2xl font-bold ${s.cls}`}>{s.value}</div>
                <div className="text-xs text-gray-500">{s.label}</div>
              </div>
            ))}
          </div>
          <div className="bg-white rounded-2xl shadow p-4">
            {!showNewCat ? (
              <button onClick={()=>setShowNewCat(true)} className="text-sm text-indigo-600 font-medium">+ Add custom category</button>
            ) : (
              <div className="flex gap-2">
                <input value={newCatName} onChange={e=>setNewCatName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustomCategory()}
                  placeholder="Category name…" className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" autoFocus/>
                <button onClick={addCustomCategory} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium">Add</button>
                <button onClick={()=>{setShowNewCat(false);setNewCatName('');}} className="px-4 py-2 bg-gray-100 text-gray-600 rounded-xl text-sm">Cancel</button>
              </div>
            )}
          </div>
          {categories.map(cat => {
            const items = byCategory(cat.id);
            if (!items.length) return null;
            const open = !!expandedCats[cat.id];
            return (
              <div key={cat.id} className="bg-white rounded-2xl shadow overflow-hidden">
                <button onClick={()=>setExpandedCats(p=>({...p,[cat.id]:!p[cat.id]}))}
                  className="w-full px-4 py-3 flex items-center justify-between hover:bg-gray-50">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">{cat.icon}</span>
                    <span className="font-semibold text-gray-800">{cat.name}</span>
                    <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${cat.urgent?'bg-red-100 text-red-700':'bg-gray-100 text-gray-600'}`}>{items.length}</span>
                  </div>
                  <span className="text-gray-400 text-sm">{open?'▼':'▶'}</span>
                </button>
                {open && (
                  <div className="px-4 pb-4 space-y-2 border-t pt-3">
                    {items.map(cap => (
                      <div key={cap.id} className="flex items-start gap-3 p-3 bg-gray-50 rounded-xl">
                        <button onClick={()=>toggleDone(cap.id)} className="mt-0.5 flex-shrink-0">
                          <div className="w-5 h-5 rounded border-2 border-gray-300 hover:border-green-400 transition-colors"/>
                        </button>
                        <div className="flex-1 min-w-0">
                          {editingId===cap.id ? (
                            <div className="flex gap-2 mb-2">
                              <input value={editingText} onChange={e=>setEditingText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveEdit(cap.id)}
                                className="flex-1 px-2 py-1 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" autoFocus/>
                              <button onClick={()=>saveEdit(cap.id)} className="px-2 py-1 bg-indigo-600 text-white rounded-lg text-xs font-medium">Save</button>
                              <button onClick={()=>{setEditingId(null);setEditingText('');}} className="px-2 py-1 bg-gray-200 text-gray-600 rounded-lg text-xs">×</button>
                            </div>
                          ) : (
                            <p className="text-sm text-gray-800 mb-1.5">{cap.content}</p>
                          )}
                          <div className="flex flex-wrap items-center gap-1.5">
                            <select value={cap.category} onChange={e=>changeCategory(cap.id,e.target.value)}
                              className="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full border-0 focus:ring-1 focus:ring-indigo-400 cursor-pointer">
                              {categories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                            </select>
                            <span className={`text-xs px-2 py-0.5 rounded-full ${cap.parent===parent1Name?'bg-blue-50 text-blue-700':'bg-pink-50 text-pink-700'}`}>{cap.parent}</span>
                          </div>
                        </div>
                        <div className="flex flex-col gap-1 flex-shrink-0">
                          {editingId!==cap.id && <button onClick={()=>{setEditingId(cap.id);setEditingText(cap.content);}} className="text-xs text-gray-400 hover:text-indigo-600 px-1.5 py-0.5 rounded hover:bg-indigo-50">✏️</button>}
                          <button onClick={()=>moveToGrocery(cap)} disabled={movingId===cap.id}
                            className="text-xs text-gray-400 hover:text-green-600 px-1.5 py-0.5 rounded hover:bg-green-50 disabled:opacity-40">
                            {movingId===cap.id?'⏳':'🛒'}
                          </button>
                          <button onClick={()=>deleteCapture(cap.id)} className="text-gray-300 hover:text-red-400 text-lg leading-none">×</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
          {!pending && (
            <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
              <div className="text-5xl mb-3">🧠</div>
              <p className="font-medium text-gray-600">All clear!</p>
              <p className="text-sm mt-1">No pending items.</p>
            </div>
          )}
        </div>
      );
    }

    // ── Grocery Tab — extended v20 ────────────────────────────────────────────
    function GroceryTab({ groceries, setGroceries, stores, setStores, categories, parent1Name, parent2Name, captureParent, syncWithGoogle, mealPlanSlots, ingredients, pantry, setPantry }) {
      const [groceryInput,  setGroceryInput]  = useState('');
      const [showNewStore,  setShowNewStore]  = useState(false);
      const [newStoreName,  setNewStoreName]  = useState('');
      const [promoteModal,  setPromoteModal]  = useState(null); // grocery item being promoted
      const [promoteIng,    setPromoteIng]    = useState('');
      const [promoteQty,    setPromoteQty]    = useState('');
      const [promoteUnit,   setPromoteUnit]   = useState('piece');
      const [showSuppressed,setShowSuppressed]= useState(false);

      const groceryPending = groceries.filter(g=>!g.completed).length;

      // Determine pantry-backed status for items with ingredientId
      const isPantryBacked = (item) => {
        if (!item.ingredientId) return false;
        const rows  = pantry.filter(p=>p.ingredientId===item.ingredientId);
        const total = rows.reduce((s,p)=>s+parseFloat(p.quantity||0),0);
        const needed= parseFloat(item.quantity||1);
        return total >= needed;
      };

      // Split items: pantry-backed (suppressed) vs needed
      const pendingItems    = groceries.filter(g=>!g.completed && !isPantryBacked(g));
      const suppressedItems = groceries.filter(g=>!g.completed &&  isPantryBacked(g));
      const completedItems  = groceries.filter(g=>g.completed);

      // Is this item a legacy row (no ingredientId)?
      const isLegacy = (item) => !item.ingredientId;

      const addItem = () => {
        if (!groceryInput.trim()) return;
        const newItem = { id:Date.now(), name:groceryInput.trim(), store:'', completed:false, addedBy:captureParent, timestamp:nowISO() };
        const u = [newItem,...groceries];
        setGroceries(u); syncWithGoogle(undefined,undefined,u,undefined,undefined);
        setGroceryInput('');
      };
      const toggleDone = (id) => {
        const u = groceries.map(g=>g.id===id?{...g,completed:!g.completed}:g);
        setGroceries(u); syncWithGoogle(undefined,undefined,u,undefined,undefined);
        // §16c: on completion → add to Pantry if ingredientId present
        const item = groceries.find(g=>g.id===id);
        if (item && item.ingredientId && !item.completed) {
          const pantryRow = {
            pantryId:uuid(), ingredientId:item.ingredientId,
            quantity:parseFloat(item.quantity||1), unit:item.unit||'piece',
            addedAt:nowISO(), addedVia:'grocery_completion', expiryDate:null,
          };
          setPantry(ps=>[...ps,pantryRow]);
          appendRow('Pantry', pantryRow);
          // §16c: preferredStore learning — 3 consecutive same-store → set preferredStore
          if (item.store && item.ingredientId) {
            const ing = ingredients.find(i=>i.ingredientId===item.ingredientId);
            if (ing) {
              const recentSameStore = completedItems.filter(g=>g.ingredientId===item.ingredientId&&g.store===item.store).length;
              if (recentSameStore >= 2) { // this is the 3rd
                updateRow('Ingredients', item.ingredientId, { preferredStore: item.store });
              }
            }
          }
        }
      };
      const deleteItem = id => {
        const u = groceries.filter(g=>g.id!==id);
        setGroceries(u); syncWithGoogle(undefined,undefined,u,undefined,undefined);
      };
      const updateStore = (id, store) => {
        const u = groceries.map(g=>g.id===id?{...g,store}:g);
        setGroceries(u); syncWithGoogle(undefined,undefined,u,undefined,undefined);
      };
      const clearCompleted = () => {
        const u = groceries.filter(g=>!g.completed);
        setGroceries(u); syncWithGoogle(undefined,undefined,u,undefined,undefined);
      };
      const addStore = () => {
        if (!newStoreName.trim()) return;
        const u = [...stores,newStoreName.trim()];
        setStores(u); syncWithGoogle(undefined,undefined,undefined,undefined,u);
        setNewStoreName(''); setShowNewStore(false);
      };
      const buyAnyway = (id) => {
        const u = groceries.map(g=>g.id===id?{...g,pantryBacked:false,ingredientId:null}:g);
        setGroceries(u); syncWithGoogle(undefined,undefined,u,undefined,undefined);
      };
      // §16d: promote legacy row to v20 ingredient
      const openPromote = (item) => {
        setPromoteModal(item); setPromoteIng(item.name); setPromoteQty('1'); setPromoteUnit('piece');
      };
      const confirmPromote = () => {
        if (!promoteModal || !promoteIng.trim()) return;
        const ingId = uuid();
        const newIng = { ingredientId:ingId, canonicalName:promoteIng.trim(), lastUpdated:nowISO(), nutritionPer100g:'{}', needsReview:false };
        appendRow('Ingredients', newIng);
        const u = groceries.map(g=>g.id===promoteModal.id?{...g,name:promoteIng.trim(),ingredientId:ingId,quantity:promoteQty,unit:promoteUnit}:g);
        setGroceries(u); syncWithGoogle(undefined,undefined,u,undefined,undefined);
        setPromoteModal(null);
      };

      const GroceryRow = ({ item, showPromote }) => (
        <div key={item.id} className={`flex items-center gap-2 p-2.5 rounded-xl border mb-2 transition-colors ${item.completed?'bg-gray-50 opacity-60':'bg-white hover:bg-gray-50'} ${isLegacy(item)&&showPromote?'border-dashed border-gray-300':''}`}>
          <button onClick={()=>toggleDone(item.id)} className="flex-shrink-0">
            {item.completed ? (
              <div className="w-6 h-6 rounded-full bg-green-500 flex items-center justify-center text-white text-xs font-bold">✓</div>
            ) : (
              <div className="w-6 h-6 rounded-full border-2 border-gray-300 hover:border-green-500 transition-colors"/>
            )}
          </button>
          <div className="flex-1 min-w-0">
            <span className={`text-sm font-medium ${item.completed?'line-through text-gray-400':'text-gray-800'}`}>{item.name}</span>
            {item.quantity && <span className="text-xs text-gray-400 ml-1.5">{item.quantity} {item.unit}</span>}
            {isLegacy(item) && showPromote && (
              <button onClick={()=>openPromote(item)} className="ml-2 text-xs text-indigo-500 hover:underline">promote</button>
            )}
          </div>
          {!item.completed && (
            <select value={item.store||''} onChange={e=>updateStore(item.id,e.target.value)}
              className="text-xs px-2 py-1 border border-gray-200 rounded-lg bg-white text-gray-600 focus:outline-none flex-shrink-0 max-w-[90px]">
              <option value="">— store —</option>
              {stores.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          )}
          <button onClick={()=>deleteItem(item.id)} className="text-gray-300 hover:text-red-400 text-lg flex-shrink-0">×</button>
        </div>
      );

      return (
        <div className="space-y-4">
          {/* Add item + store management */}
          <div className="bg-white rounded-2xl shadow p-5">
            <h2 className="font-bold text-gray-800 mb-3">🛒 Grocery List</h2>
            <div className="flex gap-2 mb-2">
              <input value={groceryInput} onChange={e=>setGroceryInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addItem()}
                placeholder="Add an item…" className="flex-1 px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-400"/>
              <button onClick={addItem} disabled={!groceryInput.trim()} className="px-5 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 disabled:opacity-40 text-xl font-bold">+</button>
            </div>
            <p className="text-xs text-gray-400 mb-3">Auto-routed from Mental Dump · Meal Plan projects ingredients here</p>
            <div className="border-t pt-3">
              <p className="text-xs text-gray-500 font-medium mb-2">Stores: {stores.join(' · ')}</p>
              {!showNewStore ? (
                <button onClick={()=>setShowNewStore(true)} className="text-xs text-indigo-600 font-medium">+ Add store</button>
              ) : (
                <div className="flex gap-2">
                  <input value={newStoreName} onChange={e=>setNewStoreName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addStore()}
                    placeholder="Store name…" className="flex-1 px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" autoFocus/>
                  <button onClick={addStore} className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-medium">Add</button>
                  <button onClick={()=>{setShowNewStore(false);setNewStoreName('');}} className="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-xs">Cancel</button>
                </div>
              )}
            </div>
          </div>

          {/* Main list */}
          {(pendingItems.length > 0 || suppressedItems.length > 0 || completedItems.length > 0) ? (
            <div className="bg-white rounded-2xl shadow p-5">
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold text-gray-800">{pendingItems.length} item{pendingItems.length!==1?'s':''} to get</h3>
                {completedItems.length > 0 && <button onClick={clearCompleted} className="text-xs text-red-400 hover:text-red-600 font-medium">Clear done</button>}
              </div>

              {/* Pending items */}
              {pendingItems.map(item => <GroceryRow key={item.id} item={item} showPromote={true}/>)}

              {/* Pantry-suppressed section */}
              {suppressedItems.length > 0 && (
                <div className="border-t mt-3 pt-3">
                  <button onClick={()=>setShowSuppressed(s=>!s)} className="w-full flex items-center justify-between text-xs text-gray-500 font-medium mb-2 hover:text-gray-700">
                    <span>✅ You're good on: {suppressedItems.map(i=>i.name).slice(0,3).join(', ')}{suppressedItems.length>3?` +${suppressedItems.length-3}`:''}</span>
                    <span>{showSuppressed?'▼':'▶'}</span>
                  </button>
                  {showSuppressed && suppressedItems.map(item => (
                    <div key={item.id} className="flex items-center gap-2 p-2.5 rounded-xl border mb-1.5 bg-green-50 border-green-100">
                      <span className="text-green-500 text-sm">✓</span>
                      <span className="flex-1 text-sm text-gray-600 line-through">{item.name}</span>
                      <button onClick={()=>buyAnyway(item.id)} className="text-xs text-indigo-500 hover:underline flex-shrink-0">buy anyway</button>
                      <button onClick={()=>deleteItem(item.id)} className="text-gray-300 hover:text-red-400 text-lg">×</button>
                    </div>
                  ))}
                </div>
              )}

              {/* In cart */}
              {completedItems.length > 0 && (
                <div className="border-t mt-3 pt-3">
                  <p className="text-xs text-gray-400 font-medium uppercase tracking-wide mb-2">In cart</p>
                  {completedItems.map(item => <GroceryRow key={item.id} item={item} showPromote={false}/>)}
                </div>
              )}

              {pendingItems.length === 0 && suppressedItems.length === 0 && completedItems.length > 0 && (
                <p className="text-center text-sm text-green-600 font-medium py-4">🎉 All items in cart!</p>
              )}
            </div>
          ) : (
            <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
              <div className="text-5xl mb-3">🛒</div>
              <p className="font-medium text-gray-600">List is empty</p>
              <p className="text-sm mt-1">Add items above · say "add milk and eggs" in Dump · assign meals in Meal Plan</p>
            </div>
          )}

          {/* Promote legacy row modal */}
          {promoteModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end" onClick={()=>setPromoteModal(null)}>
              <div className="bg-white rounded-t-3xl w-full p-5 space-y-3" onClick={e=>e.stopPropagation()}>
                <h3 className="font-bold text-gray-800">Promote to v20 ingredient</h3>
                <p className="text-xs text-gray-500">Adds to Ingredients table so Pantry tracking and nutrition work.</p>
                <input value={promoteIng} onChange={e=>setPromoteIng(e.target.value)} placeholder="Canonical ingredient name"
                  className="w-full px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                <div className="flex gap-2">
                  <input type="number" value={promoteQty} onChange={e=>setPromoteQty(e.target.value)} placeholder="Qty"
                    className="w-20 px-3 py-2 border rounded-xl text-sm focus:outline-none text-center"/>
                  <select value={promoteUnit} onChange={e=>setPromoteUnit(e.target.value)} className="flex-1 px-3 py-2 border rounded-xl text-sm focus:outline-none">
                    {['g','kg','ml','l','tsp','tbsp','cup','oz','lb','piece','pinch'].map(u=><option key={u}>{u}</option>)}
                  </select>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setPromoteModal(null)} className="flex-1 py-3 border border-gray-200 rounded-xl text-sm text-gray-600">Cancel</button>
                  <button onClick={confirmPromote} disabled={!promoteIng.trim()} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold disabled:opacity-40">Promote</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════════════════════
    // MAIN APP
    // ══════════════════════════════════════════════════════════════════════════
    function App() {
      // ── v8.4 shared state ────────────────────────────────────────────────────
      const [activeTab,    setActiveTab]    = useState('overview');
      const [parent1Name,  setParent1Name]  = useState('Fernando');
      const [parent2Name,  setParent2Name]  = useState('Yenny');
      const [currentWeek,  setCurrentWeek]  = useState('');
      const [syncStatus,   setSyncStatus]   = useState('ready');
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [categories,   setCategories]   = useState(DEFAULT_CATEGORIES);
      const [stores,       setStores]       = useState(DEFAULT_STORES);
      const [captureParent,setCaptureParent]= useState('Fernando');

      // ── v8.4 data ────────────────────────────────────────────────────────────
      const [weekData,  setWeekData]  = useState(null);
      const [captures,  setCaptures]  = useState([]);
      const [groceries, setGroceries] = useState([]);

      // ── v20 data ─────────────────────────────────────────────────────────────
      const [recipes,           setRecipes]           = useState([]);
      const [ingredients,       setIngredients]       = useState([]);
      const [recipeIngredients, setRecipeIngredients] = useState([]);
      const [mealPlanSlots,     setMealPlanSlots]     = useState([]);
      const [pantry,            setPantry]            = useState([]);
      const [family,            setFamily]            = useState([]);
      const [v20Loading,        setV20Loading]        = useState(true);

      // ── Week navigation ──────────────────────────────────────────────────────
      const [viewWeek, setViewWeek] = useState(() => toISOWeek(getMonday(new Date())));

      // ── Modal state ──────────────────────────────────────────────────────────
      const [selectedRecipeId,  setSelectedRecipeId]  = useState(null);
      const [showAddRecipe,     setShowAddRecipe]     = useState(false);
      const [showBarcodeScanner,setShowBarcodeScanner]= useState(false);
      const [showReceiptCapture,setShowReceiptCapture]= useState(false);
      const [receiptMode,       setReceiptMode]       = useState('photo');

      // ── v8.4 sync ────────────────────────────────────────────────────────────
      const syncWithGoogle = useCallback(async (saveWeek, saveDump, saveGroceries, saveCategories, saveStores) => {
        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'PASTE_YOUR_URL_HERE') { setSyncStatus('setup_needed'); return; }
        try {
          setSyncStatus('syncing');
          const isWrite = [saveWeek,saveDump,saveGroceries,saveCategories,saveStores].some(v=>v!==undefined);
          if (isWrite) {
            await fetch(GOOGLE_SCRIPT_URL, {
              method:'POST', mode:'no-cors',
              body: JSON.stringify({
                weekData:   saveWeek      !==undefined ? saveWeek      : weekData,
                captures:   saveDump      !==undefined ? saveDump      : captures,
                groceries:  saveGroceries !==undefined ? saveGroceries : groceries,
                categories: saveCategories!==undefined ? saveCategories: categories,
                stores:     saveStores    !==undefined ? saveStores    : stores,
                parent1Name, parent2Name, currentWeek,
              })
            });
          } else {
            const res  = await fetch(GOOGLE_SCRIPT_URL);
            const data = await res.json();
            if (data?.weekData)    setWeekData(data.weekData);
            if (data?.captures)    setCaptures(data.captures);
            if (data?.groceries)   setGroceries(data.groceries);
            if (data?.categories)  setCategories(data.categories);
            if (data?.stores)      setStores(data.stores);
            if (data?.parent1Name) setParent1Name(data.parent1Name);
            if (data?.parent2Name) setParent2Name(data.parent2Name);
            if (data?.currentWeek) setCurrentWeek(data.currentWeek);
          }
          setSyncStatus('synced'); setLastSyncTime(new Date());
        } catch { setSyncStatus('error'); }
      }, [weekData,captures,groceries,categories,stores,parent1Name,parent2Name,currentWeek]);

      useEffect(() => {
        syncWithGoogle();
        const id = setInterval(() => syncWithGoogle(), SYNC_INTERVAL);
        return () => clearInterval(id);
      }, []);

      // ── v20 data loader ──────────────────────────────────────────────────────
      const loadV20Data = useCallback(async () => {
        try {
          const [r,i,ri,mp,p,f] = await Promise.all([
            loadSheet('Recipes'), loadSheet('Ingredients'), loadSheet('RecipeIngredients'),
            loadSheet('MealPlanSlots'), loadSheet('Pantry'), loadSheet('Family'),
          ]);
          if (Array.isArray(r))  setRecipes(r);
          if (Array.isArray(i))  setIngredients(i);
          if (Array.isArray(ri)) setRecipeIngredients(ri);
          if (Array.isArray(mp)) setMealPlanSlots(mp);
          if (Array.isArray(p))  setPantry(p);
          if (Array.isArray(f))  setFamily(f);
        } catch(err) { console.warn('v20 data load error:', err); }
        finally { setV20Loading(false); }
      }, []);

      useEffect(() => {
        loadV20Data();
        const id = setInterval(loadV20Data, V20_POLL_INTERVAL);
        return () => clearInterval(id);
      }, []);

      // ── Debug panel (?debug=1) ────────────────────────────────────────────────
      const isDebug = new URLSearchParams(window.location.search).get('debug') === '1';

      // ── Derived counts ────────────────────────────────────────────────────────
      const pending        = captures.filter(c=>!c.completed).length;
      const groceryPending = groceries.filter(g=>!g.completed).length;
      const needsReview    = ingredients.filter(i=>i.needsReview==='true'||i.needsReview===true).length;

      const badgeInfo = ({
        syncing:      {icon:'🔄',text:'Syncing…',    cls:'text-blue-500'  },
        synced:       {icon:'✅',text:'Synced',       cls:'text-green-600' },
        error:        {icon:'⚠️',text:'Sync error',   cls:'text-red-500'   },
        setup_needed: {icon:'⚙️',text:'Setup needed', cls:'text-orange-500'},
      })[syncStatus]||{icon:'⏸️',text:'Ready',cls:'text-gray-400'};

      // ── Render ────────────────────────────────────────────────────────────────
      return (
        <div className="min-h-screen bg-indigo-50">
          {/* ── HEADER ─────────────────────────────── */}
          <div className="bg-white shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-40">
            <div>
              <h1 className="text-lg font-bold text-indigo-900 flex items-center gap-2">
                👨‍👩‍👦 Family Coordinator
                <span className="text-xs font-normal px-2 py-0.5 bg-indigo-100 text-indigo-600 rounded-full">v20</span>
              </h1>
              <div className={`flex items-center gap-1 text-xs ${badgeInfo.cls}`}>
                <span>{badgeInfo.icon}</span><span>{badgeInfo.text}</span>
                {lastSyncTime && <span className="text-gray-400 ml-1">{lastSyncTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>}
              </div>
            </div>
            <div className="flex gap-2">
              {groceryPending > 0 && <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full">🛒 {groceryPending}</span>}
              {pending > 0        && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full">🧠 {pending}</span>}
              {needsReview > 0    && <span className="bg-orange-100 text-orange-700 text-xs font-bold px-2 py-1 rounded-full">⚠️ {needsReview}</span>}
            </div>
          </div>

          {/* ── DESKTOP TOP TABS ─────────────────── */}
          <div className="top-tabs bg-white border-b px-4 gap-1 overflow-x-auto">
            {TABS.map(tab => (
              <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
                className={`flex items-center gap-1.5 py-3 px-4 text-sm font-medium border-b-2 transition-all whitespace-nowrap ${activeTab===tab.id?'border-indigo-600 text-indigo-600':'border-transparent text-gray-500 hover:text-gray-700'}`}>
                {tab.icon} {tab.label}
              </button>
            ))}
          </div>

          {/* ── DEBUG PANEL ──────────────────────── */}
          {isDebug && (
            <div className="bg-yellow-50 border-b border-yellow-200 px-4 py-2 text-xs font-mono text-yellow-800 overflow-x-auto">
              v20 | week:{viewWeek} | recipes:{recipes.length} | pantry:{pantry.length} | ingredients:{ingredients.length} | slots:{mealPlanSlots.length} | needsReview:{needsReview} | v20Loading:{String(v20Loading)}
            </div>
          )}

          {/* ── CONTENT ──────────────────────────── */}
          <div className="max-w-2xl mx-auto px-4 py-4 tab-content">
            {activeTab === 'overview'  && <OverviewTab week={viewWeek} onWeekChange={setViewWeek} mealPlanSlots={mealPlanSlots} recipes={recipes} weekData={weekData} captures={captures} categories={categories} groceries={groceries} parent1Name={parent1Name} parent2Name={parent2Name}/>}
            {activeTab === 'mealplan'  && <MealPlanTab week={viewWeek} onWeekChange={setViewWeek} recipes={recipes} mealPlanSlots={mealPlanSlots} setMealPlanSlots={setMealPlanSlots} ingredients={ingredients} recipeIngredients={recipeIngredients} pantry={pantry} groceries={groceries} setGroceries={setGroceries} onAddRecipe={()=>setShowAddRecipe(true)} onViewRecipe={setSelectedRecipeId}/>}
            {activeTab === 'schedule'  && <ScheduleTab weekData={weekData} setWeekData={setWeekData} parent1Name={parent1Name} parent2Name={parent2Name} syncWithGoogle={syncWithGoogle} currentWeek={currentWeek} setCurrentWeek={setCurrentWeek}/>}
            {activeTab === 'dump'      && <DumpTab captures={captures} setCaptures={setCaptures} groceries={groceries} setGroceries={setGroceries} categories={categories} parent1Name={parent1Name} parent2Name={parent2Name} captureParent={captureParent} setCaptureParent={setCaptureParent} syncWithGoogle={syncWithGoogle}/>}
            {activeTab === 'organized' && <OrganizedTab captures={captures} setCaptures={setCaptures} groceries={groceries} setGroceries={setGroceries} categories={categories} setCategories={setCategories} parent1Name={parent1Name} parent2Name={parent2Name} syncWithGoogle={syncWithGoogle}/>}
            {activeTab === 'grocery'   && <GroceryTab groceries={groceries} setGroceries={setGroceries} stores={stores} setStores={setStores} categories={categories} parent1Name={parent1Name} parent2Name={parent2Name} captureParent={captureParent} syncWithGoogle={syncWithGoogle} mealPlanSlots={mealPlanSlots} ingredients={ingredients} pantry={pantry} setPantry={setPantry}/>}
            {activeTab === 'pantry'    && <PantryTab pantry={pantry} setPantry={setPantry} ingredients={ingredients} setIngredients={setIngredients} onBarcodeOpen={()=>setShowBarcodeScanner(true)} onReceiptOpen={(mode)=>{setReceiptMode(mode);setShowReceiptCapture(true);}}/>}
          </div>

          {/* ── MOBILE BOTTOM NAV ────────────────── */}
          <nav className="bottom-nav bg-white border-t shadow-lg">
            <div className="flex">
              {TABS.map(tab => (
                <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
                  className={`flex-1 flex flex-col items-center py-2 text-xs transition-colors ${activeTab===tab.id?'text-indigo-600':'text-gray-400 hover:text-gray-600'}`}>
                  <span className="text-lg mb-0.5">{tab.icon}</span>
                  <span className="leading-tight">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>

          {/* ── MODALS ───────────────────────────── */}
          {selectedRecipeId && (
            <RecipeDetailModal recipeId={selectedRecipeId} recipes={recipes} recipeIngredients={recipeIngredients} ingredients={ingredients} pantry={pantry} mealPlanSlots={mealPlanSlots} onClose={()=>setSelectedRecipeId(null)} onUpdateRecipe={(id,row)=>{setRecipes(rs=>rs.map(r=>r.recipeId===id?{...r,...row}:r));updateRow('Recipes',id,row);}} onUpdateMealPlanSlots={setMealPlanSlots} onUpdatePantry={setPantry}/>
          )}
          {showAddRecipe && (
            <AddRecipeModal onClose={()=>setShowAddRecipe(false)} onSave={(recipe,ings,ris)=>{setRecipes(rs=>[...rs,recipe]);setIngredients(is=>[...is,...ings]);setRecipeIngredients(ris2=>[...ris2,...ris]);setShowAddRecipe(false);}} ingredients={ingredients} setIngredients={setIngredients}/>
          )}
          {showBarcodeScanner && (
            <BarcodeScannerModal onClose={()=>setShowBarcodeScanner(false)} onResult={(ing,pantryRow)=>{setIngredients(is=>{const idx=is.findIndex(i=>i.openFoodFactsBarcode===ing.openFoodFactsBarcode);return idx>=0?is.map((i,j)=>j===idx?{...i,...ing}:i):[...is,ing];});if(pantryRow){setPantry(ps=>[...ps,pantryRow]);}setShowBarcodeScanner(false);}} ingredients={ingredients}/>
          )}
          {showReceiptCapture && (
            <ReceiptCaptureModal mode={receiptMode} onClose={()=>setShowReceiptCapture(false)} onResult={(newPantryRows)=>{setPantry(ps=>[...ps,...newPantryRows]);setShowReceiptCapture(false);}}/>
          )}
        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
