<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Coordinator v6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================================
        // ⚠️ SETUP: Paste your Google Apps Script Web App URL here
        // Update your Apps Script using the guide at the bottom
        // ============================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzq-qyZLWJDIvAg5FaAJYkyqkEM47Zopi9YvafD77HwdqjIQIYceiNpHHB4KxEog2O/exec";

        const SYNC_INTERVAL = 5000;

        const DROPOFF_WINDOW = { start: "9:00 AM",  end: "9:30 AM"  };
        const PICKUP_WINDOW  = { start: "12:30 PM", end: "1:00 PM"  };
        const NAP_WINDOW     = { start: "1:30 PM",  end: "2:00 PM"  };

        // ============================================================
        // MENTAL DUMP CATEGORIES
        // ============================================================
        const CATEGORIES = [
            { id: 'health',    name: 'Health & Appointments', icon: '🏥', urgent: true  },
            { id: 'school',    name: 'School & Activities',   icon: '🎒', urgent: true  },
            { id: 'home',      name: 'Home Maintenance',      icon: '🔧', urgent: false },
            { id: 'financial', name: 'Financial',             icon: '💰', urgent: false },
            { id: 'social',    name: 'Social / Family',       icon: '👨‍👩‍👧', urgent: false },
            { id: 'travel',    name: 'Travel & Events',       icon: '✈️',  urgent: false },
            { id: 'parenting', name: 'Parenting / Private',   icon: '🔒', urgent: false },
            { id: 'projects',  name: 'Projects',              icon: '📋', urgent: false },
            { id: 'ideas',     name: 'Ideas / Someday',       icon: '💡', urgent: false },
            { id: 'hurricane', name: 'Hurricane Prep',        icon: '🌀', urgent: false },
        ];

        function guessCategory(text) {
            const t = text.toLowerCase();
            if (/doctor|dentist|appointment|sick|medicine|pharmacy|pediatr|vaccine|fever|health/.test(t)) return 'health';
            if (/school|teacher|homework|leo|pickup|dropoff|daycare|class|activity|sport/.test(t))        return 'school';
            if (/fix|repair|plumber|ac|roof|paint|clean|leak|handyman|maintenance/.test(t))               return 'home';
            if (/pay|bill|insurance|tax|budget|bank|money|credit|expense|invoice/.test(t))                return 'financial';
            if (/birthday|party|dinner|friend|family|visit|invite|event|celebration/.test(t))             return 'social';
            if (/trip|flight|hotel|vacation|travel|pack|passport|book/.test(t))                           return 'travel';
            if (/private|personal|parenting|discipline|behavior|routine/.test(t))                         return 'parenting';
            if (/project|build|create|design|develop|launch|plan/.test(t))                                return 'projects';
            if (/hurricane|storm|prep|supplies|generator|shutter/.test(t))                                return 'hurricane';
            return 'ideas';
        }

        // ============================================================
        // MAIN APP
        // ============================================================
        function FamilyCoordinator() {

            // ── Shared ────────────────────────────────────────────
            const [activeTab,    setActiveTab]    = useState('schedule');
            const [parent1Name,  setParent1Name]  = useState('Fernando');
            const [parent2Name,  setParent2Name]  = useState('Yenny');
            const [currentWeek,  setCurrentWeek]  = useState('');
            const [syncStatus,   setSyncStatus]   = useState('ready');
            const [lastSyncTime, setLastSyncTime] = useState(null);

            // ── Schedule tab ──────────────────────────────────────
            const [parent1Image, setParent1Image] = useState(null);
            const [parent2Image, setParent2Image] = useState(null);
            const [analyzing,    setAnalyzing]    = useState(null); // null | 'reading' | 'assigning'
            const [analyzeError, setAnalyzeError] = useState('');
            const [weekData,     setWeekData]     = useState(null);
            const [expandedDay,  setExpandedDay]  = useState(null);

            // ── Mental Dump tab ───────────────────────────────────
            const [captures,      setCaptures]     = useState([]);
            const [textInput,     setTextInput]    = useState('');
            const [captureParent, setCaptureParent]= useState('Fernando');
            const [isRecording,   setIsRecording]  = useState(false);
            const [dumpError,     setDumpError]    = useState('');
            const recognitionRef = useRef(null);

            // ── Organized tab ─────────────────────────────────────
            const [expandedCats, setExpandedCats] = useState({});

            // ============================================================
            // GOOGLE SHEETS SYNC
            // ============================================================
            const syncWithGoogle = async (saveWeek, saveDump) => {
                if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'PASTE_YOUR_URL_HERE') {
                    setSyncStatus('setup_needed');
                    return;
                }
                try {
                    setSyncStatus('syncing');
                    if (saveWeek !== undefined || saveDump !== undefined) {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({
                                weekData:    saveWeek  !== undefined ? saveWeek  : weekData,
                                captures:    saveDump  !== undefined ? saveDump  : captures,
                                parent1Name,
                                parent2Name,
                                currentWeek,
                            })
                        });
                    } else {
                        const res  = await fetch(GOOGLE_SCRIPT_URL);
                        const data = await res.json();
                        if (data?.weekData)    setWeekData(data.weekData);
                        if (data?.captures)    setCaptures(data.captures);
                        if (data?.parent1Name) setParent1Name(data.parent1Name);
                        if (data?.parent2Name) setParent2Name(data.parent2Name);
                        if (data?.currentWeek) setCurrentWeek(data.currentWeek);
                    }
                    setSyncStatus('synced');
                    setLastSyncTime(new Date());
                } catch {
                    setSyncStatus('error');
                }
            };

            useEffect(() => {
                syncWithGoogle();
                const interval = setInterval(() => syncWithGoogle(), SYNC_INTERVAL);
                return () => clearInterval(interval);
            }, []);

            // ============================================================
            // SCHEDULE — image upload handler
            // ============================================================
            const handleImageUpload = (parent, e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    if (parent === 1) setParent1Image(reader.result);
                    else              setParent2Image(reader.result);
                };
                reader.readAsDataURL(file);
            };

            // ============================================================
            // SCHEDULE — Claude API analysis pipeline (3 sequential calls)
            // Sourced from family-schedule-coordinator.html,
            // extended to include nap duty and meeting extraction
            // ============================================================
            const analyzeSchedules = async () => {
                if (!parent1Image || !parent2Image) {
                    setAnalyzeError('Please upload both calendar screenshots first.');
                    return;
                }
                setAnalyzeError('');
                setAnalyzing('reading');

                try {
                    // CALL 1 — read Parent 1 calendar image
                    const res1 = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'image',
                                        source: {
                                            type: 'base64',
                                            media_type: 'image/jpeg',
                                            data: parent1Image.split(',')[1]
                                        }
                                    },
                                    {
                                        type: 'text',
                                        text: `This is ${parent1Name}'s work calendar for the week. Extract all of ${parent1Name}'s own meetings.

Rules:
- List each weekday (Monday-Friday) with meeting times in 12-hour format (e.g. 9:00 AM)
- IGNORE PTO/OOO entries that belong to other people, not ${parent1Name}
- IGNORE any items highlighted in orange or red that are reminders for other people
- Only include meetings ${parent1Name} must personally attend
- Also note the week dates shown (e.g. Jan 26 - Jan 30)

Format each day as:
Monday (1/26): [time] Meeting title, [time] Meeting title
Tuesday (1/27): [time] Meeting title
...`
                                    }
                                ]
                            }]
                        })
                    });
                    const d1 = await res1.json();
                    const schedule1 = d1.content[0].text;

                    // CALL 2 — read Parent 2 calendar image
                    const res2 = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'image',
                                        source: {
                                            type: 'base64',
                                            media_type: 'image/jpeg',
                                            data: parent2Image.split(',')[1]
                                        }
                                    },
                                    {
                                        type: 'text',
                                        text: `This is ${parent2Name}'s work calendar for the week. Extract all of ${parent2Name}'s own meetings.

Rules:
- List each weekday (Monday-Friday) with meeting times in 12-hour format (e.g. 9:00 AM)
- IGNORE any items with a red box or red outline around them — those are other people's events
- IGNORE PTO/OOO entries that belong to other people, not ${parent2Name}
- Only include meetings ${parent2Name} must personally attend

Format each day as:
Monday (1/26): [time] Meeting title, [time] Meeting title
Tuesday (1/27): [time] Meeting title
...`
                                    }
                                ]
                            }]
                        })
                    });
                    const d2 = await res2.json();
                    const schedule2 = d2.content[0].text;

                    // CALL 3 — conflict detection + duty assignment
                    setAnalyzing('assigning');

                    const res3 = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 2000,
                            messages: [{
                                role: 'user',
                                content: `You are a family schedule coordinator. Using both parents' schedules below, assign Leo's daycare duties for each weekday.

${parent1Name}'s schedule:
${schedule1}

${parent2Name}'s schedule:
${schedule2}

Daycare duty windows (a meeting overlapping these means the parent CANNOT do that duty):
- Drop-off: ${DROPOFF_WINDOW.start} to ${DROPOFF_WINDOW.end}
- Pick-up:  ${PICKUP_WINDOW.start} to ${PICKUP_WINDOW.end}
- Nap duty: ${NAP_WINDOW.start} to ${NAP_WINDOW.end} (parent stays home with Leo after pickup)

Assignment rules:
1. If a parent has a meeting overlapping a window → they CANNOT do that duty
2. If only one parent is free → assign to them
3. If both are free → alternate fairly, ${parent1Name} first by default
4. If neither is free → assign "DISCUSS"
5. Nap duty: prefer the parent who did NOT do pick-up that day, if available
6. Include each parent's meetings in the output so they can see the full picture

Return ONLY a valid JSON object. No explanation, no markdown fences. Use this exact structure:
{
  "week": "Jan 26 – Jan 30, 2026",
  "days": [
    {
      "day": "Monday",
      "date": "1/26",
      "hidden": false,
      "notes": "",
      "fernando_meetings": [{"time": "9:00 AM", "title": "Meeting name"}],
      "yenny_meetings": [{"time": "1:00 PM", "title": "Meeting name"}],
      "dropoff": {"assigned": "${parent1Name}", "conflict": false, "reason": "Short reason why"},
      "pickup":  {"assigned": "${parent2Name}", "conflict": false, "reason": "Short reason why"},
      "nap":     {"assigned": "${parent1Name}", "conflict": false, "reason": "Short reason why"}
    }
  ]
}`
                            }]
                        })
                    });
                    const d3 = await res3.json();
                    const raw = d3.content[0].text;

                    // Parse JSON safely — strip any accidental markdown fences
                    const clean = raw.replace(/```json|```/g, '').trim();
                    const match = clean.match(/\{[\s\S]*\}/);
                    if (!match) throw new Error('Could not find JSON in response');
                    const parsed = JSON.parse(match[0]);

                    // Normalize — fill in any missing fields defensively
                    const normalized = {
                        ...parsed,
                        days: parsed.days.map(day => ({
                            hidden: false,
                            notes: '',
                            fernando_meetings: [],
                            yenny_meetings: [],
                            ...day,
                            dropoff: { conflict: false, reason: '', ...day.dropoff },
                            pickup:  { conflict: false, reason: '', ...day.pickup  },
                            nap:     { conflict: false, reason: '', ...day.nap     },
                        }))
                    };

                    if (normalized.week) setCurrentWeek(normalized.week);
                    setWeekData(normalized);
                    syncWithGoogle(normalized, undefined);

                } catch (err) {
                    console.error('Analysis error:', err);
                    setAnalyzeError('Analysis failed. Check your connection and try again. If the problem persists, make sure both images are clear calendar screenshots.');
                } finally {
                    setAnalyzing(null);
                }
            };

            // ============================================================
            // SCHEDULE — manual overrides (from v5)
            // ============================================================
            const saveSchedule = (newData) => {
                setWeekData(newData);
                syncWithGoogle(newData, undefined);
            };

            const toggleAssignment = (dayIndex, type) => {
                const nd = {
                    ...weekData,
                    days: weekData.days.map((d, i) => {
                        if (i !== dayIndex) return d;
                        const cur = d[type].assigned;
                        const next = cur === parent1Name ? parent2Name
                                   : cur === parent2Name ? 'DISCUSS'
                                   : parent1Name;
                        return { ...d, [type]: { ...d[type], assigned: next } };
                    })
                };
                saveSchedule(nd);
            };

            const toggleDayVisibility = (dayIndex) => {
                const nd = {
                    ...weekData,
                    days: weekData.days.map((d, i) =>
                        i === dayIndex ? { ...d, hidden: !d.hidden } : d
                    )
                };
                saveSchedule(nd);
            };

            const updateNotes = (dayIndex, notes) => {
                const nd = {
                    ...weekData,
                    days: weekData.days.map((d, i) =>
                        i === dayIndex ? { ...d, notes } : d
                    )
                };
                saveSchedule(nd);
            };

            const exportToClipboard = () => {
                let text = `📅 LEO'S SCHEDULE — ${currentWeek}\n\n`;
                (weekData?.days || []).filter(d => !d.hidden).forEach(day => {
                    text += `${day.day} ${day.date}:\n`;
                    text += `  🚗 Drop-off: ${day.dropoff.assigned}\n`;
                    text += `  🏠 Pick-up:  ${day.pickup.assigned}\n`;
                    text += `  😴 Nap:      ${day.nap.assigned}\n`;
                    if (day.notes) text += `  📝 ${day.notes}\n`;
                    text += '\n';
                });
                navigator.clipboard.writeText(text).then(() => alert('📋 Copied to clipboard!'));
            };

            // ============================================================
            // MENTAL DUMP — captures
            // ============================================================
            const saveCapture = (content, type) => {
                const newCapture = {
                    id:        Date.now(),
                    content,
                    category:  guessCategory(content),
                    type,
                    parent:    captureParent,
                    timestamp: new Date().toISOString(),
                    completed: false,
                };
                const updated = [newCapture, ...captures];
                setCaptures(updated);
                syncWithGoogle(undefined, updated);
                setDumpError('');
            };

            const handleTextSubmit = () => {
                if (!textInput.trim()) return;
                saveCapture(textInput.trim(), 'text');
                setTextInput('');
            };

            const startVoice = () => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    setDumpError('Voice recording not supported in this browser. Please use Chrome.');
                    return;
                }
                const rec = new SR();
                rec.lang = 'en-US';
                rec.interimResults = false;
                rec.onstart  = () => { setIsRecording(true); setDumpError(''); };
                rec.onend    = () => setIsRecording(false);
                rec.onerror  = (e) => {
                    setIsRecording(false);
                    setDumpError(e.error === 'not-allowed'
                        ? 'Microphone access denied. Check browser permissions.'
                        : `Voice error: ${e.error}`);
                };
                rec.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    saveCapture(transcript, 'voice');
                };
                recognitionRef.current = rec;
                rec.start();
            };

            const stopVoice = () => {
                recognitionRef.current?.stop();
                setIsRecording(false);
            };

            const toggleDone = (id) => {
                const updated = captures.map(c => c.id === id ? { ...c, completed: !c.completed } : c);
                setCaptures(updated);
                syncWithGoogle(undefined, updated);
            };

            const deleteCapture = (id) => {
                const updated = captures.filter(c => c.id !== id);
                setCaptures(updated);
                syncWithGoogle(undefined, updated);
            };

            // ============================================================
            // DERIVED VALUES
            // ============================================================
            const pending      = captures.filter(c => !c.completed).length;
            const urgentItems  = captures.filter(c => {
                const cat = CATEGORIES.find(x => x.id === c.category);
                return cat?.urgent && !c.completed;
            });
            const byCategory   = (id) => captures.filter(c => c.category === id && !c.completed);
            const visibleDays  = weekData?.days?.filter(d => !d.hidden) || [];

            const badge = ({
                syncing:      { icon: '🔄', text: 'Syncing…',    cls: 'text-blue-500'   },
                synced:       { icon: '✅', text: 'Synced',       cls: 'text-green-600'  },
                error:        { icon: '⚠️', text: 'Sync error',   cls: 'text-red-500'    },
                setup_needed: { icon: '⚙️', text: 'Setup needed', cls: 'text-orange-500' },
            })[syncStatus] || { icon: '⏸️', text: 'Ready', cls: 'text-gray-400' };

            // ============================================================
            // RENDER
            // ============================================================
            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8">
                    <div className="max-w-5xl mx-auto">

                        {/* ── HEADER ───────────────────────────────── */}
                        <div className="bg-white rounded-2xl shadow-xl p-5 mb-5">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h1 className="text-2xl font-bold text-indigo-900">
                                        👨‍👩‍👦 Family Coordinator
                                        <span className="text-xs font-normal ml-2 px-2 py-0.5 bg-indigo-100 text-indigo-600 rounded-full">v6</span>
                                    </h1>
                                    {currentWeek && <p className="text-gray-500 text-sm mt-0.5">{currentWeek}</p>}
                                    <div className={`flex items-center gap-1.5 mt-1 text-sm ${badge.cls}`}>
                                        <span>{badge.icon}</span>
                                        <span>{badge.text}</span>
                                        {lastSyncTime && (
                                            <span className="text-xs text-gray-400 ml-1">
                                                {lastSyncTime.toLocaleTimeString()}
                                            </span>
                                        )}
                                    </div>
                                </div>
                                <div className="flex gap-2 text-center">
                                    {weekData && (
                                        <div className="bg-indigo-50 px-3 py-2 rounded-xl">
                                            <div className="text-xl font-bold text-indigo-800">{visibleDays.length}</div>
                                            <div className="text-xs text-gray-500">Days</div>
                                        </div>
                                    )}
                                    {pending > 0 && (
                                        <div className="bg-amber-50 px-3 py-2 rounded-xl">
                                            <div className="text-xl font-bold text-amber-700">{pending}</div>
                                            <div className="text-xs text-gray-500">Pending</div>
                                        </div>
                                    )}
                                    {urgentItems.length > 0 && (
                                        <div className="bg-red-50 px-3 py-2 rounded-xl">
                                            <div className="text-xl font-bold text-red-600">{urgentItems.length}</div>
                                            <div className="text-xs text-gray-500">Urgent</div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3 mt-4">
                                <input type="text" value={parent1Name}
                                    onChange={e => setParent1Name(e.target.value)}
                                    className="px-3 py-2 border rounded-xl text-sm" placeholder="Parent 1 name" />
                                <input type="text" value={parent2Name}
                                    onChange={e => setParent2Name(e.target.value)}
                                    className="px-3 py-2 border rounded-xl text-sm" placeholder="Parent 2 name" />
                            </div>

                            {syncStatus === 'setup_needed' && (
                                <div className="mt-3 p-3 bg-orange-50 border border-orange-200 rounded-xl text-sm text-orange-800">
                                    ⚙️ <strong>Setup needed:</strong> Update your Google Apps Script using the guide at the bottom of this file, then paste the URL at the top.
                                </div>
                            )}
                        </div>

                        {/* ── TAB BAR ──────────────────────────────── */}
                        <div className="flex gap-2 mb-5 bg-white p-2 rounded-2xl shadow">
                            {[
                                { id: 'schedule',  label: "📅 Leo's Schedule", count: null    },
                                { id: 'dump',      label: '🎤 Mental Dump',    count: null    },
                                { id: 'organized', label: '🧠 Organized',      count: pending },
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`flex-1 py-3 px-2 rounded-xl font-medium text-sm transition-all ${
                                        activeTab === tab.id
                                            ? 'bg-indigo-600 text-white shadow'
                                            : 'text-gray-600 hover:bg-gray-100'
                                    }`}>
                                    {tab.label}
                                    {tab.count > 0 && (
                                        <span className="ml-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">
                                            {tab.count}
                                        </span>
                                    )}
                                </button>
                            ))}
                        </div>

                        {/* ══════════════════════════════════════════════
                            TAB 1 — LEO'S SCHEDULE
                            Image upload → 3-call Claude API → assignments
                            Manual toggle override (from v5)
                        ══════════════════════════════════════════════ */}
                        {activeTab === 'schedule' && (
                            <div className="space-y-4">

                                {/* Upload + analyze panel */}
                                <div className="bg-white rounded-2xl shadow p-6">
                                    <h2 className="text-lg font-bold text-indigo-900 mb-1">📸 Upload This Week's Calendars</h2>
                                    <p className="text-sm text-gray-500 mb-4">
                                        Screenshot each parent's calendar, upload both, then tap Analyze.
                                        Claude reads both images and assigns drop-off, pick-up, and nap duty automatically.
                                    </p>

                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        {[1, 2].map(n => {
                                            const img  = n === 1 ? parent1Image : parent2Image;
                                            const name = n === 1 ? parent1Name  : parent2Name;
                                            return (
                                                <div key={n} className="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center hover:border-indigo-400 transition-colors">
                                                    <p className="font-semibold text-gray-700 mb-3">{name}'s Calendar</p>
                                                    <input type="file" accept="image/*"
                                                        onChange={e => handleImageUpload(n, e)}
                                                        className="hidden" id={`upload-${n}`} />
                                                    <label htmlFor={`upload-${n}`} className="cursor-pointer block">
                                                        {img ? (
                                                            <>
                                                                <img src={img} alt={`${name} calendar`}
                                                                    className="w-full h-36 object-cover rounded-lg mb-2" />
                                                                <p className="text-green-600 text-sm font-medium">✓ Uploaded — tap to replace</p>
                                                            </>
                                                        ) : (
                                                            <div className="py-8">
                                                                <div className="text-4xl mb-2">📷</div>
                                                                <p className="text-indigo-600 text-sm font-medium">Tap to upload screenshot</p>
                                                            </div>
                                                        )}
                                                    </label>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <button onClick={analyzeSchedules}
                                        disabled={!parent1Image || !parent2Image || !!analyzing}
                                        className="w-full py-4 rounded-xl font-semibold text-white transition-all bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                                        {analyzing === 'reading'   ? '🔍 Reading calendars…'  :
                                         analyzing === 'assigning' ? '🧠 Assigning duties…'   :
                                         '✨ Analyze & Assign Duties'}
                                    </button>

                                    {analyzeError && (
                                        <p className="mt-3 text-sm text-red-600 text-center">{analyzeError}</p>
                                    )}

                                    <div className="mt-3 p-3 bg-blue-50 rounded-xl text-xs text-gray-600 text-center">
                                        Drop-off {DROPOFF_WINDOW.start}–{DROPOFF_WINDOW.end} &nbsp;·&nbsp;
                                        Pick-up {PICKUP_WINDOW.start}–{PICKUP_WINDOW.end} &nbsp;·&nbsp;
                                        Nap {NAP_WINDOW.start}–{NAP_WINDOW.end}
                                    </div>
                                </div>

                                {/* Week results */}
                                {weekData && (
                                    <>
                                        <button onClick={exportToClipboard}
                                            className="w-full py-3 bg-green-600 text-white rounded-xl font-medium hover:bg-green-700">
                                            📋 Copy Week to Clipboard
                                        </button>
                                        <p className="text-xs text-center text-gray-400">
                                            Tap any card to cycle: {parent1Name} → {parent2Name} → DISCUSS
                                        </p>

                                        {weekData.days.map((day, i) => (
                                            <div key={i} className={`bg-white rounded-2xl shadow-sm border-2 ${
                                                day.hidden ? 'opacity-50 border-gray-100' : 'border-transparent'
                                            }`}>
                                                {/* Day header */}
                                                <div className="p-4 border-b flex justify-between items-center">
                                                    <div className="flex items-center gap-3">
                                                        <button onClick={() => toggleDayVisibility(i)} className="text-xl">
                                                            {day.hidden ? '👁️‍🗨️' : '👁️'}
                                                        </button>
                                                        <div>
                                                            <h3 className="font-bold text-gray-800">{day.day}</h3>
                                                            <p className="text-xs text-gray-400">{day.date}</p>
                                                        </div>
                                                        {(day.dropoff.conflict || day.pickup.conflict || day.nap.conflict) && (
                                                            <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-medium">⚠️ Conflicts</span>
                                                        )}
                                                    </div>
                                                    <button onClick={() => setExpandedDay(expandedDay === i ? null : i)}
                                                        className="text-indigo-600 text-sm px-3 py-1 hover:bg-indigo-50 rounded-lg">
                                                        {expandedDay === i ? '▼ Hide' : '▶ Meetings'}
                                                    </button>
                                                </div>

                                                {!day.hidden && (
                                                    <>
                                                        {/* Notes */}
                                                        <div className="px-4 pt-3">
                                                            <input type="text"
                                                                placeholder="Notes for this day…"
                                                                value={day.notes}
                                                                onChange={e => updateNotes(i, e.target.value)}
                                                                className="w-full px-3 py-2 border rounded-xl text-sm" />
                                                        </div>

                                                        {/* Duty cards */}
                                                        <div className="p-4 grid grid-cols-3 gap-3">
                                                            {['dropoff', 'pickup', 'nap'].map(type => (
                                                                <div key={type}
                                                                    onClick={() => toggleAssignment(i, type)}
                                                                    className="cursor-pointer p-3 rounded-xl border-2 hover:shadow-md transition-all"
                                                                    style={{
                                                                        borderColor:     day[type].assigned === 'DISCUSS' ? '#ef4444' : '#10b981',
                                                                        backgroundColor: day[type].assigned === 'DISCUSS' ? '#fef2f2' : '#f9fafb',
                                                                    }}>
                                                                    <div className="text-xs text-gray-500 mb-1">
                                                                        {type === 'dropoff' ? '🚗 Drop-off' :
                                                                         type === 'pickup'  ? '🏠 Pick-up'  : '😴 Nap'}
                                                                    </div>
                                                                    <p className="font-bold text-sm leading-tight"
                                                                        style={{ color: day[type].assigned === 'DISCUSS' ? '#dc2626' : '#111827' }}>
                                                                        {day[type].assigned}
                                                                    </p>
                                                                    <p className="text-xs text-gray-400 mt-1 leading-tight">{day[type].reason}</p>
                                                                </div>
                                                            ))}
                                                        </div>

                                                        {/* Expanded meetings */}
                                                        {expandedDay === i && (
                                                            <div className="px-4 pb-4 pt-3 bg-gray-50 border-t rounded-b-2xl">
                                                                <div className="grid grid-cols-2 gap-4">
                                                                    <div>
                                                                        <h5 className="font-bold text-indigo-700 text-sm mb-2">{parent1Name}</h5>
                                                                        {(day.fernando_meetings || []).length === 0
                                                                            ? <p className="text-xs text-gray-400">No meetings</p>
                                                                            : (day.fernando_meetings || []).map((m, j) => (
                                                                                <div key={j} className="text-xs bg-white border rounded-lg p-2 mb-1">
                                                                                    <span className="font-medium text-indigo-600">{m.time}:</span> {m.title}
                                                                                </div>
                                                                            ))
                                                                        }
                                                                    </div>
                                                                    <div>
                                                                        <h5 className="font-bold text-pink-600 text-sm mb-2">{parent2Name}</h5>
                                                                        {(day.yenny_meetings || []).length === 0
                                                                            ? <p className="text-xs text-gray-400">No meetings</p>
                                                                            : (day.yenny_meetings || []).map((m, j) => (
                                                                                <div key={j} className="text-xs bg-white border rounded-lg p-2 mb-1">
                                                                                    <span className="font-medium text-pink-500">{m.time}:</span> {m.title}
                                                                                </div>
                                                                            ))
                                                                        }
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                    </>
                                )}

                                {/* Empty state */}
                                {!weekData && !analyzing && (
                                    <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
                                        <div className="text-5xl mb-3">📅</div>
                                        <p className="font-medium text-gray-600">No schedule yet this week</p>
                                        <p className="text-sm mt-1">Upload both calendar screenshots above and tap Analyze</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ══════════════════════════════════════════════
                            TAB 2 — MENTAL DUMP
                        ══════════════════════════════════════════════ */}
                        {activeTab === 'dump' && (
                            <div className="space-y-4">

                                {/* Who is capturing */}
                                <div className="bg-white rounded-2xl shadow p-4">
                                    <p className="text-xs text-gray-500 uppercase tracking-wide font-medium mb-2">Capturing as</p>
                                    <div className="flex gap-3">
                                        {[parent1Name, parent2Name].map(name => (
                                            <button key={name} onClick={() => setCaptureParent(name)}
                                                className={`flex-1 py-2.5 rounded-xl font-medium text-sm border-2 transition-all ${
                                                    captureParent === name
                                                        ? 'bg-indigo-600 text-white border-indigo-600'
                                                        : 'text-gray-600 border-gray-200 hover:border-indigo-300'
                                                }`}>
                                                {name}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Voice capture */}
                                <div className="bg-white rounded-2xl shadow p-5">
                                    <h2 className="font-bold text-gray-800 mb-3">🎤 Voice Memo</h2>
                                    <button onClick={isRecording ? stopVoice : startVoice}
                                        className={`w-full py-5 rounded-xl font-semibold text-lg transition-all ${
                                            isRecording
                                                ? 'bg-red-500 text-white animate-pulse'
                                                : 'bg-indigo-600 text-white hover:bg-indigo-700'
                                        }`}>
                                        {isRecording ? '⏹ Stop Recording' : '🎤 Tap to Speak'}
                                    </button>
                                    {isRecording && (
                                        <p className="text-center text-sm text-red-500 mt-2 animate-pulse">
                                            Listening… speak clearly, then tap Stop
                                        </p>
                                    )}
                                    {dumpError && (
                                        <p className="text-center text-sm text-red-500 mt-2">{dumpError}</p>
                                    )}
                                    <p className="text-xs text-gray-400 text-center mt-2">
                                        Works best in Chrome · Transcribed instantly · No extra API key needed
                                    </p>
                                </div>

                                {/* Text capture */}
                                <div className="bg-white rounded-2xl shadow p-5">
                                    <h2 className="font-bold text-gray-800 mb-3">✍️ Quick Text</h2>
                                    <div className="flex gap-2">
                                        <input type="text" value={textInput}
                                            onChange={e => setTextInput(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && handleTextSubmit()}
                                            placeholder="Type anything on your mind…"
                                            className="flex-1 px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                                        <button onClick={handleTextSubmit} disabled={!textInput.trim()}
                                            className="px-5 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 disabled:opacity-40 text-xl font-bold">
                                            +
                                        </button>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-2">
                                        Auto-categorized · Synced to Google Sheets · Press Enter or tap +
                                    </p>
                                </div>

                                {/* Recent feed */}
                                {captures.length > 0 && (
                                    <div className="bg-white rounded-2xl shadow p-5">
                                        <h2 className="font-bold text-gray-800 mb-3">
                                            Recent <span className="text-gray-400 font-normal text-sm">({pending} pending)</span>
                                        </h2>
                                        <div className="space-y-2">
                                            {captures.slice(0, 8).map(cap => {
                                                const cat = CATEGORIES.find(c => c.id === cap.category);
                                                return (
                                                    <div key={cap.id}
                                                        className={`flex items-start gap-3 p-3 rounded-xl border ${
                                                            cap.completed ? 'opacity-40 bg-gray-50' : 'bg-white'
                                                        }`}>
                                                        <button onClick={() => toggleDone(cap.id)} className="mt-0.5 flex-shrink-0">
                                                            <div className={`w-5 h-5 rounded border-2 flex items-center justify-center text-xs font-bold ${
                                                                cap.completed
                                                                    ? 'bg-green-500 border-green-500 text-white'
                                                                    : 'border-gray-300 hover:border-green-400'
                                                            }`}>{cap.completed ? '✓' : ''}</div>
                                                        </button>
                                                        <div className="flex-1 min-w-0">
                                                            <p className={`text-sm text-gray-800 ${cap.completed ? 'line-through' : ''}`}>
                                                                {cap.content}
                                                            </p>
                                                            <div className="flex flex-wrap gap-1.5 mt-1.5">
                                                                <span className="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full">
                                                                    {cat?.icon} {cat?.name}
                                                                </span>
                                                                <span className={`text-xs px-2 py-0.5 rounded-full ${
                                                                    cap.parent === parent1Name
                                                                        ? 'bg-blue-50 text-blue-700'
                                                                        : 'bg-pink-50 text-pink-700'
                                                                }`}>{cap.parent}</span>
                                                                <span className="text-xs text-gray-400">
                                                                    {cap.type === 'voice' ? '🎤' : '⌨️'} {new Date(cap.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                                                                </span>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => deleteCapture(cap.id)}
                                                            className="text-gray-300 hover:text-red-400 text-xl flex-shrink-0 leading-none">×</button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        {captures.length > 8 && (
                                            <p className="text-xs text-center text-gray-400 mt-3">
                                                +{captures.length - 8} more in 🧠 Organized tab
                                            </p>
                                        )}
                                    </div>
                                )}

                                {captures.length === 0 && (
                                    <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
                                        <div className="text-5xl mb-3">💭</div>
                                        <p className="font-medium text-gray-600">Nothing captured yet</p>
                                        <p className="text-sm mt-1">Tap the mic or type something above</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ══════════════════════════════════════════════
                            TAB 3 — ORGANIZED
                        ══════════════════════════════════════════════ */}
                        {activeTab === 'organized' && (
                            <div className="space-y-3">

                                {/* Urgent banner */}
                                {urgentItems.length > 0 && (
                                    <div className="bg-red-50 border-l-4 border-red-500 rounded-2xl p-4">
                                        <h3 className="font-bold text-red-800 mb-2">⚡ Urgent — Action Needed</h3>
                                        {urgentItems.map(cap => {
                                            const cat = CATEGORIES.find(c => c.id === cap.category);
                                            return (
                                                <div key={cap.id} className="flex items-center gap-2 text-sm text-red-700 mb-1">
                                                    <span>{cat?.icon}</span>
                                                    <span className="flex-1">{cap.content}</span>
                                                    <span className={`text-xs px-2 py-0.5 rounded-full ${
                                                        cap.parent === parent1Name ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'
                                                    }`}>{cap.parent}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Summary row */}
                                <div className="grid grid-cols-3 gap-3">
                                    {[
                                        { label: 'Pending',    value: pending,                                                            cls: 'text-indigo-700' },
                                        { label: 'Done',       value: captures.filter(c => c.completed).length,                           cls: 'text-green-600'  },
                                        { label: 'Categories', value: new Set(captures.filter(c => !c.completed).map(c => c.category)).size, cls: 'text-amber-600'  },
                                    ].map(s => (
                                        <div key={s.label} className="bg-white rounded-2xl p-3 text-center shadow">
                                            <div className={`text-2xl font-bold ${s.cls}`}>{s.value}</div>
                                            <div className="text-xs text-gray-500">{s.label}</div>
                                        </div>
                                    ))}
                                </div>

                                {/* Category groups */}
                                {CATEGORIES.map(cat => {
                                    const items = byCategory(cat.id);
                                    if (!items.length) return null;
                                    const open = !!expandedCats[cat.id];
                                    return (
                                        <div key={cat.id} className="bg-white rounded-2xl shadow overflow-hidden">
                                            <button
                                                onClick={() => setExpandedCats(p => ({ ...p, [cat.id]: !p[cat.id] }))}
                                                className="w-full px-4 py-3 flex items-center justify-between hover:bg-gray-50">
                                                <div className="flex items-center gap-3">
                                                    <span className="text-2xl">{cat.icon}</span>
                                                    <span className="font-semibold text-gray-800">{cat.name}</span>
                                                    <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
                                                        cat.urgent ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'
                                                    }`}>{items.length}</span>
                                                </div>
                                                <span className="text-gray-400 text-sm">{open ? '▼' : '▶'}</span>
                                            </button>

                                            {open && (
                                                <div className="px-4 pb-4 space-y-2 border-t pt-3">
                                                    {items.map(cap => (
                                                        <div key={cap.id} className="flex items-start gap-3 p-3 bg-gray-50 rounded-xl">
                                                            <button onClick={() => toggleDone(cap.id)} className="mt-0.5 flex-shrink-0">
                                                                <div className="w-5 h-5 rounded border-2 border-gray-300 hover:border-green-400 transition-colors" />
                                                            </button>
                                                            <div className="flex-1">
                                                                <p className="text-sm text-gray-800">{cap.content}</p>
                                                                <div className="flex gap-1.5 mt-1.5">
                                                                    <span className={`text-xs px-2 py-0.5 rounded-full ${
                                                                        cap.parent === parent1Name
                                                                            ? 'bg-blue-50 text-blue-700'
                                                                            : 'bg-pink-50 text-pink-700'
                                                                    }`}>{cap.parent}</span>
                                                                    <span className="text-xs text-gray-400">
                                                                        {cap.type === 'voice' ? '🎤' : '⌨️'} {new Date(cap.timestamp).toLocaleDateString()}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                            <button onClick={() => deleteCapture(cap.id)}
                                                                className="text-gray-300 hover:text-red-400 text-xl leading-none">×</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}

                                {!pending && (
                                    <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
                                        <div className="text-5xl mb-3">🧠</div>
                                        <p className="font-medium text-gray-600">All clear!</p>
                                        <p className="text-sm mt-1">No pending items. Add thoughts in the Mental Dump tab.</p>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.render(<FamilyCoordinator />, document.getElementById('root'));
    </script>

    ════════════════════════════════════════════════════════════════════
    GOOGLE APPS SCRIPT UPDATE GUIDE
    Replace your existing script with the code below.
    Same deployment URL — no changes needed in this HTML file.
    Just add a new version in Manage Deployments.
    ════════════════════════════════════════════════════════════════════

    function doGet() {
      var ss       = SpreadsheetApp.getActiveSpreadsheet();
      var sched    = ss.getSheetByName('Schedule')   || ss.insertSheet('Schedule');
      var dump     = ss.getSheetByName('MentalDump') || ss.insertSheet('MentalDump');

      var weekData = null;
      var captures = [];
      var meta     = {};

      try { weekData = JSON.parse(sched.getRange('A1').getValue()); } catch(e) {}
      try { captures = JSON.parse(dump.getRange('A1').getValue());  } catch(e) {}
      try { meta     = JSON.parse(sched.getRange('B1').getValue()); } catch(e) {}

      return ContentService
        .createTextOutput(JSON.stringify({
          weekData:    weekData,
          captures:    captures,
          parent1Name: meta.parent1Name || 'Fernando',
          parent2Name: meta.parent2Name || 'Yenny',
          currentWeek: meta.currentWeek || ''
        }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    function doPost(e) {
      var ss   = SpreadsheetApp.getActiveSpreadsheet();
      var body = JSON.parse(e.postData.contents);

      if (body.weekData !== undefined) {
        var sched = ss.getSheetByName('Schedule') || ss.insertSheet('Schedule');
        sched.getRange('A1').setValue(JSON.stringify(body.weekData));
        sched.getRange('B1').setValue(JSON.stringify({
          parent1Name: body.parent1Name,
          parent2Name: body.parent2Name,
          currentWeek: body.currentWeek
        }));
      }

      if (body.captures !== undefined) {
        var dump = ss.getSheetByName('MentalDump') || ss.insertSheet('MentalDump');
        dump.getRange('A1').setValue(JSON.stringify(body.captures));
      }

      return ContentService
        .createTextOutput(JSON.stringify({ ok: true }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    4. Click Deploy → Manage Deployments
    5. Click the pencil icon on your existing deployment
    6. Change version to "New version" → click Deploy
    7. In your Google Sheet, add a tab named exactly: MentalDump
    8. Done — the URL stays the same, no changes needed here
    ════════════════════════════════════════════════════════════════════
