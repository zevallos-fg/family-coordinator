<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Coordinator v8.4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzgoNn0WDXRCAyRXlXEDcjzVEM6r7AQ4k3htOKo8s1aKZ86xYP7rN0DVJVvgr3W7WD/exec";
        const WORKER_URL = "https://aged-dust-551a.zevallos-fg.workers.dev";
        const SYNC_INTERVAL = 5000;

        const DROPOFF_WINDOW = { start: "9:00 AM",  end: "9:30 AM"  };
        const PICKUP_WINDOW  = { start: "12:30 PM", end: "1:00 PM"  };
        const NAP_WINDOW     = { start: "1:30 PM",  end: "2:00 PM"  };

        const DEFAULT_CATEGORIES = [
            { id: 'health',    name: 'Health & Appointments', icon: '🏥', urgent: true  },
            { id: 'school',    name: 'School & Activities',   icon: '🎒', urgent: true  },
            { id: 'home',      name: 'Home Maintenance',      icon: '🔧', urgent: false },
            { id: 'financial', name: 'Financial',             icon: '💰', urgent: false },
            { id: 'social',    name: 'Social / Family',       icon: '👨‍👩‍👧', urgent: false },
            { id: 'travel',    name: 'Travel & Events',       icon: '✈️',  urgent: false },
            { id: 'parenting', name: 'Parenting / Private',   icon: '🔒', urgent: false },
            { id: 'projects',  name: 'Projects',              icon: '📋', urgent: false },
            { id: 'ideas',     name: 'Ideas / Someday',       icon: '💡', urgent: false },
            { id: 'hurricane', name: 'Hurricane Prep',        icon: '🌀', urgent: false },
        ];

        const DEFAULT_STORES = ['Publix', 'Whole Foods', 'Costco', 'Target'];

        function guessCategory(text) {
            const t = text.toLowerCase();
            if (/doctor|dentist|appointment|sick|medicine|pharmacy|pediatr|vaccine|fever|health/.test(t)) return 'health';
            if (/school|teacher|homework|leo|pickup|dropoff|daycare|class|activity|sport/.test(t))        return 'school';
            if (/fix|repair|plumber|ac|roof|paint|clean|leak|handyman|maintenance/.test(t))               return 'home';
            if (/pay|bill|insurance|tax|budget|bank|money|credit|expense|invoice/.test(t))                return 'financial';
            if (/birthday|party|dinner|friend|family|visit|invite|event|celebration/.test(t))             return 'social';
            if (/trip|flight|hotel|vacation|travel|pack|passport|book/.test(t))                           return 'travel';
            if (/private|personal|parenting|discipline|behavior|routine/.test(t))                         return 'parenting';
            if (/project|build|create|design|develop|launch|plan/.test(t))                                return 'projects';
            if (/hurricane|storm|prep|supplies|generator|shutter/.test(t))                                return 'hurricane';
            return 'ideas';
        }

        // ============================================================
        // CLAUDE API — parse capture for grocery routing
        // Returns: { isGrocery: bool, items: [string] }
        // items is always an array — could be 1 or many
        // ============================================================
        async function parseGroceryIntent(text) {
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 300,
                        messages: [{
                            role: 'user',
                            content: 'Analyze this voice/text capture from a parent: "' + text + '"\n\nIs this a grocery/shopping request? If yes, extract individual item names.\n\nReturn ONLY valid JSON:\n{"isGrocery": true, "items": ["oregano", "chili powder"]}\nor\n{"isGrocery": false, "items": []}'
                        }]
                    })
                });
                const data = await res.json();
                const raw = data.content[0].text.replace(/```json|```/g, '').trim();
                return JSON.parse(raw);
            } catch (err) {
                console.error('Grocery parse error:', err);
                return { isGrocery: false, items: [] };
            }
        }

        async function parseItemsFromText(text) {
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 300,
                        messages: [{
                            role: 'user',
                            content: 'Extract individual grocery item names from this text: "' + text + '"\n\nReturn ONLY valid JSON:\n{"items": ["item 1", "item 2"]}'
                        }]
                    })
                });
                const data = await res.json();
                const raw = data.content[0].text.replace(/```json|```/g, '').trim();
                const parsed = JSON.parse(raw);
                return parsed.items?.length ? parsed.items : [text];
            } catch {
                return [text];
            }
        }

        // ============================================================
        // MAIN APP
        // ============================================================
        function FamilyCoordinator() {

            // ── Shared ────────────────────────────────────────────
            const [activeTab,    setActiveTab]    = useState('schedule');
            const [parent1Name,  setParent1Name]  = useState('Fernando');
            const [parent2Name,  setParent2Name]  = useState('Yenny');
            const [currentWeek,  setCurrentWeek]  = useState('');
            const [syncStatus,   setSyncStatus]   = useState('ready');
            const [lastSyncTime, setLastSyncTime] = useState(null);
            const [categories,   setCategories]   = useState(DEFAULT_CATEGORIES);

            // ── Schedule ──────────────────────────────────────────
            const [parent1Image, setParent1Image] = useState(null);
            const [parent2Image, setParent2Image] = useState(null);
            const [analyzing,    setAnalyzing]    = useState(null);
            const [analyzeError, setAnalyzeError] = useState('');
            const [weekData,     setWeekData]     = useState(null);
            const [expandedDay,  setExpandedDay]  = useState(null);

            // ── Mental Dump ───────────────────────────────────────
            const [captures,      setCaptures]      = useState([]);
            const [textInput,     setTextInput]     = useState('');
            const [captureParent, setCaptureParent] = useState('Fernando');
            const [isRecording,   setIsRecording]   = useState(false);
            const [dumpError,     setDumpError]     = useState('');
            const [parsing,       setParsing]       = useState(false); // Claude parsing indicator
            const recognitionRef = useRef(null);

            // ── Organized ─────────────────────────────────────────
            const [expandedCats, setExpandedCats] = useState({});
            const [editingId,    setEditingId]    = useState(null);
            const [editingText,  setEditingText]  = useState('');
            const [newCatName,   setNewCatName]   = useState('');
            const [showNewCat,   setShowNewCat]   = useState(false);
            const [movingId,     setMovingId]     = useState(null); // loading state for 🛒 button

            // ── Grocery ───────────────────────────────────────────
            const [groceries,    setGroceries]    = useState([]);
            const [groceryInput, setGroceryInput] = useState('');
            const [stores,       setStores]       = useState(DEFAULT_STORES);
            const [showNewStore, setShowNewStore] = useState(false);
            const [newStoreName, setNewStoreName] = useState('');

            // ============================================================
            // SYNC — now includes stores
            // ============================================================
            const syncWithGoogle = async (saveWeek, saveDump, saveGroceries, saveCategories, saveStores) => {
                if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'PASTE_YOUR_URL_HERE') {
                    setSyncStatus('setup_needed');
                    return;
                }
                try {
                    setSyncStatus('syncing');
                    const isWrite = [saveWeek, saveDump, saveGroceries, saveCategories, saveStores].some(v => v !== undefined);
                    if (isWrite) {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({
                                weekData:   saveWeek       !== undefined ? saveWeek       : weekData,
                                captures:   saveDump       !== undefined ? saveDump       : captures,
                                groceries:  saveGroceries  !== undefined ? saveGroceries  : groceries,
                                categories: saveCategories !== undefined ? saveCategories : categories,
                                stores:     saveStores     !== undefined ? saveStores     : stores,
                                parent1Name, parent2Name, currentWeek,
                            })
                        });
                    } else {
                        const res  = await fetch(GOOGLE_SCRIPT_URL);
                        const data = await res.json();
                        if (data?.weekData)    setWeekData(data.weekData);
                        if (data?.captures)    setCaptures(data.captures);
                        if (data?.groceries)   setGroceries(data.groceries);
                        if (data?.categories)  setCategories(data.categories);
                        if (data?.stores)      setStores(data.stores);
                        if (data?.parent1Name) setParent1Name(data.parent1Name);
                        if (data?.parent2Name) setParent2Name(data.parent2Name);
                        if (data?.currentWeek) setCurrentWeek(data.currentWeek);
                    }
                    setSyncStatus('synced');
                    setLastSyncTime(new Date());
                } catch {
                    setSyncStatus('error');
                }
            };

            useEffect(() => {
                syncWithGoogle();
                const interval = setInterval(() => syncWithGoogle(), SYNC_INTERVAL);
                return () => clearInterval(interval);
            }, []);

            // ============================================================
            // BUILD grocery items array from parsed item names
            // ============================================================
            const buildGroceryItems = (itemNames, addedBy) =>
                itemNames.map((name, i) => ({
                    id:        Date.now() + i,
                    name:      name.charAt(0).toUpperCase() + name.slice(1), // capitalize
                    store:     '',       // blank by default
                    completed: false,
                    addedBy,
                    timestamp: new Date().toISOString(),
                }));

            // ============================================================
            // SCHEDULE (unchanged from v7)
            // ============================================================
            const handleImageUpload = (parent, e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => { parent === 1 ? setParent1Image(reader.result) : setParent2Image(reader.result); };
                reader.readAsDataURL(file);
            };

            // All Claude calls go through Cloudflare Worker to avoid CORS
            const callClaude = async (payload) => {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errBody = await res.text();
                    throw new Error(`Worker HTTP ${res.status}: ${errBody}`);
                }
                const data = await res.json();
                if (data.error) throw new Error(`API error: ${data.error.message}`);
                if (!data.content?.[0]?.text) throw new Error(`Unexpected response: ${JSON.stringify(data)}`);
                return data.content[0].text;
            };

            const analyzeSchedules = async () => {
                if (!parent1Image || !parent2Image) { setAnalyzeError('Please upload both calendar screenshots first.'); return; }
                setAnalyzeError(''); setAnalyzing('reading');
                try {
                    // Detect image type from data URL
                    const getMediaType = (dataUrl) => {
                        const mime = dataUrl.split(';')[0].split(':')[1];
                        return ['image/jpeg','image/png','image/gif','image/webp'].includes(mime) ? mime : 'image/jpeg';
                    };

                    const schedule1 = await callClaude({ model: 'claude-sonnet-4-20250514', max_tokens: 1000,
                        messages: [{ role: 'user', content: [
                            { type: 'image', source: { type: 'base64', media_type: getMediaType(parent1Image), data: parent1Image.split(',')[1] } },
                            { type: 'text', text: `This is ${parent1Name}'s work calendar for the week. Extract ALL meetings shown for every weekday.\nRules:\n- Include every meeting regardless of color EXCEPT items highlighted in RED - ignore red items completely\n- Include blue, teal, green, purple, gray, white, and all other non-red colored items\n- Use 12-hour time format with 30-minute precision - read gridlines carefully, meetings can start at :00 or :30\n- Do NOT round to the nearest hour - if a meeting starts between two hour lines it is a :30 start\n- If a day has no meetings write: No meetings\nFormat strictly as:\nMonday (3/2): [time] Title, [time] Title\nTuesday (3/3): 9:30 AM Title\nWednesday (3/4): No meetings` }
                        ]}]
                    });

                    const schedule2 = await callClaude({ model: 'claude-sonnet-4-20250514', max_tokens: 1000,
                        messages: [{ role: 'user', content: [
                            { type: 'image', source: { type: 'base64', media_type: getMediaType(parent2Image), data: parent2Image.split(',')[1] } },
                            { type: 'text', text: `This is ${parent2Name}'s work calendar for the week. Extract ALL meetings shown for every weekday.\nRules:\n- Include every meeting regardless of color EXCEPT items highlighted in RED - ignore red items completely\n- Include blue, teal, green, purple, gray, white, and all other non-red colored items\n- Use 12-hour time format with 30-minute precision - read gridlines carefully, meetings can start at :00 or :30\n- Do NOT round to the nearest hour - if a meeting starts between two hour lines it is a :30 start\n- If a day has no meetings write: No meetings\nFormat strictly as:\nMonday (3/2): [time] Title, [time] Title\nTuesday (3/3): 9:30 AM Title\nWednesday (3/4): No meetings` }
                        ]}]
                    });

                    setAnalyzing('assigning');
                    const raw = await callClaude({ model: 'claude-sonnet-4-20250514', max_tokens: 2000,
                        messages: [{ role: 'user', content:
                            `Assign Leo's daycare duties.\n\n${parent1Name}: ${schedule1}\n\n${parent2Name}: ${schedule2}\n\nWindows:\n- Drop-off: ${DROPOFF_WINDOW.start}–${DROPOFF_WINDOW.end}\n- Pick-up: ${PICKUP_WINDOW.start}–${PICKUP_WINDOW.end}\n- Nap: ${NAP_WINDOW.start}–${NAP_WINDOW.end}\n\nRules: overlap = cannot do duty. Both free = alternate (${parent1Name} first). Neither free = DISCUSS. Nap = prefer parent who didn't do pickup.\n\nReturn ONLY valid JSON:\n{"week":"Jan 26–30","days":[{"day":"Monday","date":"1/26","hidden":false,"notes":"","fernando_meetings":[{"time":"9:00 AM","title":"Meeting"}],"yenny_meetings":[{"time":"1:00 PM","title":"Meeting"}],"dropoff":{"assigned":"${parent1Name}","conflict":false,"reason":"reason"},"pickup":{"assigned":"${parent2Name}","conflict":false,"reason":"reason"},"nap":{"assigned":"${parent1Name}","conflict":false,"reason":"reason"}}]}`
                        }]
                    });
                    const match = raw.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);
                    if (!match) throw new Error(`Could not find JSON in response. Got: ${raw.substring(0,200)}`);
                    const parsed = JSON.parse(match[0]);
                    const normalized = { ...parsed, days: parsed.days.map(d => ({
                        hidden:false,notes:'',fernando_meetings:[],yenny_meetings:[],...d,
                        dropoff:{conflict:false,reason:'',...d.dropoff},
                        pickup: {conflict:false,reason:'',...d.pickup},
                        nap:    {conflict:false,reason:'',...d.nap},
                    }))};
                    if (normalized.week) setCurrentWeek(normalized.week);
                    setWeekData(normalized);
                    syncWithGoogle(normalized, undefined, undefined, undefined, undefined);
                } catch(err) {
                    console.error('Schedule analysis error:', err);
                    // Surface the real error so it's debuggable
                    let msg = 'Analysis failed.';
                    if (err?.message) msg += ` Detail: ${err.message}`;
                    // If it's an API response error, try to show it
                    if (err?.status) msg += ` (HTTP ${err.status})`;
                    setAnalyzeError(msg);
                } finally { setAnalyzing(null); }
            };

            const saveSchedule = (nd) => { setWeekData(nd); syncWithGoogle(nd, undefined, undefined, undefined, undefined); };
            const toggleAssignment = (di, type) => {
                const nd = { ...weekData, days: weekData.days.map((d,i) => {
                    if (i!==di) return d;
                    const cur = d[type].assigned;
                    return {...d,[type]:{...d[type],assigned:cur===parent1Name?parent2Name:cur===parent2Name?'DISCUSS':parent1Name}};
                })};
                saveSchedule(nd);
            };
            const toggleDayVisibility = (di) => saveSchedule({...weekData,days:weekData.days.map((d,i)=>i===di?{...d,hidden:!d.hidden}:d)});
            const updateNotes = (di, notes) => saveSchedule({...weekData,days:weekData.days.map((d,i)=>i===di?{...d,notes}:d)});
            const exportToClipboard = () => {
                let t = `📅 LEO'S SCHEDULE — ${currentWeek}\n\n`;
                (weekData?.days||[]).filter(d=>!d.hidden).forEach(d=>{
                    t+=`${d.day} ${d.date}:\n  🚗 Drop-off: ${d.dropoff.assigned}\n  🏠 Pick-up: ${d.pickup.assigned}\n  😴 Nap: ${d.nap.assigned}\n`;
                    if(d.notes) t+=`  📝 ${d.notes}\n`;
                    t+='\n';
                });
                navigator.clipboard.writeText(t).then(()=>alert('📋 Copied!'));
            };

            // ============================================================
            // MENTAL DUMP — Claude parses every capture for grocery intent
            // ============================================================
            const saveCapture = async (content, type) => {
                setParsing(true);
                try {
                    const result = await parseGroceryIntent(content);

                    if (result.isGrocery && result.items.length > 0) {
                        // Route to grocery tab as individual items
                        const newItems = buildGroceryItems(result.items, captureParent);
                        const updatedGroceries = [...newItems, ...groceries];
                        setGroceries(updatedGroceries);
                        syncWithGoogle(undefined, undefined, updatedGroceries, undefined, undefined);
                    } else {
                        // Route to organized tab as a single capture
                        const newCapture = {
                            id: Date.now(), content,
                            category: guessCategory(content),
                            type, parent: captureParent,
                            timestamp: new Date().toISOString(),
                            completed: false,
                        };
                        const updated = [newCapture, ...captures];
                        setCaptures(updated);
                        syncWithGoogle(undefined, updated, undefined, undefined, undefined);
                    }
                } finally {
                    setParsing(false);
                    setDumpError('');
                }
            };

            const handleTextSubmit = () => { if(!textInput.trim()) return; saveCapture(textInput.trim(),'text'); setTextInput(''); };

            const startVoice = () => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setDumpError('Voice not supported. Use Chrome.'); return; }
                const rec = new SR();
                rec.lang = 'en-US'; rec.interimResults = false;
                rec.onstart  = () => { setIsRecording(true); setDumpError(''); };
                rec.onend    = () => setIsRecording(false);
                rec.onerror  = (e) => { setIsRecording(false); setDumpError(e.error==='not-allowed'?'Mic blocked. Check permissions.':`Error: ${e.error}`); };
                rec.onresult = (e) => saveCapture(e.results[0][0].transcript, 'voice');
                recognitionRef.current = rec;
                rec.start();
            };
            const stopVoice = () => { recognitionRef.current?.stop(); setIsRecording(false); };

            // ============================================================
            // CAPTURES — edit, recategorize, delete
            // ============================================================
            const toggleDone = (id) => {
                const updated = captures.map(c=>c.id===id?{...c,completed:!c.completed}:c);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined,undefined);
            };
            const deleteCapture = (id) => {
                const updated = captures.filter(c=>c.id!==id);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined,undefined);
            };
            const startEdit = (cap) => { setEditingId(cap.id); setEditingText(cap.content); };
            const saveEdit = (id) => {
                const updated = captures.map(c=>c.id===id?{...c,content:editingText}:c);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined,undefined);
                setEditingId(null); setEditingText('');
            };
            const changeCategory = (id, catId) => {
                const updated = captures.map(c=>c.id===id?{...c,category:catId}:c);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined,undefined);
            };

            // Move to grocery — Claude parses and splits the item text
            const moveToGrocery = async (cap) => {
                setMovingId(cap.id);
                try {
                    const itemNames = await parseItemsFromText(cap.content);
                    const newItems = buildGroceryItems(itemNames, cap.parent);
                    const updatedGroceries = [...newItems, ...groceries];
                    const updatedCaptures  = captures.filter(c=>c.id!==cap.id);
                    setGroceries(updatedGroceries);
                    setCaptures(updatedCaptures);
                    syncWithGoogle(undefined, updatedCaptures, updatedGroceries, undefined, undefined);
                } finally {
                    setMovingId(null);
                }
            };

            // ============================================================
            // CUSTOM CATEGORIES
            // ============================================================
            const addCustomCategory = () => {
                if (!newCatName.trim()) return;
                const newCat = { id: `custom_${Date.now()}`, name: newCatName.trim(), icon: '📌', urgent: false };
                const updated = [...categories, newCat];
                setCategories(updated);
                syncWithGoogle(undefined, undefined, undefined, updated, undefined);
                setNewCatName(''); setShowNewCat(false);
            };

            // ============================================================
            // GROCERIES
            // ============================================================
            const addGroceryItem = () => {
                if (!groceryInput.trim()) return;
                const newItem = { id: Date.now(), name: groceryInput.trim(), store: '', completed: false, addedBy: captureParent, timestamp: new Date().toISOString() };
                const updated = [newItem, ...groceries];
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined,undefined);
                setGroceryInput('');
            };
            const toggleGroceryDone = (id) => {
                const updated = groceries.map(g=>g.id===id?{...g,completed:!g.completed}:g);
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined,undefined);
            };
            const deleteGrocery = (id) => {
                const updated = groceries.filter(g=>g.id!==id);
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined,undefined);
            };
            const updateGroceryStore = (id, store) => {
                const updated = groceries.map(g=>g.id===id?{...g,store}:g);
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined,undefined);
            };
            const clearCompleted = () => {
                const updated = groceries.filter(g=>!g.completed);
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined,undefined);
            };

            // ── Custom stores ─────────────────────────────────────
            const addCustomStore = () => {
                if (!newStoreName.trim()) return;
                const updated = [...stores, newStoreName.trim()];
                setStores(updated);
                syncWithGoogle(undefined, undefined, undefined, undefined, updated);
                setNewStoreName(''); setShowNewStore(false);
            };

            // ============================================================
            // DERIVED
            // ============================================================
            const pending        = captures.filter(c=>!c.completed).length;
            const urgentItems    = captures.filter(c=>{ const cat=categories.find(x=>x.id===c.category); return cat?.urgent&&!c.completed; });
            const byCategory     = (id) => captures.filter(c=>c.category===id&&!c.completed);
            const visibleDays    = weekData?.days?.filter(d=>!d.hidden)||[];
            const groceryPending = groceries.filter(g=>!g.completed).length;

            const badge = ({
                syncing:      {icon:'🔄',text:'Syncing…',    cls:'text-blue-500'  },
                synced:       {icon:'✅',text:'Synced',       cls:'text-green-600' },
                error:        {icon:'⚠️',text:'Sync error',   cls:'text-red-500'   },
                setup_needed: {icon:'⚙️',text:'Setup needed', cls:'text-orange-500'},
            })[syncStatus]||{icon:'⏸️',text:'Ready',cls:'text-gray-400'};

            // ============================================================
            // RENDER
            // ============================================================
            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8">
                <div className="max-w-5xl mx-auto">

                {/* ── HEADER ─────────────────────────────── */}
                <div className="bg-white rounded-2xl shadow-xl p-5 mb-5">
                    <div className="flex justify-between items-start">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-900">
                                👨‍👩‍👦 Family Coordinator
                                <span className="text-xs font-normal ml-2 px-2 py-0.5 bg-indigo-100 text-indigo-600 rounded-full">v8.4</span>
                            </h1>
                            {currentWeek && <p className="text-gray-500 text-sm mt-0.5">{currentWeek}</p>}
                            <div className={`flex items-center gap-1.5 mt-1 text-sm ${badge.cls}`}>
                                <span>{badge.icon}</span><span>{badge.text}</span>
                                {lastSyncTime && <span className="text-xs text-gray-400 ml-1">{lastSyncTime.toLocaleTimeString()}</span>}

                                        <button onClick={()=>{setShowNewStore(false);setNewStoreName('');}} className="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-xs">Cancel</button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* List */}
                        {groceries.length>0?(
                            <div className="bg-white rounded-2xl shadow p-5">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-gray-800">
                                        {groceryPending} item{groceryPending!==1?'s':''} to get
                                        {groceries.filter(g=>g.completed).length>0&&(
                                            <span className="text-gray-400 font-normal text-sm ml-2">· {groceries.filter(g=>g.completed).length} in cart</span>
                                        )}
                                    </h3>
                                    {groceries.some(g=>g.completed)&&(
                                        <button onClick={clearCompleted} className="text-xs text-red-400 hover:text-red-600 font-medium">Clear done</button>
                                    )}
                                </div>

                                {/* Column headers */}
                                <div className="grid gap-2">
                                    <div className="grid grid-cols-12 gap-2 px-1 mb-1">
                                        <div className="col-span-1"></div>
                                        <div className="col-span-5 text-xs text-gray-400 font-medium uppercase tracking-wide">Item</div>
                                        <div className="col-span-4 text-xs text-gray-400 font-medium uppercase tracking-wide">Store</div>
                                        <div className="col-span-2 text-xs text-gray-400 font-medium uppercase tracking-wide">By</div>
                                    </div>

                                    {/* Pending items */}
                                    {groceries.filter(g=>!g.completed).map(item=>(
                                        <div key={item.id} className="grid grid-cols-12 gap-2 items-center p-2.5 rounded-xl border bg-white hover:bg-gray-50 transition-colors">
                                            <div className="col-span-1">
                                                <button onClick={()=>toggleGroceryDone(item.id)}>
                                                    <div className="w-6 h-6 rounded-full border-2 border-gray-300 hover:border-green-500 transition-colors"/>
                                                </button>
                                            </div>
                                            <div className="col-span-5">
                                                <span className="text-sm text-gray-800 font-medium">{item.name}</span>
                                            </div>
                                            <div className="col-span-4">
                                                <select
                                                    value={item.store||''}
                                                    onChange={e=>updateGroceryStore(item.id, e.target.value)}
                                                    className="w-full text-xs px-2 py-1 border border-gray-200 rounded-lg bg-white text-gray-600 focus:outline-none focus:ring-1 focus:ring-green-400 cursor-pointer">
                                                    <option value="">— store —</option>
                                                    {stores.map(s=><option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                            <div className="col-span-2 flex items-center justify-between">
                                                <span className={`text-xs px-1.5 py-0.5 rounded-full ${item.addedBy===parent1Name?'bg-blue-50 text-blue-600':'bg-pink-50 text-pink-600'}`}>
                                                    {item.addedBy?.split(' ')[0]}
                                                </span>
                                                <button onClick={()=>deleteGrocery(item.id)} className="text-gray-300 hover:text-red-400 text-lg leading-none">×</button>
                                            </div>
                                        </div>
                                    ))}

                                    {/* In cart */}
                                    {groceries.some(g=>g.completed)&&(<>
                                        <p className="text-xs text-gray-400 font-medium uppercase tracking-wide mt-3 mb-1">In cart</p>
                                        {groceries.filter(g=>g.completed).map(item=>(
                                            <div key={item.id} className="grid grid-cols-12 gap-2 items-center p-2.5 rounded-xl border bg-gray-50 opacity-60">
                                                <div className="col-span-1">
                                                    <button onClick={()=>toggleGroceryDone(item.id)}>
                                                        <div className="w-6 h-6 rounded-full bg-green-500 flex items-center justify-center text-white text-xs font-bold">✓</div>
                                                    </button>
                                                </div>
                                                <div className="col-span-5">
                                                    <span className="text-sm text-gray-400 line-through">{item.name}</span>
                                                </div>
                                                <div className="col-span-4">
                                                    {item.store&&<span className="text-xs text-gray-400">{item.store}</span>}
                                                </div>
                                                <div className="col-span-2 flex justify-end">
                                                    <button onClick={()=>deleteGrocery(item.id)} className="text-gray-300 hover:text-red-400 text-lg leading-none">×</button>
                                                </div>
                                            </div>
                                        ))}
                                    </>)}
                                </div>
                            </div>
                        ):(
                            <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
                                <div className="text-5xl mb-3">🛒</div>
                                <p className="font-medium text-gray-600">List is empty</p>
                                <p className="text-sm mt-1">Add items above, or say "add oregano and chili powder to the list" in Mental Dump</p>
                            </div>
                        )}
                    </div>
                )}

                </div>
                </div>
            );
        }

        ReactDOM.render(<FamilyCoordinator />, document.getElementById('root'));
    </script>

    <!--
    ════════════════════════════════════════════════════════════════════
    GOOGLE APPS SCRIPT — paste this into your project, deploy new version.
    Adds a Stores sheet to the existing Schedule/MentalDump/Groceries/Categories sheets.
    ════════════════════════════════════════════════════════════════════

    function doGet() {
      var ss         = SpreadsheetApp.getActiveSpreadsheet();
      var sched      = ss.getSheetByName('Schedule')   || ss.insertSheet('Schedule');
      var dump       = ss.getSheetByName('MentalDump') || ss.insertSheet('MentalDump');
      var grocSheet  = ss.getSheetByName('Groceries')  || ss.insertSheet('Groceries');
      var catSheet   = ss.getSheetByName('Categories') || ss.insertSheet('Categories');
      var storeSheet = ss.getSheetByName('Stores')     || ss.insertSheet('Stores');

      var weekData   = null;
      var captures   = [];
      var groceries  = [];
      var categories = [];
      var stores     = [];
      var meta       = {};

      try { weekData   = JSON.parse(sched.getRange('A1').getValue());      } catch(e) {}
      try { captures   = JSON.parse(dump.getRange('A1').getValue());       } catch(e) {}
      try { groceries  = JSON.parse(grocSheet.getRange('A1').getValue());  } catch(e) {}
      try { categories = JSON.parse(catSheet.getRange('A1').getValue());   } catch(e) {}
      try { stores     = JSON.parse(storeSheet.getRange('A1').getValue()); } catch(e) {}
      try { meta       = JSON.parse(sched.getRange('B1').getValue());      } catch(e) {}

      return ContentService
        .createTextOutput(JSON.stringify({
          weekData:    weekData,
          captures:    captures,
          groceries:   groceries,
          categories:  categories.length ? categories : null,
          stores:      stores.length ? stores : null,
          parent1Name: meta.parent1Name || 'Fernando',
          parent2Name: meta.parent2Name || 'Yenny',
          currentWeek: meta.currentWeek || ''
        }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    function doPost(e) {
      var ss   = SpreadsheetApp.getActiveSpreadsheet();
      var body = JSON.parse(e.postData.contents);

      if (body.weekData !== undefined) {
        var sched = ss.getSheetByName('Schedule') || ss.insertSheet('Schedule');
        sched.getRange('A1').setValue(JSON.stringify(body.weekData));
        sched.getRange('B1').setValue(JSON.stringify({
          parent1Name: body.parent1Name,
          parent2Name: body.parent2Name,
          currentWeek: body.currentWeek
        }));
      }
      if (body.captures !== undefined) {
        var dump = ss.getSheetByName('MentalDump') || ss.insertSheet('MentalDump');
        dump.getRange('A1').setValue(JSON.stringify(body.captures));
      }
      if (body.groceries !== undefined) {
        var grocSheet = ss.getSheetByName('Groceries') || ss.insertSheet('Groceries');
        grocSheet.getRange('A1').setValue(JSON.stringify(body.groceries));
      }
      if (body.categories !== undefined) {
        var catSheet = ss.getSheetByName('Categories') || ss.insertSheet('Categories');
        catSheet.getRange('A1').setValue(JSON.stringify(body.categories));
      }
      if (body.stores !== undefined) {
        var storeSheet = ss.getSheetByName('Stores') || ss.insertSheet('Stores');
        storeSheet.getRange('A1').setValue(JSON.stringify(body.stores));
      }

      return ContentService
        .createTextOutput(JSON.stringify({ ok: true }))
        .setMimeType(ContentService.MimeType.JSON);
    }
