<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Coordinator v7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzq-qyZLWJDIvAg5FaAJYkyqkEM47Zopi9YvafD77HwdqjIQIYceiNpHHB4KxEog2O/exec";
        const SYNC_INTERVAL = 5000;

        const DROPOFF_WINDOW = { start: "9:00 AM",  end: "9:30 AM"  };
        const PICKUP_WINDOW  = { start: "12:30 PM", end: "1:00 PM"  };
        const NAP_WINDOW     = { start: "1:30 PM",  end: "2:00 PM"  };

        // Default categories — user can add custom ones, stored in state
        const DEFAULT_CATEGORIES = [
            { id: 'health',    name: 'Health & Appointments', icon: '🏥', urgent: true  },
            { id: 'school',    name: 'School & Activities',   icon: '🎒', urgent: true  },
            { id: 'home',      name: 'Home Maintenance',      icon: '🔧', urgent: false },
            { id: 'financial', name: 'Financial',             icon: '💰', urgent: false },
            { id: 'social',    name: 'Social / Family',       icon: '👨‍👩‍👧', urgent: false },
            { id: 'travel',    name: 'Travel & Events',       icon: '✈️',  urgent: false },
            { id: 'parenting', name: 'Parenting / Private',   icon: '🔒', urgent: false },
            { id: 'projects',  name: 'Projects',              icon: '📋', urgent: false },
            { id: 'ideas',     name: 'Ideas / Someday',       icon: '💡', urgent: false },
            { id: 'hurricane', name: 'Hurricane Prep',        icon: '🌀', urgent: false },
        ];

        // Grocery trigger phrases
        const GROCERY_TRIGGERS = /\b(add to grocery|grocery list|we need|we're out|out of|running low|need to buy|pick up|get more)\b/i;

        function isGroceryItem(text) {
            return GROCERY_TRIGGERS.test(text);
        }

        // Extract the actual item name from a grocery-triggered capture
        function extractGroceryItem(text) {
            return text
                .replace(/add to grocery list|grocery list|we need|we're out of|out of|running low on|need to buy|pick up|get more/gi, '')
                .replace(/^\s*[:,-]\s*/, '')
                .trim();
        }

        function guessCategory(text, categories) {
            const t = text.toLowerCase();
            if (/doctor|dentist|appointment|sick|medicine|pharmacy|pediatr|vaccine|fever|health/.test(t)) return 'health';
            if (/school|teacher|homework|leo|pickup|dropoff|daycare|class|activity|sport/.test(t))        return 'school';
            if (/fix|repair|plumber|ac|roof|paint|clean|leak|handyman|maintenance/.test(t))               return 'home';
            if (/pay|bill|insurance|tax|budget|bank|money|credit|expense|invoice/.test(t))                return 'financial';
            if (/birthday|party|dinner|friend|family|visit|invite|event|celebration/.test(t))             return 'social';
            if (/trip|flight|hotel|vacation|travel|pack|passport|book/.test(t))                           return 'travel';
            if (/private|personal|parenting|discipline|behavior|routine/.test(t))                         return 'parenting';
            if (/project|build|create|design|develop|launch|plan/.test(t))                                return 'projects';
            if (/hurricane|storm|prep|supplies|generator|shutter/.test(t))                                return 'hurricane';
            return 'ideas';
        }

        // ============================================================
        // MAIN APP
        // ============================================================
        function FamilyCoordinator() {

            // ── Shared ────────────────────────────────────────────
            const [activeTab,    setActiveTab]    = useState('schedule');
            const [parent1Name,  setParent1Name]  = useState('Fernando');
            const [parent2Name,  setParent2Name]  = useState('Yenny');
            const [currentWeek,  setCurrentWeek]  = useState('');
            const [syncStatus,   setSyncStatus]   = useState('ready');
            const [lastSyncTime, setLastSyncTime] = useState(null);
            const [categories,   setCategories]   = useState(DEFAULT_CATEGORIES);

            // ── Schedule ──────────────────────────────────────────
            const [parent1Image, setParent1Image] = useState(null);
            const [parent2Image, setParent2Image] = useState(null);
            const [analyzing,    setAnalyzing]    = useState(null);
            const [analyzeError, setAnalyzeError] = useState('');
            const [weekData,     setWeekData]     = useState(null);
            const [expandedDay,  setExpandedDay]  = useState(null);

            // ── Mental Dump ───────────────────────────────────────
            const [captures,      setCaptures]      = useState([]);
            const [textInput,     setTextInput]     = useState('');
            const [captureParent, setCaptureParent] = useState('Fernando');
            const [isRecording,   setIsRecording]   = useState(false);
            const [dumpError,     setDumpError]     = useState('');
            const recognitionRef = useRef(null);

            // ── Organized ─────────────────────────────────────────
            const [expandedCats,  setExpandedCats]  = useState({});
            const [editingId,     setEditingId]      = useState(null);
            const [editingText,   setEditingText]    = useState('');
            const [newCatName,    setNewCatName]     = useState('');
            const [showNewCat,    setShowNewCat]     = useState(false);

            // ── Grocery ───────────────────────────────────────────
            const [groceries,     setGroceries]     = useState([]);
            const [groceryInput,  setGroceryInput]  = useState('');

            // ============================================================
            // SYNC
            // ============================================================
            const syncWithGoogle = async (saveWeek, saveDump, saveGroceries, saveCategories) => {
                if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'PASTE_YOUR_URL_HERE') {
                    setSyncStatus('setup_needed');
                    return;
                }
                try {
                    setSyncStatus('syncing');
                    const isWrite = saveWeek !== undefined || saveDump !== undefined || saveGroceries !== undefined || saveCategories !== undefined;
                    if (isWrite) {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({
                                weekData:   saveWeek       !== undefined ? saveWeek       : weekData,
                                captures:   saveDump       !== undefined ? saveDump       : captures,
                                groceries:  saveGroceries  !== undefined ? saveGroceries  : groceries,
                                categories: saveCategories !== undefined ? saveCategories : categories,
                                parent1Name,
                                parent2Name,
                                currentWeek,
                            })
                        });
                    } else {
                        const res  = await fetch(GOOGLE_SCRIPT_URL);
                        const data = await res.json();
                        if (data?.weekData)    setWeekData(data.weekData);
                        if (data?.captures)    setCaptures(data.captures);
                        if (data?.groceries)   setGroceries(data.groceries);
                        if (data?.categories)  setCategories(data.categories);
                        if (data?.parent1Name) setParent1Name(data.parent1Name);
                        if (data?.parent2Name) setParent2Name(data.parent2Name);
                        if (data?.currentWeek) setCurrentWeek(data.currentWeek);
                    }
                    setSyncStatus('synced');
                    setLastSyncTime(new Date());
                } catch {
                    setSyncStatus('error');
                }
            };

            useEffect(() => {
                syncWithGoogle();
                const interval = setInterval(() => syncWithGoogle(), SYNC_INTERVAL);
                return () => clearInterval(interval);
            }, []);

            // ============================================================
            // SCHEDULE
            // ============================================================
            const handleImageUpload = (parent, e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    if (parent === 1) setParent1Image(reader.result);
                    else              setParent2Image(reader.result);
                };
                reader.readAsDataURL(file);
            };

            const analyzeSchedules = async () => {
                if (!parent1Image || !parent2Image) { setAnalyzeError('Please upload both calendar screenshots first.'); return; }
                setAnalyzeError('');
                setAnalyzing('reading');
                try {
                    const r1 = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514', max_tokens: 1000,
                            messages: [{ role: 'user', content: [
                                { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: parent1Image.split(',')[1] } },
                                { type: 'text', text: `This is ${parent1Name}'s work calendar. Extract only ${parent1Name}'s own meetings for each weekday.\nRules:\n- 12-hour time format\n- IGNORE PTO/OOO entries for other people\n- IGNORE orange/red highlighted reminders for other people\nFormat: Monday (1/26): [time] Title, [time] Title` }
                            ]}]
                        })
                    });
                    const schedule1 = (await r1.json()).content[0].text;

                    const r2 = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514', max_tokens: 1000,
                            messages: [{ role: 'user', content: [
                                { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: parent2Image.split(',')[1] } },
                                { type: 'text', text: `This is ${parent2Name}'s work calendar. Extract only ${parent2Name}'s own meetings for each weekday.\nRules:\n- 12-hour time format\n- IGNORE items with red box/outline (other people's events)\n- IGNORE PTO/OOO for other people\nFormat: Monday (1/26): [time] Title, [time] Title` }
                            ]}]
                        })
                    });
                    const schedule2 = (await r2.json()).content[0].text;

                    setAnalyzing('assigning');
                    const r3 = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514', max_tokens: 2000,
                            messages: [{ role: 'user', content:
                                `Assign Leo's daycare duties using both schedules.\n\n${parent1Name}: ${schedule1}\n\n${parent2Name}: ${schedule2}\n\nWindows:\n- Drop-off: ${DROPOFF_WINDOW.start}–${DROPOFF_WINDOW.end}\n- Pick-up: ${PICKUP_WINDOW.start}–${PICKUP_WINDOW.end}\n- Nap: ${NAP_WINDOW.start}–${NAP_WINDOW.end}\n\nRules: overlap = cannot do duty. If both free, alternate (${parent1Name} first). If neither, assign DISCUSS. Nap: prefer parent who didn't do pickup.\n\nReturn ONLY valid JSON:\n{"week":"Jan 26–30, 2026","days":[{"day":"Monday","date":"1/26","hidden":false,"notes":"","fernando_meetings":[{"time":"9:00 AM","title":"Meeting"}],"yenny_meetings":[{"time":"1:00 PM","title":"Meeting"}],"dropoff":{"assigned":"${parent1Name}","conflict":false,"reason":"reason"},"pickup":{"assigned":"${parent2Name}","conflict":false,"reason":"reason"},"nap":{"assigned":"${parent1Name}","conflict":false,"reason":"reason"}}]}`
                            }]
                        })
                    });
                    const raw = (await r3.json()).content[0].text;
                    const match = raw.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);
                    if (!match) throw new Error('No JSON');
                    const parsed = JSON.parse(match[0]);
                    const normalized = { ...parsed, days: parsed.days.map(d => ({
                        hidden:false,notes:'',fernando_meetings:[],yenny_meetings:[],...d,
                        dropoff:{conflict:false,reason:'',...d.dropoff},
                        pickup: {conflict:false,reason:'',...d.pickup},
                        nap:    {conflict:false,reason:'',...d.nap},
                    }))};
                    if (normalized.week) setCurrentWeek(normalized.week);
                    setWeekData(normalized);
                    syncWithGoogle(normalized, undefined, undefined, undefined);
                } catch(err) {
                    console.error(err);
                    setAnalyzeError('Analysis failed. Check connection and try again.');
                } finally { setAnalyzing(null); }
            };

            const saveSchedule = (nd) => { setWeekData(nd); syncWithGoogle(nd, undefined, undefined, undefined); };
            const toggleAssignment = (di, type) => {
                const nd = { ...weekData, days: weekData.days.map((d,i) => {
                    if (i!==di) return d;
                    const cur = d[type].assigned;
                    return {...d,[type]:{...d[type],assigned: cur===parent1Name?parent2Name:cur===parent2Name?'DISCUSS':parent1Name}};
                })};
                saveSchedule(nd);
            };
            const toggleDayVisibility = (di) => saveSchedule({...weekData,days:weekData.days.map((d,i)=>i===di?{...d,hidden:!d.hidden}:d)});
            const updateNotes = (di, notes) => saveSchedule({...weekData,days:weekData.days.map((d,i)=>i===di?{...d,notes}:d)});
            const exportToClipboard = () => {
                let t = `📅 LEO'S SCHEDULE — ${currentWeek}\n\n`;
                (weekData?.days||[]).filter(d=>!d.hidden).forEach(d=>{
                    t+=`${d.day} ${d.date}:\n  🚗 Drop-off: ${d.dropoff.assigned}\n  🏠 Pick-up: ${d.pickup.assigned}\n  😴 Nap: ${d.nap.assigned}\n`;
                    if(d.notes) t+=`  📝 ${d.notes}\n`;
                    t+='\n';
                });
                navigator.clipboard.writeText(t).then(()=>alert('📋 Copied!'));
            };

            // ============================================================
            // MENTAL DUMP — auto-routes grocery items
            // ============================================================
            const saveCapture = (content, type) => {
                if (isGroceryItem(content)) {
                    const itemName = extractGroceryItem(content) || content;
                    const newItem = { id: Date.now(), name: itemName, completed: false, addedBy: captureParent, timestamp: new Date().toISOString() };
                    const updatedGroceries = [newItem, ...groceries];
                    setGroceries(updatedGroceries);
                    syncWithGoogle(undefined, undefined, updatedGroceries, undefined);
                    setDumpError('');
                    return;
                }
                const newCapture = {
                    id: Date.now(), content,
                    category: guessCategory(content, categories),
                    type, parent: captureParent,
                    timestamp: new Date().toISOString(),
                    completed: false,
                };
                const updated = [newCapture, ...captures];
                setCaptures(updated);
                syncWithGoogle(undefined, updated, undefined, undefined);
                setDumpError('');
            };

            const handleTextSubmit = () => { if(!textInput.trim()) return; saveCapture(textInput.trim(),'text'); setTextInput(''); };

            const startVoice = () => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setDumpError('Voice not supported. Use Chrome.'); return; }
                const rec = new SR();
                rec.lang = 'en-US'; rec.interimResults = false;
                rec.onstart  = () => { setIsRecording(true); setDumpError(''); };
                rec.onend    = () => setIsRecording(false);
                rec.onerror  = (e) => { setIsRecording(false); setDumpError(e.error==='not-allowed'?'Mic blocked. Check permissions.':`Error: ${e.error}`); };
                rec.onresult = (e) => saveCapture(e.results[0][0].transcript, 'voice');
                recognitionRef.current = rec;
                rec.start();
            };
            const stopVoice = () => { recognitionRef.current?.stop(); setIsRecording(false); };

            // ============================================================
            // CAPTURES — edit, recategorize, delete, move to grocery
            // ============================================================
            const toggleDone = (id) => {
                const updated = captures.map(c=>c.id===id?{...c,completed:!c.completed}:c);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined);
            };
            const deleteCapture = (id) => {
                const updated = captures.filter(c=>c.id!==id);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined);
            };
            const startEdit = (cap) => { setEditingId(cap.id); setEditingText(cap.content); };
            const saveEdit = (id) => {
                const updated = captures.map(c=>c.id===id?{...c,content:editingText}:c);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined);
                setEditingId(null); setEditingText('');
            };
            const changeCategory = (id, catId) => {
                const updated = captures.map(c=>c.id===id?{...c,category:catId}:c);
                setCaptures(updated); syncWithGoogle(undefined,updated,undefined,undefined);
            };
            const moveToGrocery = (cap) => {
                const newItem = { id: Date.now(), name: cap.content, completed: false, addedBy: cap.parent, timestamp: new Date().toISOString() };
                const updatedGroceries = [newItem, ...groceries];
                const updatedCaptures  = captures.filter(c=>c.id!==cap.id);
                setGroceries(updatedGroceries);
                setCaptures(updatedCaptures);
                syncWithGoogle(undefined, updatedCaptures, updatedGroceries, undefined);
            };

            // ============================================================
            // CUSTOM CATEGORIES
            // ============================================================
            const addCustomCategory = () => {
                if (!newCatName.trim()) return;
                const newCat = { id: `custom_${Date.now()}`, name: newCatName.trim(), icon: '📌', urgent: false };
                const updated = [...categories, newCat];
                setCategories(updated);
                syncWithGoogle(undefined, undefined, undefined, updated);
                setNewCatName(''); setShowNewCat(false);
            };

            // ============================================================
            // GROCERIES
            // ============================================================
            const addGroceryItem = () => {
                if (!groceryInput.trim()) return;
                const newItem = { id: Date.now(), name: groceryInput.trim(), completed: false, addedBy: captureParent, timestamp: new Date().toISOString() };
                const updated = [newItem, ...groceries];
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined);
                setGroceryInput('');
            };
            const toggleGroceryDone = (id) => {
                const updated = groceries.map(g=>g.id===id?{...g,completed:!g.completed}:g);
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined);
            };
            const deleteGrocery = (id) => {
                const updated = groceries.filter(g=>g.id!==id);
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined);
            };
            const clearCompleted = () => {
                const updated = groceries.filter(g=>!g.completed);
                setGroceries(updated); syncWithGoogle(undefined,undefined,updated,undefined);
            };

            // ============================================================
            // DERIVED
            // ============================================================
            const pending     = captures.filter(c=>!c.completed).length;
            const urgentItems = captures.filter(c=>{ const cat=categories.find(x=>x.id===c.category); return cat?.urgent&&!c.completed; });
            const byCategory  = (id) => captures.filter(c=>c.category===id&&!c.completed);
            const visibleDays = weekData?.days?.filter(d=>!d.hidden)||[];
            const groceryPending = groceries.filter(g=>!g.completed).length;

            const badge = ({
                syncing:      {icon:'🔄',text:'Syncing…',    cls:'text-blue-500'  },
                synced:       {icon:'✅',text:'Synced',       cls:'text-green-600' },
                error:        {icon:'⚠️',text:'Sync error',   cls:'text-red-500'   },
                setup_needed: {icon:'⚙️',text:'Setup needed', cls:'text-orange-500'},
            })[syncStatus]||{icon:'⏸️',text:'Ready',cls:'text-gray-400'};

            // ============================================================
            // RENDER
            // ============================================================
            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8">
                <div className="max-w-5xl mx-auto">

                {/* ── HEADER ─────────────────────────────── */}
                <div className="bg-white rounded-2xl shadow-xl p-5 mb-5">
                    <div className="flex justify-between items-start">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-900">
                                👨‍👩‍👦 Family Coordinator
                                <span className="text-xs font-normal ml-2 px-2 py-0.5 bg-indigo-100 text-indigo-600 rounded-full">v7</span>
                            </h1>
                            {currentWeek && <p className="text-gray-500 text-sm mt-0.5">{currentWeek}</p>}
                            <div className={`flex items-center gap-1.5 mt-1 text-sm ${badge.cls}`}>
                                <span>{badge.icon}</span><span>{badge.text}</span>
                                {lastSyncTime && <span className="text-xs text-gray-400 ml-1">{lastSyncTime.toLocaleTimeString()}</span>}
                            </div>
                        </div>
                        <div className="flex gap-2 text-center">
                            {weekData && <div className="bg-indigo-50 px-3 py-2 rounded-xl"><div className="text-xl font-bold text-indigo-800">{visibleDays.length}</div><div className="text-xs text-gray-500">Days</div></div>}
                            {pending>0 && <div className="bg-amber-50 px-3 py-2 rounded-xl"><div className="text-xl font-bold text-amber-700">{pending}</div><div className="text-xs text-gray-500">Pending</div></div>}
                            {groceryPending>0 && <div className="bg-green-50 px-3 py-2 rounded-xl"><div className="text-xl font-bold text-green-700">{groceryPending}</div><div className="text-xs text-gray-500">Grocery</div></div>}
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3 mt-4">
                        <input type="text" value={parent1Name} onChange={e=>setParent1Name(e.target.value)} className="px-3 py-2 border rounded-xl text-sm" placeholder="Parent 1"/>
                        <input type="text" value={parent2Name} onChange={e=>setParent2Name(e.target.value)} className="px-3 py-2 border rounded-xl text-sm" placeholder="Parent 2"/>
                    </div>
                </div>

                {/* ── TAB BAR ────────────────────────────── */}
                <div className="flex gap-1.5 mb-5 bg-white p-2 rounded-2xl shadow">
                    {[
                        {id:'schedule', label:"📅 Schedule"},
                        {id:'dump',     label:'🎤 Dump'},
                        {id:'organized',label:'🧠 Organized', count:pending},
                        {id:'grocery',  label:'🛒 Grocery',   count:groceryPending},
                    ].map(tab=>(
                        <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
                            className={`flex-1 py-3 px-1 rounded-xl font-medium text-sm transition-all ${activeTab===tab.id?'bg-indigo-600 text-white shadow':'text-gray-600 hover:bg-gray-100'}`}>
                            {tab.label}
                            {tab.count>0 && <span className="ml-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">{tab.count}</span>}
                        </button>
                    ))}
                </div>

                {/* ══════════════════════════════════════
                    TAB 1 — SCHEDULE (unchanged from v6)
                ══════════════════════════════════════ */}
                {activeTab==='schedule' && (
                    <div className="space-y-4">
                        <div className="bg-white rounded-2xl shadow p-6">
                            <h2 className="text-lg font-bold text-indigo-900 mb-1">📸 Upload This Week's Calendars</h2>
                            <p className="text-sm text-gray-500 mb-4">Screenshot each parent's calendar, upload both, then tap Analyze.</p>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                {[1,2].map(n=>{
                                    const img=n===1?parent1Image:parent2Image;
                                    const name=n===1?parent1Name:parent2Name;
                                    return (
                                        <div key={n} className="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center hover:border-indigo-400 transition-colors">
                                            <p className="font-semibold text-gray-700 mb-3">{name}'s Calendar</p>
                                            <input type="file" accept="image/*" onChange={e=>handleImageUpload(n,e)} className="hidden" id={`upload-${n}`}/>
                                            <label htmlFor={`upload-${n}`} className="cursor-pointer block">
                                                {img ? (<><img src={img} alt="" className="w-full h-36 object-cover rounded-lg mb-2"/><p className="text-green-600 text-sm font-medium">✓ Uploaded — tap to replace</p></>) :
                                                (<div className="py-8"><div className="text-4xl mb-2">📷</div><p className="text-indigo-600 text-sm font-medium">Tap to upload screenshot</p></div>)}
                                            </label>
                                        </div>
                                    );
                                })}
                            </div>
                            <button onClick={analyzeSchedules} disabled={!parent1Image||!parent2Image||!!analyzing}
                                className="w-full py-4 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                                {analyzing==='reading'?'🔍 Reading calendars…':analyzing==='assigning'?'🧠 Assigning duties…':'✨ Analyze & Assign Duties'}
                            </button>
                            {analyzeError && <p className="mt-3 text-sm text-red-600 text-center">{analyzeError}</p>}

                        {captures.length>0 && (

                                        return (
                                            <div key={cap.id} className={`flex items-start gap-3 p-3 rounded-xl border ${cap.completed?'opacity-40 bg-gray-50':'bg-white'}`}>

                                                        <span className={`text-xs px-2 py-0.5 rounded-full ${cap.parent===parent1Name?'bg-blue-50 text-blue-700':'bg-pink-50 text-pink-700'}`}>{cap.parent}</span>

                                <div className="text-5xl mb-3">💭</div>
                                <p className="font-medium text-gray-600">Nothing captured yet</p>
                                <p className="text-sm mt-1">Tap the mic or type something above</p>

                {/* ══════════════════════════════════════
                    TAB 3 — ORGANIZED
                    New: inline edit, category dropdown,
                    custom categories, move to grocery
                ══════════════════════════════════════ */}
                {activeTab==='organized' && (
                    <div className="space-y-3">

                        {urgentItems.length>0&&(
                            <div className="bg-red-50 border-l-4 border-red-500 rounded-2xl p-4">

                                    return (
                                        <div key={cap.id} className="flex items-center gap-2 text-sm text-red-700 mb-1">

                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        <div className="grid grid-cols-3 gap-3">
                            {[
                                {label:'Pending',    value:pending,                                                             cls:'text-indigo-700'},
                                {label:'Done',       value:captures.filter(c=>c.completed).length,                             cls:'text-green-600' },

                                </div>

                        {categories.map(cat=>{

                            return (

                                            <span className="text-2xl">{cat.icon}</span>
                                            <span className="font-semibold text-gray-800">{cat.name}</span>

                                                            <span className="text-xs text-gray-400">{cap.type==='voice'?'🎤':'⌨️'} {new Date(cap.timestamp).toLocaleDateString()}</span>
                                                        </div>
                                                    </div>

                                                    <div className="flex flex-col gap-1 flex-shrink-0">
                                                        {editingId!==cap.id && (

                                                        <button onClick={()=>moveToGrocery(cap)}
                                                            className="text-xs text-gray-400 hover:text-green-600 px-1.5 py-0.5 rounded hover:bg-green-50 transition-colors"

                                                        <button onClick={()=>deleteCapture(cap.id)}
                                                            className="text-gray-300 hover:text-red-400 text-lg leading-none">×</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        {!pending&&(
                            <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
                                <div className="text-5xl mb-3">🧠</div>
                                <p className="font-medium text-gray-600">All clear!</p>
                                <p className="text-sm mt-1">No pending items. Add thoughts in the Mental Dump tab.</p>
                            </div>
                        )}
                    </div>
                )}

                {/* ══════════════════════════════════════
                    TAB 4 — GROCERY LIST
                ══════════════════════════════════════ */}
                {activeTab==='grocery' && (
                    <div className="space-y-4">

                        {/* Add item */}
                        <div className="bg-white rounded-2xl shadow p-5">
                            <h2 className="font-bold text-gray-800 mb-3">🛒 Grocery List</h2>
                            <div className="flex gap-2 mb-2">
                                <input type="text" value={groceryInput}
                                    onChange={e=>setGroceryInput(e.target.value)}
                                    onKeyDown={e=>e.key==='Enter'&&addGroceryItem()}
                                    placeholder="Add an item…"
                                    className="flex-1 px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-400"/>
                                <button onClick={addGroceryItem} disabled={!groceryInput.trim()}
                                    className="px-5 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 disabled:opacity-40 text-xl font-bold">+</button>
                            </div>
                            <p className="text-xs text-gray-400">
                                Items auto-added from Mental Dump when you say "we need X" or "out of X"
                            </p>
                        </div>

                        {/* List */}
                        {groceries.length>0 ? (
                            <div className="bg-white rounded-2xl shadow p-5">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-gray-800">
                                        {groceryPending} item{groceryPending!==1?'s':''} to get
                                        {groceries.filter(g=>g.completed).length>0&&(
                                            <span className="text-gray-400 font-normal text-sm ml-2">· {groceries.filter(g=>g.completed).length} done</span>
                                        )}
                                    </h3>
                                    {groceries.some(g=>g.completed)&&(
                                        <button onClick={clearCompleted} className="text-xs text-red-400 hover:text-red-600 font-medium">
                                            Clear done
                                        </button>
                                    )}
                                </div>

                                {/* Pending items */}
                                <div className="space-y-1.5 mb-4">
                                    {groceries.filter(g=>!g.completed).map(item=>(
                                        <div key={item.id} className="flex items-center gap-3 p-3 rounded-xl border bg-white hover:bg-gray-50 transition-colors">
                                            <button onClick={()=>toggleGroceryDone(item.id)} className="flex-shrink-0">
                                                <div className="w-6 h-6 rounded-full border-2 border-gray-300 hover:border-green-500 flex items-center justify-center transition-colors"/>
                                            </button>
                                            <span className="flex-1 text-sm text-gray-800 font-medium">{item.name}</span>
                                            <span className={`text-xs px-2 py-0.5 rounded-full flex-shrink-0 ${item.addedBy===parent1Name?'bg-blue-50 text-blue-600':'bg-pink-50 text-pink-600'}`}>
                                                {item.addedBy}
                                            </span>
                                            <button onClick={()=>deleteGrocery(item.id)} className="text-gray-300 hover:text-red-400 text-xl flex-shrink-0">×</button>
                                        </div>
                                    ))}
                                </div>

                                {/* Completed items */}
                                {groceries.some(g=>g.completed)&&(
                                    <>
                                        <p className="text-xs text-gray-400 font-medium uppercase tracking-wide mb-2">In cart</p>
                                        <div className="space-y-1.5">
                                            {groceries.filter(g=>g.completed).map(item=>(
                                                <div key={item.id} className="flex items-center gap-3 p-3 rounded-xl border bg-gray-50 opacity-60">
                                                    <button onClick={()=>toggleGroceryDone(item.id)} className="flex-shrink-0">
                                                        <div className="w-6 h-6 rounded-full bg-green-500 flex items-center justify-center text-white text-xs font-bold">✓</div>
                                                    </button>
                                                    <span className="flex-1 text-sm text-gray-500 line-through">{item.name}</span>
                                                    <button onClick={()=>deleteGrocery(item.id)} className="text-gray-300 hover:text-red-400 text-xl flex-shrink-0">×</button>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                            </div>
                        ) : (
                            <div className="text-center py-14 text-gray-400 bg-white rounded-2xl shadow">
                                <div className="text-5xl mb-3">🛒</div>
                                <p className="font-medium text-gray-600">List is empty</p>
                                <p className="text-sm mt-1">Add items above or say "we need milk" in the Mental Dump</p>
                            </div>
                        )}
                    </div>
                )}

                </div>
                </div>
            );
        }

        ReactDOM.render(<FamilyCoordinator />, document.getElementById('root'));
    </script>

    function doGet() {
      var ss         = SpreadsheetApp.getActiveSpreadsheet();

      var grocSheet  = ss.getSheetByName('Groceries')  || ss.insertSheet('Groceries');
      var catSheet   = ss.getSheetByName('Categories') || ss.insertSheet('Categories');

      var weekData   = null;

      var groceries  = [];
      var categories = [];
      var meta       = {};

      try { weekData   = JSON.parse(sched.getRange('A1').getValue());     } catch(e) {}
      try { captures   = JSON.parse(dump.getRange('A1').getValue());      } catch(e) {}

      try { meta       = JSON.parse(sched.getRange('B1').getValue());     } catch(e) {}

      return ContentService
        .createTextOutput(JSON.stringify({
          weekData:   weekData,
          captures:   captures,
          groceries:  groceries,
          categories: categories.length ? categories : null,
          parent1Name: meta.parent1Name || 'Fernando',
          parent2Name: meta.parent2Name || 'Yenny',
          currentWeek: meta.currentWeek || ''
        }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    function doPost(e) {

      if (body.weekData !== undefined) {
        var sched = ss.getSheetByName('Schedule') || ss.insertSheet('Schedule');

          parent1Name: body.parent1Name,
          parent2Name: body.parent2Name,
          currentWeek: body.currentWeek
        }));
      }
      if (body.captures !== undefined) {

        dump.getRange('A1').setValue(JSON.stringify(body.captures));
      }
      if (body.groceries !== undefined) {
        var grocSheet = ss.getSheetByName('Groceries') || ss.insertSheet('Groceries');
        grocSheet.getRange('A1').setValue(JSON.stringify(body.groceries));
      }
      if (body.categories !== undefined) {
        var catSheet = ss.getSheetByName('Categories') || ss.insertSheet('Categories');
        catSheet.getRange('A1').setValue(JSON.stringify(body.categories));
      }

      return ContentService
        .createTextOutput(JSON.stringify({ ok: true }))
        .setMimeType(ContentService.MimeType.JSON);
